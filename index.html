  /* ------------------------------------------------------- combat report */
  // Laid out as Form 'F', the RAF combat report of the period. Own casualties
  // are stated before enemy casualties, as they were: the squadron's own losses
  // were the first thing Group wanted.
  reportHTML(r){
    const where = r.convoy ? `convoy ${r.convoy} off ${r.place}` : r.place;
    const ourLosses = r.sections.reduce((t,sec) => t + sec.lines.filter(l => l.cls === 'loss').length, 0);
    const enemyLine = [r.claims && `${r.claims} destroyed`, r.shared && `${r.shared} shared`,
                       r.damagedClaims && `${r.damagedClaims} damaged`].filter(Boolean).join(', ') || 'Nil';
    const metLine = r.met && Object.keys(r.met).length
      ? Object.entries(r.met).map(([k,v]) => `${v} ${k}`).join(', ')
      : 'None. The plot was not intercepted.';
    const field = (k,v) => `<div class="ff"><span class="fk">${k}</span><span class="fv">${v}</span></div>`;

    let h = `<div class="sheet">
      <div class="sheetinner">
        <div class="formhead">
          <span class="formno">FORM &lsquo;F&rsquo;</span>
          <span class="formtitle">Combat Report</span>
          <span class="formno">SECRET</span>
        </div>
        <div class="fields">
          ${field('Squadron', CAMPAIGN.squadron.name)}
          ${field('Date', r.date)}
          ${field('Station', r.station)}
          ${field(r.contact ? 'Time attack delivered' : 'Time up', r.time)}
          ${field(r.contact ? 'Place of attack' : 'Area patrolled', where)}
          ${field('Our aircraft up',
            r.up + ' ' + BALANCE.types[CAMPAIGN.squadron.aircraft].short + 's')}
        </div>
        <div class="fieldband">
          ${field('Our casualties', [
            r.killed && `${r.killed} failed to return`,
            r.wounded && `${r.wounded} wounded`,
            r.walkedBack && `${r.walkedBack} shot down, returned to the squadron`
          ].filter(Boolean).join(', ') || 'Nil')}
          ${field('Our aircraft', [
            r.aircraftLost && `${r.aircraftLost} lost`,
            r.damaged && `${r.damaged} damaged`
          ].filter(Boolean).join(', ') || 'None lost or damaged')}
        </div>
        <div class="fields">
          ${field('Enemy casualties', enemyLine)}
          ${field('Enemy reported', r.reported + '+')}
          ${r.target ? field('Their objective', r.target) : ''}
          ${r.contact ? `<div class="ff"><span class="fk">Result</span>` +
            `<span class="fv ${r.raidBroken ? 'good' : 'bad'}">${r.raidBroken
              ? 'Raid broken up. It did not reach its target.'
              : (r.stationHit
                 ? 'They bombed this station. ' + r.stationHit + ' aircraft destroyed on the ground.'
                 : 'They got through.')}</span></div>` : ''}
          ${r.contact ? field('Enemy strength', r.strength + ' aircraft, ' + r.engaged + ' engaged') : ''}
          ${field('Enemy aircraft seen', metLine)}
          ${r.contact && r.unengaged ? field('Passed unengaged', r.unengaged + ' aircraft') : ''}
        </div>
        <div class="account">`;

    for (const sec of r.sections){
      h += `<div class="secblock">
        <div class="seclab">${sec.name} Section</div>
        <p class="hand names">${sec.pilots.join(', ')}</p>`;
      if (sec.quiet) h += `<p class="hand">${
        r.contact ? 'Could not close with the enemy formation.'
        : sec.sighted ? 'Sighted them. Could not get up to them.'
        : 'Patrolled as ordered. Nothing seen.'}</p>`;
      else {
        if (!sec.lines.length) h += `<p class="hand">No combat report filed.</p>`;
        sec.lines.forEach(l => h += `<p class="hand ${l.cls}">${l.text}</p>`);
        if (sec.ally) h += `<p class="hand faintink">${sec.ally.name} ${sec.ally.type}s ` +
          `${sec.ally.task || 'were in the same fight'} — ` +
          `${sec.ally.claims ? sec.ally.claims + ' claimed' : 'no claims'}, ` +
          `${sec.ally.lost ? sec.ally.lost + ' lost' : 'none lost'}.</p>`;
      }
      h += `</div>`;
    }

    const boss = Season.commander();
    h += `      </div>
        <div class="sig">
          <span class="signed hand">${boss ? Pilot.name(boss) : ''}</span>
          <span class="sigrule">Officer Commanding, ${CAMPAIGN.squadron.name}</span>
        </div>
      </div>
    </div>`;
    return h;
  },

  /* -------------------------------------------------------------- records */
  records(el){
    const s = Season.s;
    const all = s.roll.slice();
    const board = (title, key, fmt) => {
      const men = all.filter(p => (key(p) || 0) > 0)
        .sort((a,b) => key(b) - key(a) || b.sorties - a.sorties).slice(0, 8);
      if (!men.length) return `<div class="board board2"><h3 class="chalkhead">${title}</h3>` +
        `<p class="chalk chalkdim">Nothing yet.</p></div>`;
      const top = key(men[0]) || 1;
      return `<div class="board board2"><h3 class="chalkhead">${title}</h3>` + men.map((p,i) => {
        const gone = ['killed','missing','invalided'].includes(p.status);
        return `<div class="brow${gone ? ' gone' : ''}">
          <span class="bpos chalk">${i+1}</span>
          <span class="bname chalk">${Pilot.name(p)}${gone ? ' †' : ''}${
            p.awards.length ? ' <span class="awards">' + p.awards.join(', ') + '</span>' : ''}</span>
          <span class="bbar"><i style="width:${Math.round(key(p)/top*100)}%"></i></span>
          <span class="bval chalk">${fmt ? fmt(p) : key(p)}</span></div>`;
      }).join('') + `</div>`;
    };

    el.innerHTML = `<h2>Squadron records</h2>
      <div class="panel">
        <div class="strength" style="margin:0;justify-content:flex-start">
          <span>Destroyed <b>${s.tally.claims}</b></span>
          <span>Shared <b>${s.tally.shared}</b></span>
          <span>Damaged <b>${s.tally.damaged}</b></span>
          <span>Sorties flown <b>${s.tally.sorties}</b></span>
          <span>Pilots lost <b>${s.tally.losses}</b></span>
          <span>Raids broken up <b>${s.tally.raidsStopped || 0}</b></span>
          <span>Raids that got through <b>${s.tally.raidsThrough || 0}</b></span>
          <span>Passed through the squadron <b>${all.length}</b></span>
        </div>
      </div>
      <div class="boards">
        ${board('Most destroyed', p => p.kills)}
        ${board('Most shared', p => p.shared)}
        ${board('Most damaged', p => p.damaged)}
        ${board('Most sorties', p => p.sorties)}
        ${board('Most hours on type', p => p.hours)}
      </div>
      <div class="note">† no longer with the squadron. All-time figures, including men lost.</div>`;
  },

  /* ----------------------------------------------------------- diary/roll */
  // Form 541 — the Operations Record Book, typed up on foolscap each evening.
  diary(el){
    const d = Season.s.diary;
    el.innerHTML = `<h2>Squadron diary</h2>
      <div class="orb">
        <div class="orbhead">
          <span class="formno">R.A.F. FORM 541</span>
          <span class="formtitle">Operations Record Book</span>
          <span class="formno">${CAMPAIGN.squadron.name}</span>
        </div>
        <div class="orbbody">` +
      (d.length ? d.map(e => `<div class="orbentry">
          <div class="orbdate">${e.date}<br><span style="color:#5f5741">${e.station}</span></div>
          <div class="orbtext">${e.lines.map(l => `<p>${l}</p>`).join('')}</div>
        </div>`).join('')
        : `<p class="orbtext">No entries.</p>`) +
      `</div></div>`;
  },

  roll(el){
    const gone = Season.s.roll.filter(p => ['killed','missing','transferred','invalided'].includes(p.status))
      .sort((a,b) => (b.lostOn||0) - (a.lostOn||0));
    if (!gone.length){
      el.innerHTML = `<h2>Roll of honour</h2><div class="oak">
        <div class="oakhead">${CAMPAIGN.squadron.name}</div>
        <div class="oaksub">The squadron has lost no one.</div></div>`;
      return;
    }
    el.innerHTML = `<h2>Roll of honour</h2>
      <div class="oak">
        <div class="oakhead">${CAMPAIGN.squadron.name}</div>
        <div class="oaksub">In memory of those who did not return · 1940</div>
        <div class="plates">` + gone.map(p => `
          <div class="plate">
            ${UI.photo(p)}
            <div class="pn">${CAMPAIGN.ranks[p.rank].short} ${p.first} ${p.last}</div>
            <div class="pd">${p.status === 'killed' ? 'Killed in action'
              : p.status === 'missing' ? 'Failed to return'
              : p.status === 'invalided' ? 'Invalided from flying'
              : 'Posted away'}${p.lostDate ? ' · ' + p.lostDate : ''}</div>
            <div class="pf">${p.nationLabel ? p.nationLabel + ' · ' : ''}${p.hours} hours on type · ${p.sorties} sorties</div>
            ${UI.claimRow(p)}
            ${UI.ribbons(p)}
          </div>`).join('') + `</div></div>`;
  }
};

window.Squadron = {
  BALANCE, CAMPAIGN, GEOGRAPHY, BATTLE, Battle, Pilot, Season,
  // Headless: run months of the war and look at the numbers before trusting them.
  run(days, seed){
    Season.start(seed);
    for (let i = 0; i < days; i++){
      let guard = 0;
      while (Season.s.pending && guard++ < 20){
        const max = Season.maxCommit();
        if (max >= 3) Season.fly(Math.min(max, 6)); else Season.decline();
        Season.nextCall();
      }
      Season.endDay();
    }
    const s = Season.s;
    return { days, station: Season.station().name, group: Season.group().name,
      claims: s.tally.claims, pilotsLost: s.tally.losses, sorties: s.tally.sorties,
      strain: Math.round(Season.strain()), standing: Math.round(s.standing),
      everServed: s.roll.length,
      survivors: Season.activePilots().map(p =>
        ({ name: Pilot.name(p), kills: p.kills, sorties: p.sorties, awards: p.awards })) };
  }
};

window.addEventListener('error', ev => {
  console.error(ev.error || ev.message);
  const el = document.getElementById('view');
  if (el && !el.innerHTML) UI.fatal(ev.error || { message: ev.message });
});

/* headless: UI.boot disabled */

UI.boot();
</script>
</body>
</html>
