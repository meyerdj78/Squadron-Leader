/* ============================================================================
   SAVING. Two backends, because this file has two lives: running inside the
   app, where window.storage persists against the account, and downloaded and
   opened from disk, where localStorage is all there is. Plus an export file so
   a campaign can be moved or kept.

   The awkward part is not the writing, it is that the live state holds object
   references (a pilot appears in both `pilots` and `roll`), a Set, a Date, and
   pointers into the CAMPAIGN tables. So `roll` is the master record and
   everything else is stored as identifiers and rebuilt on load.
   ========================================================================== */
const SAVE_KEY = 'squadron-leader-save-v2';
const SAVE_VERSION = 2;

const Store = {
  status: { backend: 'not tested yet', ok: false, detail: '' },

  // Detection by assertion, not by feature-sniffing: write a probe, read it
  // back, compare. A backend that exists but silently discards writes is worse
  // than none at all, and that is exactly what a sandboxed frame can do.
  async probe(){
    const key = SAVE_KEY + '-probe', stamp = 'p' + Date.now();
    if (typeof window !== 'undefined' && window.storage){
      try {
        await window.storage.set(key, stamp);
        const r = await window.storage.get(key);
        if (r && r.value === stamp){
          await window.storage.delete(key);
          Store.status = { backend: 'account storage', ok: true, detail: 'saves follow your account' };
          return Store.status;
        }
        Store.status.detail = 'account storage did not read back';
      } catch(e){ Store.status.detail = 'account storage: ' + e.message; }
    }
    const l = Store.local();
    if (l){
      try {
        l.setItem(key, stamp);
        const back = l.getItem(key);
        l.removeItem(key);
        if (back === stamp){
          Store.status = { backend: 'browser storage', ok: true,
            detail: 'saves stay in this browser on this device' };
          return Store.status;
        }
        Store.status.detail += ' browser storage did not read back';
      } catch(e){ Store.status.detail += ' browser storage: ' + e.message; }
    }
    try {
      await Store.idbDo('readwrite', st => st.put(stamp, key));
      const back = await Store.idbDo('readonly', st => st.get(key));
      if (back === stamp){
        await Store.idbDo('readwrite', st => st.delete(key));
        Store.status = { backend: 'browser database', ok: true,
          detail: 'saves stay in this browser on this device' };
        return Store.status;
      }
      Store.status.detail += ' database did not read back';
    } catch(e){ Store.status.detail += ' database: ' + e.message; }

    Store.status = { backend: 'none', ok: false,
      detail: Store.status.detail || 'this viewer blocks every storage route' };
    return Store.status;
  },

  // Some sandboxes block localStorage but permit IndexedDB, so it is worth a
  // third attempt before giving up on saving altogether.
  idb(){
    try { return typeof indexedDB !== 'undefined' ? indexedDB : null; } catch(e){ return null; }
  },
  idbDo(mode, fn){
    return new Promise((res, rej) => {
      const db = Store.idb();
      if (!db) return rej(new Error('no indexedDB'));
      const open = db.open('squadron-leader', 1);
      open.onupgradeneeded = () => open.result.createObjectStore('saves');
      open.onerror = () => rej(open.error || new Error('indexedDB refused'));
      open.onsuccess = () => {
        try {
          const tx = open.result.transaction('saves', mode);
          const req = fn(tx.objectStore('saves'));
          req.onsuccess = () => res(req.result);
          req.onerror = () => rej(req.error);
        } catch(e){ rej(e); }
      };
    });
  },

  available: () => (typeof window !== 'undefined' && !!window.storage) || Store.local() || Store.idb(),
  local(){ try { return typeof localStorage !== 'undefined' && localStorage; } catch(e){ return null; } },
  async get(key){
    if (typeof window !== 'undefined' && window.storage){
      try { const r = await window.storage.get(key); return r ? r.value : null; } catch(e){ return null; }
    }
    const l = Store.local();
    if (l){ const v = l.getItem(key); if (v != null) return v; }
    try { const v = await Store.idbDo('readonly', st => st.get(key)); if (v != null) return v; } catch(e){}
    return null;
  },
  async set(key, val){
    if (typeof window !== 'undefined' && window.storage){
      try { await window.storage.set(key, val); return true; } catch(e){ return false; }
    }
    const l = Store.local();
    if (l){ try { l.setItem(key, val); return true; } catch(e){} }
    try { await Store.idbDo('readwrite', st => st.put(val, key)); return true; } catch(e){}
    return false;
  },
  async del(key){
    if (typeof window !== 'undefined' && window.storage){
      try { await window.storage.delete(key); return true; } catch(e){ return false; }
    }
    const l = Store.local(); if (l) l.removeItem(key); return true;
  }
};

const Save = {
  lastSaved: null,
  timer: null,

  packCall: c => ({ time:c.time, typeId:c.type.id, place:c.place, convoy:c.convoy,
                    convoyKind:c.convoyKind, ships:c.ships, ship:c.ship, shipName:c.shipName,
                    target:c.target || null,
                    reported:c.reported, strength:c.strength, willContact:c.willContact,
                    height:c.height, pleaded:c.pleaded || 0 }),
  unpackCall: d => ({ ...d, type: CAMPAIGN.callTypes.find(t => t.id === d.typeId) }),

  serialise(){
    const s = Season.s;
    return {
      v: SAVE_VERSION, saved: new Date().toISOString(),
      setup: s.setup, awaitingSetup: !!s.awaitingSetup,
      rand: Rand.getState(),
      date: s.date.toISOString(),
      day: s.day, week: s.week, stationId: s.stationId, restDays: s.restDays,
      standing: s.standing, groundCrewFatigue: s.groundCrewFatigue,
      roll: s.roll,                                   // the master pilot record
      pilotIds: s.pilots.map(p => p.id),              // who is still on strength
      aircraft: s.aircraft,
      weather: s.weather ? s.weather.name : null,
      calls: s.calls.map(Save.packCall),
      callIndex: s.callIndex,
      pendingIndex: s.pending ? s.calls.indexOf(s.pending) : -1,
      report: s.report,
      incident: s.incident ? { id: s.incident.def.id,
        pilotId: s.incident.ctx.pilot ? s.incident.ctx.pilot.id : null,
        aircraftId: s.incident.ctx.aircraft ? s.incident.ctx.aircraft.id : null } : null,
      recommendation: s.recommendation,
      citations: s.citations,
      diary: s.diary, dayLines: s.dayLines,
      tally: s.tally, recentLosses: s.recentLosses,
      selected: [...s.selected], trainingChoice: s.trainingChoice || null,
      pendingWriteOffs: s.pendingWriteOffs || 0,
      incidentSeen: s.incidentSeen || {},
      // Everything added since the save was first written. Missing any one of
      // these silently loses a whole mechanic on reload.
      upgrades: s.upgrades || {},
      harmonisation: s.harmonisation || null,
      presenceLog: s.presenceLog || [],
      lastPresenceRemark: s.lastPresenceRemark || null,
      unableDays: s.unableDays || [],
      vignetteSeen: s.vignetteSeen || {},
      serviceableYesterday: s.serviceableYesterday || 0,
      lastLost: s._lastLost || 0
    };
  },

  restore(d){
    if (!d || !d.roll || !d.pilotIds) throw new Error('not a saved campaign');
    // Older saves are migrated rather than refused — losing a campaign to a
    // version bump is worse than filling in a few defaults.
    d.citations = d.citations || [];
    d.selected  = d.selected  || [];
    d.diary     = d.diary     || [];
    d.dayLines  = d.dayLines  || [];
    d.calls     = d.calls     || [];
    d.recentLosses = d.recentLosses || [];
    d.aircraft  = d.aircraft  || [];
    d.tally = Object.assign({ claims:0, shared:0, damaged:0, losses:0, sorties:0, aircraftLost:0 }, d.tally || {});
    for (const p of d.roll){
      p.shared = p.shared || 0; p.damaged = p.damaged || 0;
      p.awards = p.awards || []; p.recommended = p.recommended || {};
      p.permanentHarm = p.permanentHarm || []; p.notableActions = p.notableActions || 0;
      p.flight = p.flight || 'A'; p.burden = p.burden || 0;
      if (p.aptitude === undefined) p.aptitude = CAMPAIGN.aptitude.mean;
      p.aptitudeSeen = p.aptitudeSeen || 0;
      if (p.section === undefined) p.section = null;
      if (p.portrait === undefined) p.portrait = Pilot.portraitFor(p.nationality || 'british');
      if (typeof p.injury === 'string') p.injury = { id:'legacy', name:p.injury, since:d.day || 1 };
    }
    if (!d.roll.some(p => p.isCommander)){
      const boss = d.roll.find(p => p.status === 'active');
      if (boss){ boss.isCommander = true; boss.rank = CAMPAIGN.ranks.length - 1; boss.commandSince = d.day || 1; }
    }
    Rand = makeRand(1); Rand.setState(d.rand);
    NameBook.seed(d.roll);
    if (d.setup) Season.applySetup(d.setup);
    const byId = new Map(d.roll.map(p => [p.id, p]));
    const calls = d.calls.map(Save.unpackCall);
    const s = {
      date: new Date(d.date), day: d.day, week: d.week,
      stationId: d.stationId, restDays: d.restDays,
      standing: d.standing, groundCrewFatigue: d.groundCrewFatigue,
      roll: d.roll,
      pilots: d.pilotIds.map(id => byId.get(id)).filter(Boolean),
      aircraft: d.aircraft,
      weather: CAMPAIGN.weather.find(w => w.name === d.weather) || CAMPAIGN.weather[0],
      calls, callIndex: d.callIndex,
      pending: d.pendingIndex >= 0 ? calls[d.pendingIndex] : null,
      report: d.report, recommendation: d.recommendation,
      citations: d.citations, diary: d.diary, dayLines: d.dayLines,
      tally: d.tally, recentLosses: d.recentLosses,
      selected: new Set(d.selected), trainingChoice: d.trainingChoice || null,
      pendingWriteOffs: d.pendingWriteOffs, _lastLost: d.lastLost,
      incidentSeen: d.incidentSeen || {},
      upgrades: d.upgrades || {},
      harmonisation: d.harmonisation || null,
      presenceLog: d.presenceLog || [],
      lastPresenceRemark: d.lastPresenceRemark || null,
      unableDays: d.unableDays || [],
      vignetteSeen: d.vignetteSeen || {},
      serviceableYesterday: d.serviceableYesterday || 0,
      battle: null,
      setup: d.setup || null, awaitingSetup: !!d.awaitingSetup,
      incident: null
    };
    Season.s = s;
    if (d.incident){
      const def = INCIDENTS.find(i => i.id === d.incident.id);
      if (def) s.incident = { def, ctx: {
        pilot: d.incident.pilotId ? byId.get(d.incident.pilotId) : undefined,
        aircraft: d.incident.aircraftId ? s.aircraft.find(a => a.id === d.incident.aircraftId) : undefined
      } };
    }
    return s;
  },

  lastError: null,

  async write(){
    try {
      const ok = await Store.set(SAVE_KEY, JSON.stringify(Save.serialise()));
      if (ok){ Save.lastSaved = new Date(); Save.lastError = null; }
      else Save.lastError = 'the write was refused';
      return ok;
    } catch(e){ Save.lastError = e.message; return false; }
  },

  // The one route that cannot be blocked: the save as text, to copy out and
  // paste back. No storage, no downloads, no permissions.
  toText(){ return JSON.stringify(Save.serialise()); },
  fromText(txt){
    Save.restore(JSON.parse(txt.trim()));
    Save.now();
  },

  // Called on every render; debounced so a burst of clicks is one write.
  schedule(){
    clearTimeout(Save.timer);
    Save.timer = setTimeout(() => Save.write().then(() => UI.stamp && UI.stamp()), 1200);
  },

  // Called after anything irreversible — a sortie flown, a day ended, a man
  // lost. A debounce is fine for browsing; it is not fine for those.
  now(){
    clearTimeout(Save.timer);
    return Save.write().then(ok => { if (UI.stamp) UI.stamp(); return ok; });
  },

  async load(){
    const raw = await Store.get(SAVE_KEY);
    if (!raw) return null;
    try { return Save.restore(JSON.parse(raw)); } catch(e){ return null; }
  },

  async exists(){ return !!(await Store.get(SAVE_KEY)); },

  // A file the player owns, for moving between devices or keeping a campaign.
  exportFile(){
    const blob = new Blob([JSON.stringify(Save.serialise(), null, 1)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `74 Squadron — ${Season.dateLabel().replace(/\s+/g,' ')}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },

  importFile(file, done){
    const r = new FileReader();
    r.onload = () => {
      try { Save.restore(JSON.parse(r.result)); Save.now(); done(true); }
      catch(e){ console.error('import failed', e); done(false, e.message); }
    };
    r.readAsText(file);
  }
};

/* ============================================================================
   PART 5 — UI
   ========================================================================== */
const UI = {
  tab: 'ops',

  async boot(){
    try {
      try { await Store.probe(); } catch(e){}
      let resumed = null;
      try { resumed = await Save.load(); }
      catch(e){ resumed = null; }          // a bad save must never block the game
      if (!resumed) Season.start();
      UI.resumed = !!resumed;
      UI.render();
    } catch(e){
      try { await Store.del(SAVE_KEY); Season.start(); UI.render(); }
      catch(e2){ UI.fatal(e2); }
    }
  },

  // Render is three independent stages. One failing stage should cost you that
  // stage, not the whole screen — a blank page tells you nothing.
  render(){
    UI.stage('header', () => UI.header());
    UI.stage('tote',   () => { if (!Season.s.awaitingSetup) UI.tote(); else UI.html('tote',''); });
    UI.stage('tabs',   () => { if (!Season.s.awaitingSetup) UI.tabs(); else UI.html('tabs',''); });
    UI.stage('view',   () => UI.view());
    UI.stage('sidebar',() => UI.sidebar());
  },

  stage(name, fn){
    try { fn(); }
    catch(e){
      console.error('render stage failed:', name, e);
      UI.note(name + ': ' + e.message);
    }
  },

  note(msg){
    const el = document.getElementById('view');
    if (!el) return;
    const box = document.createElement('div');
    box.className = 'panel faultbox';
    box.innerHTML = `<div class="when">Fault</div><p class="meta">${msg}</p>`;
    el.appendChild(box);
  },

  fatal(e){
    document.body.innerHTML =
      `<div style="padding:24px;font:13px ui-monospace,monospace;color:#eef3fa;background:#0a1220">
        <p><b>The game could not start.</b></p><p style="color:#a9bcd4">${e && e.message}</p>
        <p style="color:#8095b0">Reload to try again with a clean squadron.</p></div>`;
  },

  /* ---------------------------------------------------------------- header */
  header(){
    const s = Season.s, st = Season.station(), g = Season.group();
    UI.set('sqnName', CAMPAIGN.squadron.name);
    UI.set('stationLine', st.name + ', ' + st.county + ' · ' + g.name);
    UI.set('clock', Season.dateLabel());
    UI.set('phaseLine', Season.phase().name);
    const w = s.weather || CAMPAIGN.weather[0];
    UI.html('weather', `<span class="wicon">${UI.weatherIcon(w.name)}</span> ${w.note}` +
      (w.flying === 0 ? ' <b>No flying.</b>' : ''));
    const ready = Season.readyPilots().length, serv = Season.serviceable().length;
    const short = ready > serv;
    if (s.awaitingSetup){ UI.html('strength',''); UI.set('phaseLine',''); UI.html('weather',''); }
    const strain = Math.round(Season.strain());
    const col = strain > 58 ? 'var(--bad)' : strain > 40 ? 'var(--warn)' : 'var(--good)';
    const estP = CAMPAIGN.squadron.pilotEstablishment;
    const estA = CAMPAIGN.squadron.aircraftEstablishment;
    const stat = (tip, icon, value, label, cls) =>
      `<span class="stat${cls ? ' ' + cls : ''}" title="${tip}">` +
        `<span class="statline">${icon}${value}</span>` +
        `<span class="statlab">${label}</span></span>`;
    UI.html('strength',
      stat(`Pilots at readiness, against an establishment of ${estP}`,
        UI.icon('pilots'), `<b>${ready}</b>/${estP}`, 'Available') +
      stat(`Aircraft serviceable, against an establishment of ${estA}` +
        `${short ? ' — short by ' + (ready - serv) + ' for the pilots available' : ''}`,
        UI.icon('aircraft'), `<b>${serv}</b>/${estA}`, 'Serviceable', short ? 'shortage' : '') +
      stat('Enemy aircraft destroyed, shared and damaged', UI.claimMarks(),
        `<b>${s.tally.claims}</b>/<b>${s.tally.shared}</b>/<b>${s.tally.damaged}</b>`,
        'Destroyed &middot; shared &middot; damaged') +
      stat('Pilots killed or missing', UI.icon('lost'), `<b>${s.tally.losses}</b>`, 'Lost') +
      stat(`Fatigue, morale and recent losses together. Group takes a squadron out of ` +
        `the line above ${CAMPAIGN.command.strainForRelief}.`,
        UI.icon('strain'), `<b style="color:${col}">${strain}</b>`, 'Strain') +
      stat('What Fighter Command thinks of this squadron',
        UI.icon('command'), `<b>${Math.round(s.standing)}</b>`, 'Command'));
    if (s.awaitingSetup){ UI.html('strength',''); UI.set('clock','1 July 1940'); }
  },

  // Guarded writes. A mismatch between markup and code used to throw inside
  // header() and take every subsequent render with it, blanking the page.
  // The sector tote board: the illuminated state indicator that told the
  // controller at a glance what every squadron was doing.
  toteState(){
    const s = Season.s;
    if (s.pending) return 'scrambled';
    if (!s.weather || s.weather.flying === 0) return 'released';
    if (!s.calls.length) return 'available';
    if (s.callIndex >= s.calls.length) return 'landed';
    return 'readiness';
  },

  tote(){
    const states = [
      ['released','Released','amber'], ['available','Available',''],
      ['readiness','Readiness',''], ['scrambled','Scrambled','red'],
      ['landed','Ordered to land','amber']
    ];
    const now = UI.toteState();
    UI.html('tote', states.map(([id,label,tone]) => {
      const on = id === now;
      return `<div class="totecell${on ? ' lit ' + tone : ''}">` +
        `<svg class="lamp" width="24" height="28" viewBox="0 0 26 30" aria-hidden="true">` +
          `<path class="glass" d="M13 2.5a7.2 7.2 0 0 1 4.4 12.9c-.8.6-1.2 1.3-1.3 2.2H9.9c-.1-.9-.5-1.6-1.3-2.2A7.2 7.2 0 0 1 13 2.5z"/>` +
          `<path class="fil" d="M10.6 12.4c.7-1.9 1.4-3.4 2.4-3.4s1.7 1.5 2.4 3.4"/>` +
          `<path class="cap" d="M9.6 18.6h6.8v2.1H9.6zM10.1 21.6h5.8v2.1h-5.8zM10.8 24.6h4.4v2.2h-4.4z"/>` +
        `</svg>` +
        `<span class="totelab">${label}</span></div>`;
    }).join(''));
  },

  set(id, text){ const el = document.getElementById(id); if (el) el.textContent = text; },
  html(id, markup){ const el = document.getElementById(id); if (el) el.innerHTML = markup; },

  tabs(){
    const lost = Season.s.roll.filter(p => ['killed','missing','invalided'].includes(p.status)).length;
    const defs = [['ops','Operations'], ['pilots','Pilots'], ['records','Records'], ['diary','Squadron diary'],
                  ['roll', 'Roll of honour' + (lost ? ' (' + lost + ')' : '')]];
    const nav = document.getElementById('tabs');
    if (!nav) return;
    nav.innerHTML = '';
    for (const [id,label] of defs){
      const b = document.createElement('button');
      b.textContent = label;
      if (UI.tab === id) b.className = 'on';
      b.onclick = () => { UI.tab = id; UI.render(); };
      nav.appendChild(b);
    }
  },

  view(){
    const el = document.getElementById('view');
    if (!el) return;
    el.innerHTML = '';
    if (Season.s.awaitingSetup) return UI.startScreen(el);
    if (UI.tab === 'ops')    UI.ops(el);
    else if (UI.tab === 'pilots') UI.pilots(el);
    else if (UI.tab === 'records') UI.records(el);
    else if (UI.tab === 'diary')  UI.diary(el);
    else if (UI.tab === 'roll')   UI.roll(el);
    UI.footer(el);
  },

  // Down in the white space at the foot of every page, out of the way of
  // anything you might press by accident.
  footer(el){
    if (Season.s.battle) return;
    const foot = document.createElement('div');
    foot.className = 'pagefoot';
    // A visible build marker, so there is never any doubt about which file is
    // actually loaded. It has cost us an afternoon more than once.
    const stamp = document.createElement('div');
    stamp.className = 'buildstamp';
    stamp.textContent = 'Squadron Leader 1940 \u00b7 build ' + BUILD +
      (Store.status.ok ? ' \u00b7 saving to ' + Store.status.backend : ' \u00b7 not saving');
    foot.appendChild(stamp);
    const b = document.createElement('button');
    b.className = 'quiet tiny restart';
    b.textContent = 'Abandon this campaign and form a new squadron';
    b.onclick = () => {
      UI.tab = 'ops';
      UI.ask('Abandon this campaign?',
        ['The squadron, the pilots and everything they have done will be gone.',
         'You will be posted to a new command and start again on 1 July 1940.'],
        () => { Season.s = null; Season.start(); UI.choice = null;
                UI.tab = 'ops'; UI.render(); });
    };
    foot.appendChild(b);
    el.appendChild(foot);
  },

  /* ------------------------------------------------------------ small parts */
  // One scale for everything: red at the bottom, amber in the middle, green at
  // the top, so a glance across a card reads the same way everywhere.
  scale(pct){
    const h = Math.round(clamp(pct,0,100) * 1.15);      // 0 red -> 115 green
    return `hsl(${h} 58% ${42 + h/10}%)`;
  },
  bar: (v,c) => `<div class="bar"><i style="width:${clamp(v,0,100)}%;background:${c || UI.scale(v)}"></i></div>`,

  // Attribute bar on the 1-20 scale, faded while the figure is still a guess.
  levelBar(value, confidence, rangeTitle){
    const pct = (value / CAMPAIGN.attributeRange.max) * 100;
    const op = confidence === 0 ? 0.4 : confidence === 1 ? 0.72 : 1;
    return `<span class="lvl" title="${rangeTitle || value}"><i style="width:${pct}%;` +
      `background:${UI.scale(pct)};opacity:${op}"></i></span>`;
  },

  // Red at 1, amber in the middle, green at 20. Uncertainty is shown by fading
  // the bar, so a wide bracket reads as a guess rather than a judgement.
  scaleColour(v, max){
    const t = clamp((v - 1) / ((max || 20) - 1), 0, 1);
    return `hsl(${Math.round(4 + t * 116)} 58% ${Math.round(44 + t * 8)}%)`;
  },
  gauge(value, spread){
    const pct = clamp((value / CAMPAIGN.attributeRange.max) * 100, 4, 100);
    const fade = spread ? 0.45 : 1;
    return `<span class="gauge"><i style="width:${pct}%;background:${UI.scaleColour(value)};opacity:${fade}"></i></span>`;
  },

  // Victory marks as they were painted under the cockpit — the Balkenkreuz of
  // the aircraft claimed. Solid for destroyed, faded for a share, outline only
  // for a damaged claim that was never confirmed.
  cross(kind){
    const solid  = kind !== 'damaged';
    const op     = kind === 'share' ? 0.5 : 1;
    const white  = solid ? '#f2f4f7' : 'none';
    const black  = solid ? '#12151a' : 'none';
    const edge   = solid ? 'none' : 'var(--dim)';
    return `<svg width="13" height="13" viewBox="0 0 14 14" style="opacity:${op}" aria-hidden="true">
      <path d="M4 0h6v4h4v6h-4v4H4v-4H0V4h4z" fill="${white}" stroke="${edge}" stroke-width="1"/>
      <path d="M5.6 0h2.8v5.6H14v2.8H8.4V14H5.6V8.4H0V5.6h5.6z" fill="${black}"/>
    </svg>`;
  },

  // Header icons. Drawn rather than borrowed, so they match the interface
  // weight and the period rather than looking like a modern app.
  icon(name, size){
    const w = size || 15;
    const st = 'fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"';
    const body = {
      // A man in a flying helmet: head, goggles, shoulders.
      pilots: `<g ${st}>
        <path d="M6.1 7.4a3.9 3.9 0 0 1 7.8 0v1.9c0 1.5-1.1 2.6-2.5 2.6H8.6c-1.4 0-2.5-1.1-2.5-2.6z"/>
        <path d="M6.3 6.9h7.4"/><circle cx="8.3" cy="8.4" r="1.15"/><circle cx="11.7" cy="8.4" r="1.15"/>
        <path d="M9.45 8.4h1.1"/>
        <path d="M3.6 17.4c0-2.7 2.6-4.6 6.4-4.6s6.4 1.9 6.4 4.6"/></g>`,
      // The squadron's own planform: elliptical wing for the Spitfire, straight
      // for the Hurricane, so the two read differently at a glance.
      aircraft: (CAMPAIGN.squadron.aircraft === 'hurricane'
        ? `<g ${st}>
        <ellipse cx="10" cy="10.2" rx="1.15" ry="7.5"/>
        <path d="M1.5 8.1h17v2H1.5z"/>
        <ellipse cx="10" cy="16.4" rx="3.3" ry="1"/>
        <path d="M6.7 2.7h6.6"/><path d="M10 2.7v-.9"/></g>`
        : `<g ${st}>
        <ellipse cx="10" cy="10.2" rx="1.05" ry="7.5"/>
        <ellipse cx="10" cy="9.1" rx="8.5" ry="2.05"/>
        <ellipse cx="10" cy="16.4" rx="3.3" ry="1"/>
        <path d="M6.7 2.7h6.6"/><path d="M10 2.7v-.9"/></g>`),
      // Squadron strain: a gauge with the needle round to the right.
      strain: `<g ${st}>
        <path d="M2.9 14.1a7.1 7.1 0 1 1 14.2 0"/>
        <path d="M10 14.1 14.6 8.4"/><circle cx="10" cy="14.1" r="1"/>
        <path d="M4.5 12.1h1.1M14.4 12.1h1.1M10 6.3v1.1"/></g>`,
      // Command's opinion: the chain you sit at the bottom of.
      command: `<g ${st}>
        <path d="M7.4 2.6h5.2v3.1H7.4z"/>
        <path d="M2.9 12.1h4.2v3.1H2.9zM12.9 12.1h4.2v3.1h-4.2z"/>
        <path d="M10 5.7v3.4M5 12.1V9.1h10v3"/></g>`,
      // Pilots lost.
      lost: `<g ${st}>
        <path d="M5.1 9.6a4.9 4.9 0 1 1 9.8 0v2.1c0 .9-.6 1.5-1.4 1.5h-7c-.8 0-1.4-.6-1.4-1.5z"/>
        <circle cx="7.9" cy="9.3" r="1.35"/><circle cx="12.1" cy="9.3" r="1.35"/>
        <path d="M9.4 11.9h1.2"/>
        <path d="M7.2 13.2v3.1M10 13.2v3.1M12.8 13.2v3.1"/></g>`
    };
    return `<svg width="${w}" height="${w}" viewBox="0 0 20 20" aria-hidden="true" class="statico">${
      body[name] || ''}</svg>`;
  },

  // The victory marks from the pilot cards, at header size.
  claimMarks(){
    return `<span class="cross">${UI.cross('kill')}${UI.cross('share')}${UI.cross('damaged')}</span>`;
  },

  // What an exercise is actually for, on a scale a player can read at a glance.
  trainingPips(ex){
    const table = CAMPAIGN.development.training[ex.id] || {};
    return Object.entries(table).map(([k, v]) => {
      const a = CAMPAIGN.attributes.find(x => x.key === k);
      const n = clamp(Math.round(v / 0.17), 1, 3);
      return (a ? a.label : k) + ' ' + '\u25cf'.repeat(n) + '\u25cb'.repeat(3 - n);
    }).join('  ');
  },

  weatherIcon(name){
    const st = 'fill="none" stroke="currentColor" stroke-width="1.3"';
    const cloud = `<path d="M4 12h9a3 3 0 0 0 0-6 4.5 4.5 0 0 0-8.6 1.3A2.6 2.6 0 0 0 4 12z" ${st}/>`;
    const body = {
      clear:    `<circle cx="9" cy="9" r="3.6" ${st}/><g ${st}><path d="M9 1v2M9 15v2M1 9h2M15 9h2M3.4 3.4l1.4 1.4M13.2 13.2l1.4 1.4M14.6 3.4l-1.4 1.4M4.8 13.2l-1.4 1.4"/></g>`,
      hazy:     `<circle cx="9" cy="8" r="3.4" ${st}/><g ${st}><path d="M2 13h14M4 15.5h10"/></g>`,
      cloud,
      overcast: cloud + `<g ${st}><path d="M6 14.5l-1 2M10 14.5l-1 2"/></g>`,
      rain:     cloud + `<g ${st}><path d="M5.5 14l-1.2 3M9 14l-1.2 3M12.5 14l-1.2 3"/></g>`
    };
    return `<svg width="18" height="18" viewBox="0 0 18 18" style="color:var(--dim)">${body[name]||cloud}</svg>`;
  },

  claimRow(p){
    const bits = [];
    for (let i=0;i<Math.min(p.kills,10);i++)   bits.push(UI.cross('kill'));
    for (let i=0;i<Math.min(p.shared,6);i++)   bits.push(UI.cross('share'));
    for (let i=0;i<Math.min(p.damaged,6);i++)  bits.push(UI.cross('damaged'));
    const txt = `${p.kills} destroyed · ${p.shared} shared · ${p.damaged} damaged`;
    return `<div class="claims" title="${txt}"><span class="lab">Claims</span>${
      bits.join('') || '<span class="lab">none</span>'}</div>`;
  },

  ribbonCss: {
    'DFC':        'repeating-linear-gradient(115deg,#4a2d6b 0 3px,#efece0 3px 6px)',
    'Bar to DFC': 'repeating-linear-gradient(115deg,#4a2d6b 0 3px,#efece0 3px 6px)',
    'DFM':        'repeating-linear-gradient(180deg,#4a2d6b 0 3px,#efece0 3px 6px)',
    'DSO':        'linear-gradient(90deg,#1b3a6b 0 15%,#a82f24 15% 85%,#1b3a6b 85%)',
    'Bar to DFM': 'repeating-linear-gradient(180deg,#4a2d6b 0 3px,#efece0 3px 6px)',
    'Victoria Cross': 'linear-gradient(90deg,#7d1a12,#a8231a 50%,#7d1a12)',
    'George Medal': 'repeating-linear-gradient(90deg,#a82f24 0 5px,#1b3a6b 5px 7px)',
    'Air Force Cross': 'repeating-linear-gradient(115deg,#a82f24 0 3px,#efece0 3px 6px)',
    'Mentioned in Despatches': 'linear-gradient(90deg,#6b5a2e,#9c8541 50%,#6b5a2e)',
    'Krzy\u017c Walecznych': 'linear-gradient(90deg,#efece0 0 12%,#7d2b22 12% 88%,#efece0 88%)',
    'Virtuti Militari': 'linear-gradient(90deg,#111 0 14%,#1b3a6b 14% 86%,#111 86%)',
    'Czechoslovak War Cross': 'linear-gradient(90deg,#a82f24 0 33%,#efece0 33% 66%,#1b3a6b 66%)'
  },

  ribbons(p){
    if (!p.awards.length) return '';
    // An award held more than once shows as a count, not as repeats.
    const seen = [];
    const counts = {};
    for (const a of p.awards){ if (!(a in counts)){ counts[a] = 0; seen.push(a); } counts[a]++; }
    return `<div class="ribbons">` + seen.map(a =>
      `<span class="ribbon" title="${a}" style="background:${UI.ribbonCss[a]||'#777'}"></span>` +
      `<span class="rib-name">${UI.awardShort(a)}${counts[a] > 1 ? ' \u00d7' + counts[a] : ''}</span>`)
      .join('') + `</div>`;
  },

  awardShort(a){
    return { 'Mentioned in Despatches':'MiD', 'Victoria Cross':'VC', 'George Medal':'GM',
             'Air Force Cross':'AFC', 'Krzy\u017c Walecznych':'KW',
             'Virtuti Militari':'V. Militari', 'Czechoslovak War Cross':'Cz. War Cross' }[a] || a;
  },

  photo(p){
    const i = p && p.portrait;
    if (i === undefined || i === null || !PORTRAITS.jpg[i])
      return `<svg class="photo" viewBox="0 0 42 52" aria-hidden="true">
        <rect width="42" height="52" fill="#0d1728"/>
        <circle cx="21" cy="20" r="9" fill="none" stroke="#3c5a7f" stroke-width="1.2"/>
        <path d="M6 50c0-9 6.7-14 15-14s15 5 15 14" fill="none" stroke="#3c5a7f" stroke-width="1.2"/>
      </svg>`;
    return `<img class="photo" alt="" src="data:image/jpeg;base64,${PORTRAITS.jpg[i]}">`;
  },

  // A decision with consequences gets them spelled out before it is taken.
  ask(title, points, onYes){ UI.pendingAsk = { title, points, onYes }; UI.render(); },

  askPanel(){
    const a = UI.pendingAsk;
    if (!a) return '';
    return `<div class="panel confirm">
      <div class="when">Confirm</div>
      <p class="plot">${a.title}</p>
      ${a.points.map(t => `<p class="meta">${t}</p>`).join('')}
      <div class="btnrow" id="askrow"></div></div>`;
  },

  bindAsk(){
    const row = document.getElementById('askrow');
    if (!row || !UI.pendingAsk) return;
    const yes = document.createElement('button');
    yes.className = 'primary'; yes.textContent = 'Go ahead';
    yes.onclick = () => { const f = UI.pendingAsk.onYes; UI.pendingAsk = null; f(); };
    const no = document.createElement('button');
    no.className = 'quiet'; no.textContent = 'Think better of it';
    no.onclick = () => { UI.pendingAsk = null; UI.render(); };
    row.appendChild(yes); row.appendChild(no);
  },

  /* ---------------------------------------------------------------- pilots */
  pilots(el){
    const s = Season.s;
    const filt = s.flightFilter || 'all';
    const list = s.pilots.filter(p => (p.status === 'active' || p.status === 'wounded')
        && (filt === 'all' || p.flight === filt))
      .sort((a,b) => (b.isCommander?1:0)-(a.isCommander?1:0) || b.rank - a.rank || b.kills - a.kills);

    const ex = s.trainingChoice ? CAMPAIGN.training.types.find(t => t.id === s.trainingChoice) : null;
    const banner = (s.pending || ex) ? `<div class="panel selbanner">
        <b>${ex ? ex.name : s.pending.type.name + ' — ' + s.pending.time}</b>
        <span class="meta">Tap the men to detail them. ${s.selected.size} selected.</span>
        <span class="btnrow"><button class="tiny" id="selconfirm">${ex ? 'Send them up' : 'Scramble'}</button>
        <button class="quiet tiny" id="selcancel">Cancel</button></span></div>` : '';
    el.innerHTML = banner + `<h2>Pilots on strength</h2><div class="cards" id="roster"></div>
      <div class="note">Bracketed figures are estimates and close as a man is tested.
        <b>Experience</b> is hours on type — what he can actually use of his ability.
        <b>Morale</b> is his state of mind. They move for different reasons.</div>
      `;

    document.getElementById('roster').innerHTML = list.map(p => {
      const attrs = CAMPAIGN.attributes.map(a => {
        const e = Pilot.estimate(p, a.key);
        const d = (p.delta && p.delta[a.key]) || 0;
        const mark = d ? `<span class="delta ${d > 0 ? 'up' : 'down'}" title="${
          CAMPAIGN.development.notes[a.key][d > 0 ? 0 : 1]}">${d > 0 ? '+' : ''}${d}</span>` : '';
        return `<div class="attr c${e.confidence}">
          <span class="an">${a.name}${mark}</span>
          ${UI.gauge(e.value, e.spread)}
          <b>${e.spread ? e.low+'–'+e.high : e.value}</b></div>`;
      }).join('');
      const know = Pilot.acquaintance(p);
      const wounded = p.status === 'wounded';
      const picked = s.selected.has(p.id);
      // Only selectable when there is something to select for, so cards do not
      // light up for no apparent reason.
      const picking = !!(s.pending || s.trainingChoice);
      const selectable = picking && !wounded && !p.resting;
      const exp = Pilot.workedUp(p) * 100;
      const fatCol = UI.scaleColour((100 - p.fatigue)/5);   // high fatigue is bad
      const morCol = UI.scaleColour(p.morale/5);
      const expCol = UI.scaleColour(exp/5);
      return `<div class="card rec ${wounded?'gone':p.resting?'rest':''}${picked&&picking?' picked':''}${selectable?' selectable':''}${p.isCommander?' boss':''}" data-pick="${p.id}">
        <span class="cardstamp">${p.flight} Flt</span>
        ${picked ? '<div class="tick">DETAILED</div>' : ''}
        <div class="who">
          ${UI.photo(p)}
          <div class="whotext">
            <h3>${picked && picking ? '<span class="tick">✓</span> ' : ''}<span class="rank">${CAMPAIGN.ranks[p.rank].short}</span>
              <span class="pname" data-rename="${p.id}" title="Click to rename">${p.first} ${p.last}</span>
              <span class="flt" data-flight="${p.id}" title="Click to move flights">${p.flight} Flight</span>
              <span class="flt sect" data-section="${p.id}" title="Click to post him to a section">${
                p.section || 'any section'}</span></h3>
            <div class="sub">${p.isCommander ? '<b>You have command.</b> ' : ''}${
              p.nationLabel ? '<b>' + p.nationLabel + '</b> · ' : ''}${p.hours} hours on type ·
              ${p.sorties} sorties since 1 July 1940</div>
            <div class="sub know k${know}">${Pilot.acquaintanceLabel[know]}${
              (p.aptitudeSeen||0) >= 6 ? ' \u00b7 ' + Season.aptitudeWord(p) : ''}${
              p.permanentHarm && p.permanentHarm.length ? ' · <span class="hurtline">' + p.permanentHarm[0] + '</span>' : ''}</div>
          </div>
        </div>
        ${UI.claimRow(p)}
        ${UI.ribbons(p)}
        <div class="attrs">${attrs}</div>
        <div class="barlab"><span>Fatigue</span><span>${Math.round(p.fatigue)}</span></div>${UI.bar(p.fatigue,fatCol)}
        <div class="barlab"><span>Morale</span><span>${Math.round(p.morale)}</span></div>${UI.bar(p.morale,morCol)}
        <div class="barlab"><span>Experience</span><span>${Math.round(exp)}%</span></div>${UI.bar(exp,expCol)}
        ${p.isCommander ? `<div class="barlab"><span>Weight of command</span><span>${Math.round(p.burden)}</span></div>`
          + UI.bar(p.burden, UI.scale(100 - p.burden)) : ''}
        ${wounded ? `<div class="sub hurtline">${p.grounded ? 'Grounded — operational exhaustion'
            : (p.injury ? p.injury.name : 'In hospital')}${
            p.backOn ? ' · expected back ' + Season.dateFor(p.backOn) : ''}</div>`
          : `<button class="toggle" data-rest="${p.id}">${p.resting ? 'Stood down — return to readiness' : 'At readiness — stand him down'}</button>`}
      </div>`;
    }).join('');

    UI.bindRoster();
    const conf = document.getElementById('selconfirm');
    if (conf){
      const chosen = Season.activePilots().filter(x => s.selected.has(x.id) && !x.resting);
      conf.disabled = !chosen.length || chosen.length > Season.serviceable().length;
      conf.onclick = () => {
        if (ex){ Season.train(chosen, s.trainingChoice); s.trainingChoice = null; }
        else { Season.fly(chosen); Season.nextCall(); }
        UI.tab = 'ops'; UI.render();
      };
      document.getElementById('selcancel').onclick = () => {
        s.trainingChoice = null; s.selected = new Set(); UI.tab = 'ops'; UI.render();
      };
    }
  },

  bindRoster(){
    const find = id => Season.s.pilots.find(x => x.id === id);
    document.querySelectorAll('[data-rest]').forEach(b => b.onclick = e => {
      e.stopPropagation();
      const p = find(b.dataset.rest);
      p.resting = !p.resting; p.restUntil = null;
      if (p.resting) Season.s.selected.delete(p.id);
      UI.render();
    });
    document.querySelectorAll('[data-rename]').forEach(el => el.onclick = e => {
      e.stopPropagation();
      const p = find(el.dataset.rename);
      const input = document.createElement('input');
      input.className = 'rename'; input.value = (p.first + ' ' + p.last).trim();
      const commit = () => {
        const v = input.value.trim();
        if (v){
          const bits = v.split(/\s+/);
          p.first = bits.length > 1 ? bits[0] : '';
          p.last  = bits.length > 1 ? bits.slice(1).join(' ') : bits[0];
          p.initial = (p.first || p.last)[0].toUpperCase();
        }
        UI.render();
      };
      input.onblur = commit;
      input.onkeydown = ev => { if (ev.key === 'Enter') input.blur(); if (ev.key === 'Escape') UI.render(); };
      el.replaceWith(input); input.focus(); input.select();
    });
    document.querySelectorAll('[data-flight]').forEach(el => el.onclick = e => {
      e.stopPropagation();
      const p = find(el.dataset.flight);
      p.flight = p.flight === 'A' ? 'B' : 'A';
      UI.render();
    });
    // Cycles Red, Yellow, Blue, Green and back to unposted.
    document.querySelectorAll('[data-section]').forEach(el => el.onclick = e => {
      e.stopPropagation();
      const p = find(el.dataset.section);
      const names = CAMPAIGN.sectionNames;
      const i = names.indexOf(p.section);
      p.section = i < 0 ? names[0] : (i + 1 < names.length ? names[i+1] : null);
      UI.render();
    });
    document.querySelectorAll('[data-pick]').forEach(el => el.onclick = () => {
      if (!Season.s.pending && !Season.s.trainingChoice) return;
      const p = find(el.dataset.pick);
      if (!p || p.status !== 'active' || p.resting) return;
      const sel = Season.s.selected;
      sel.has(p.id) ? sel.delete(p.id) : sel.add(p.id);
      UI.render();
    });
  },

  /* ------------------------------------------------------------ operations */
  ops(el){
    const s = Season.s;
    let html = UI.askPanel();

    // The campaign is finished: nothing else on this page applies.
    if (s.over) return UI.ending(el);

    if (s.notices && s.notices.length)
      html += s.notices.map(n => `<div class="panel notice ${n.kind}">
        <div class="when">${n.kind === 'warn' ? 'Serviceability' : 'Squadron news'}</div>
        <p class="plot">${n.text}</p></div>`).join('');

    if (s.report && !s.battle) html += UI.reportHTML(s.report);

    if (s.recommendation){
      const p = s.roll.find(x => x.id === s.recommendation.pilotId);
      html += `<div class="panel gong">
        <div class="when">Gallantry</div>
        <p class="plot">The adjutant has drafted a recommendation for
          <b>${Season.awardNoun(s.recommendation.award)}</b> for <b>${Pilot.name(p)}</b> —
          ${p.kills} destroyed and ${p.shared} shared in ${p.sorties} sorties.</p>
        <p class="meta">Citations take six weeks or more to come through Group and the Gazette.</p>
        <div class="btnrow" id="gongrow"></div></div>`;
    }

    if (s.incident){
      html += `<div class="panel incident">
        <div class="when">On the ground</div>
        <p class="plot">${s.incident.def.text(s.incident.ctx)}</p>
        <div class="btnrow" id="incopts"></div></div>`;
    }

    if (s.pending && !s.battle){
      html += `<div class="panel call">
        <div class="when">${s.pending.time} · ${s.pending.type.name}</div>
        <p class="plot">${Season.callText(s.pending)}</p>
        <p class="meta">${Season.readyPilots().length} pilots available,
          ${Season.serviceable().length} aircraft serviceable.
          Tap a man on the Pilots page, or use these.</p>
        <div class="btnrow" id="quickpick"></div>
        <div class="btnrow" id="chosenrow"></div>
        <div class="btnrow" id="commit"></div></div>`;
    } else if (s.calls.length){
      html += `<div class="panel quietday">All calls answered. ${s.weather.note}</div>`;
    } else {
      html += `<div class="panel quietday">${s.dayLines[0] || s.weather.note}</div>`;
    }

    if (!s.pending && !s.incident && !s.recommendation && !s.battle){
      const ex = s.trainingChoice ? CAMPAIGN.training.types.find(t => t.id === s.trainingChoice) : null;
      html += `<div class="panel training">
        <div class="when">Non-operational flying</div>` +
        (ex
          ? `<p class="plot">${ex.name}. Choose the pilots.</p>
             <p class="meta">Now select men on the <b>Pilots</b> page, then confirm.</p>
             <div class="btnrow" id="trainconfirm"></div>`
          : `<p class="meta">Choose an exercise, then detail the pilots for it. They come off the
               state for the day. Hours are how a new man is made useful.</p>
             <div class="btnrow" id="trainrow"></div>`) +
        `</div>`;
    }

    html += `<div class="btnrow" id="controls"></div>`;
    el.innerHTML = html;
    UI.bindAsk();
    UI.cockpit.ensure();
    try { Save.schedule(); } catch(e){}

    const mk = (label, fn, cls, dis) => {
      const b = document.createElement('button');
      b.textContent = label; if (cls) b.className = cls; b.disabled = !!dis; b.onclick = fn;
      return b;
    };

    if (s.recommendation){
      const row = document.getElementById('gongrow');
      row.appendChild(mk('Recommend him', () => { Season.decideRecommendation(true); UI.render(); }, 'primary'));
      row.appendChild(mk('Not yet', () => { Season.decideRecommendation(false); UI.render(); }, 'quiet'));
    }

    if (s.incident){
      const row = document.getElementById('incopts');
      s.incident.def.options.forEach((o,i) =>
        row.appendChild(mk(o.label, () => { Season.resolveIncident(i); UI.render(); })));
    }

    if (s.pending && !s.battle){
      const ready = Season.readyPilots(), serv = Season.serviceable().length;
      const setSel = list => { s.selected = new Set(list.slice(0, serv).map(p => p.id)); UI.render(); };
      const inFlight = f => ready.filter(p => p.flight === f);
      const q = document.getElementById('quickpick');
      q.appendChild(mk('Pair (2)',    () => setSel(ready.slice(0,2)), 'quiet', ready.length < 2));
      q.appendChild(mk('Section (3)', () => setSel(ready.slice(0,3)), 'quiet', ready.length < 3));
      q.appendChild(mk('Four',        () => setSel(ready.slice(0,4)), 'quiet', ready.length < 4));
      q.appendChild(mk(`A Flight (${inFlight('A').length})`, () => setSel(inFlight('A')), 'quiet', !inFlight('A').length));
      q.appendChild(mk(`B Flight (${inFlight('B').length})`, () => setSel(inFlight('B')), 'quiet', !inFlight('B').length));
      q.appendChild(mk(`Squadron (${Math.min(ready.length,serv)})`, () => setSel(ready), 'quiet'));
      q.appendChild(mk('Clear', () => setSel([]), 'quiet'));

      const chosen = ready.filter(p => s.selected.has(p.id));
      const names = document.getElementById('chosenrow');
      const lab = document.createElement('span');
      lab.className = 'meta';
      lab.innerHTML = chosen.length
        ? 'Detailed: <b>' + chosen.map(Pilot.name).join(', ') + '</b>'
        : 'No pilots detailed.';
      names.appendChild(lab);

      const row = document.getElementById('commit');
      const over = chosen.length > serv;
      const boss = Season.commander();
      const bossUp = Season.commanderIsUp(chosen);
      const canLead = boss && boss.status === 'active' && !boss.resting &&
                      (bossUp || chosen.length < serv);
      row.appendChild(mk(chosen.length ? `Scramble ${chosen.length}` : 'Detail pilots to scramble',
        () => { s.leadNext = false; Season.fly(chosen); Season.nextCall(); UI.render(); },
        'primary', !chosen.length || over));
      {
        // You should not have to hunt for your own name in the list. Pressing
        // this puts you in the air with them.
        row.appendChild(mk(bossUp ? 'Lead them yourself' : 'Lead them yourself (+ you)',
          () => {
            const up = chosen.slice();
            if (!bossUp && boss) { up.unshift(boss); s.selected.add(boss.id); }
            s.leadNext = true; Season.fly(up); Season.nextCall(); UI.render();
          }, 'primary', !chosen.length || over || !canLead));
        const w = document.createElement('span');
        w.className = 'meta';
        const deputy = Season.activePilots().filter(x => !x.isCommander && !x.resting)
          .sort((a,b) => b.truth.leadership - a.truth.leadership)[0];
        w.innerHTML = canLead
          ? `Or send them up under ${deputy ? '<b>' + Pilot.name(deputy) + '</b>' : 'a flight commander'}.`
          : `You are not fit to fly. ${deputy ? '<b>' + Pilot.name(deputy) + '</b>' : 'A flight commander'} will lead.`;
        row.appendChild(w);
      }
      row.appendChild(mk('Plead with Operations',
        () => { Season.plead(); Season.nextCall(); UI.render(); }, 'quiet'));
      if (s.pending.pleaded){
        const w = document.createElement('span');
        w.className = 'meta'; w.style.color = 'var(--warn)';
        w.textContent = s.pending.pleaded > 1
          ? 'You have been on the telephone twice already.' : 'The order stands.';
        row.appendChild(w);
      }
      // The squadron cannot always answer. It must always be able to say so.
      if (!Season.canFly()){
        row.appendChild(mk('Report the squadron non-operational',
          () => { Season.reportUnable(); Season.nextCall(); UI.render(); }, 'danger'));
      }
      if (over){
        const w = document.createElement('span');
        w.className = 'meta'; w.style.color = 'var(--bad)';
        w.textContent = `Only ${serv} aircraft serviceable.`;
        row.appendChild(w);
      }
    }

    const tr = document.getElementById('trainrow');
    if (tr){
      for (const ex of CAMPAIGN.training.types)
        tr.appendChild(mk(`${ex.name} (+${ex.hours} hrs)  ${UI.trainingPips(ex)}`, () => {
          s.trainingChoice = ex.id;
          s.selected = new Set(Season.readyPilots()
            .slice().sort((a,b) => Pilot.workedUp(a) - Pilot.workedUp(b))
            .slice(0, Math.min(3, Season.serviceable().length)).map(x => x.id));
          UI.tab = 'pilots'; UI.render();
        }, '', !Season.readyPilots().length || !Season.serviceable().length));
    }
    const tc = document.getElementById('trainconfirm');
    if (tc){
      const chosen = Season.activePilots().filter(p => s.selected.has(p.id) && !p.resting);
      tc.appendChild(mk(chosen.length ? `Send ${chosen.length} up` : 'Select pilots on the Pilots page',
        () => { Season.train(chosen, s.trainingChoice); s.trainingChoice = null; UI.render(); },
        'primary', !chosen.length || chosen.length > Season.serviceable().length));
      tc.appendChild(mk('Cancel', () => { s.trainingChoice = null; s.selected = new Set(); UI.render(); }, 'quiet'));
    }

    const c = document.getElementById('controls');
    // A pending call blocks the day, unless the squadron has nothing to answer
    // it with -- otherwise there is no way out at all.
    const blocked = (s.pending && Season.canFly()) || s.incident || s.recommendation || s.battle;
    c.appendChild(mk('End the day', () => { Season.endDay(); UI.render(); }, 'primary', !!blocked));
    if (Season.group().front)
      c.appendChild(mk('Apply for relief', () => {
        const strain = Math.round(Season.strain());
        const likely = strain >= CAMPAIGN.command.strainToAskRelief;
        UI.ask('Apply to Group for relief?',
          [`Squadron strain stands at <b>${strain}</b>. Group grants relief above ` +
           `<b>${CAMPAIGN.command.strainToAskRelief}</b>.`,
           likely
             ? 'On this showing it will probably be granted. The squadron leaves the line for a ' +
               'quiet sector: your pilots and ground crews recover, but you will see very little ' +
               'of the battle until Command sends you south again.'
             : 'On this showing it will probably be <b>refused</b>, and Command will think less of ' +
               `you for asking — <b>${Math.abs(CAMPAIGN.command.standingForRefusedRequest)} points</b> ` +
               'off their opinion of you.'],
          () => { Season.requestRelief(); UI.render(); });
      }, 'quiet'));
    else
      c.appendChild(mk('Ask to return to the line', () => {
        UI.ask('Ask Group to send the squadron south again?',
          ['If Command agrees you return to the fighting, and the losses start again.',
           'If the squadron is not yet fit for the line the request is refused, and asking too ' +
           'early costs you a little of their opinion.'],
          () => { Season.requestReturn(); UI.render(); });
      }, 'quiet'));
  },

  /* ====================================================================
     THE COCKPIT. Not a panel on the operations page: the whole screen goes
     over to it, because that is what happening. Radio traffic arrives in
     real time, large, one call at a time. Decisions come with a clock on
     them -- and when it runs out the moment has passed, which is the point.
     Some interceptions are a non-event. Some are not.
     ==================================================================== */
  cockpit: {
    el:null, timer:null, lastBal:undefined, menu:null, awaitTarget:null,

    LINE_MS: 5200, NARR_MS: 4200, BEAT_GAP_MS: 1400,

    ensure(){
      const b = Season.s.battle;
      // A battle with no engagement behind it is not a battle.
      if (b && !b.ctx) { Season.s.battle = null; return; }
      if (b && b.ctx && !b.ctx.st) { Season.s.battle = null; return; }
      if (b && !UI.cockpit.el) UI.cockpit.open();
      if (!b && UI.cockpit.el) UI.cockpit.close();
    },

    open(){
      const b = Season.s.battle, st = b.ctx.st;
      const host = document.createElement('div');
      host.className = 'cockpit';
      host.innerHTML =
        '<div class="ckhead"><span id="ckphase"></span><span class="ckalt" id="ckalt"></span></div>' +
        '<div class="ckbal"><i class="bmine" id="ckbalmine"></i><i class="btheirs" id="ckbaltheirs"></i></div>' +
        '<div class="ckballab"><span>Us</span><span id="ckbaltext"></span><span>Them</span></div>' +
        '<div class="cknarr" id="cknarr"></div>' +
        '<div class="ckfield"><svg class="ckwires" id="ckwires"></svg>' +
          '<div class="ckside" id="ckus"></div><div class="ckgap"></div>' +
          '<div class="ckside" id="ckthem"></div></div>' +
        '<div class="ckmid"><div class="ckcall" id="ckcall"></div></div>' +
        '<div class="ckfoot"><div class="ckopts" id="ckopts"></div></div>' +
        '<div class="ckmenu" id="ckmenu"></div>';
      document.body.appendChild(host);
      UI.cockpit.el = host;
      b.queue = b.queue || []; b.log = b.log || [];
      b.lastPhase = null; b.opened = true;
      UI.cockpit.lastBal = undefined;
      for (const line of Battle.openingReport(st, Season.s.pending))
        b.queue.push({ kind:'line', text:line, voice:'narr' });
      UI.cockpit.pump();
    },

    close(){
      clearTimeout(UI.cockpit.timer); UI.cockpit.timer = null;
      UI.cockpit.awaitTarget = null;
      if (UI.cockpit.el && UI.cockpit.el.parentNode)
        UI.cockpit.el.parentNode.removeChild(UI.cockpit.el);
      UI.cockpit.el = null;
    },

    set(id, markup){ const e = document.getElementById(id); if (e) e.innerHTML = markup; },

    /* ---------------------------------------------------------- the board */
    planeArt(typeKey, kind){
      // Elliptical wing for the Spitfire, straight for the Hurricane, slab for
      // the 109, wide and heavy for the bombers.
      const g = 'fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"';
      if (typeKey === 'spitfire') return `<svg class="ckplane" viewBox="0 0 20 20"><g ${g}>` +
        `<ellipse cx="10" cy="10.2" rx="1" ry="7.2"/><ellipse cx="10" cy="9.1" rx="8.2" ry="1.9"/>` +
        `<ellipse cx="10" cy="16.2" rx="3.1" ry=".9"/><path d="M6.8 2.8h6.4"/></g></svg>`;
      if (typeKey === 'hurricane') return `<svg class="ckplane" viewBox="0 0 20 20"><g ${g}>` +
        `<ellipse cx="10" cy="10.2" rx="1.1" ry="7.2"/><path d="M1.8 8.2h16.4v1.9H1.8z"/>` +
        `<ellipse cx="10" cy="16.2" rx="3.1" ry=".9"/><path d="M6.8 2.8h6.4"/></g></svg>`;
      if (typeKey === 'bf109' || typeKey === 'bf110') return `<svg class="ckplane" viewBox="0 0 20 20"><g ${g}>` +
        `<ellipse cx="10" cy="10" rx="1" ry="6.8"/><path d="M2.2 8.4h15.6v1.7H2.2z"/>` +
        `<path d="M6.6 15.6h6.8"/><path d="M7 3.2h6"/></g></svg>`;
      if (kind === 'vague') return `<svg class="ckplane vague" viewBox="0 0 20 20"><g ${g}>` +
        `<ellipse cx="10" cy="10" rx="1.2" ry="6.6"/><path d="M2.6 8.8h14.8v1.6H2.6z"/></g></svg>`;
      return `<svg class="ckplane" viewBox="0 0 20 20"><g ${g}>` +
        `<ellipse cx="10" cy="10" rx="1.5" ry="7.6"/><path d="M.8 8.6h18.4v2H.8z"/>` +
        `<path d="M5.4 16.4h9.2"/><path d="M6 2.6h8"/>` +
        `<circle cx="5.4" cy="9.6" r="1"/><circle cx="14.6" cy="9.6" r="1"/></g></svg>`;
    },

    acRow(m, vague){
      const marks = [];
      if (m.firing) marks.push('<span class="ckmk fire">firing</span>');
      if (m.manv) marks.push('<span class="ckmk manv">breaking</span>');
      if (m.markedDamaged && m.alive) marks.push('<span class="ckmk dam">hit</span>');
      if (m.leaving && m.alive) marks.push('<span class="ckmk out">' +
        (m.ammo <= 0.2 ? 'no ammo' : 'breaking off') + '</span>');
      const name = vague ? 'Unidentified' : (m.pilot ? Pilot.name(m.pilot) : m.label);
      const type = vague ? '' : ' <span>' + m.kind + '</span>';
      return `<div class="ckac${m.alive ? '' : ' gone'}${m.hitNow ? ' hit' : ''}` +
        `${m.manv ? ' bank' : ''}${vague ? ' vague' : ''}">` +
        UI.cockpit.planeArt(vague ? null : m.typeKey, vague ? 'vague' : '') +
        `<span class="ckwho"><b>${name}</b>${type}</span>` +
        `<span class="ckmarks">${marks.join('')}${
          m.markedDamaged && m.alive ? '<svg class="cksmoke on" viewBox="0 0 16 13">' +
          '<circle cx="3" cy="9" r="2.1"/><circle cx="3" cy="9" r="2.1"/><circle cx="3" cy="9" r="2.1"/></svg>' : ''
        }</span></div>`;
    },

    board(){
      const b = Season.s.battle; if (!b) return;
      const st = b.ctx.st;
      const wait = UI.cockpit.awaitTarget;

      // ours, one box per section
      UI.cockpit.set('ckus', st.fr.map(sec => {
        const ang = 'angels ' + Battle.angels(sec.heightBand);
        const note = !Battle.alive(sec) ? 'gone'
          : ang + ' \u00b7 ' + (sec.climbing ? 'climbing' : sec.held ? 'standing off'
            : sec.prefer ? 'onto ' + sec.prefer : UI.sectionWord(sec));
        const cls = ['ckgrp', sec.isAlly ? 'ally' : 'us'];
        if (sec.held) cls.push('held');
        if (sec.prefer) cls.push('ordered');
        if (!Battle.alive(sec)) cls.push('dead');
        return `<div class="${cls.join(' ')}" id="ckgrp-${sec.id}"` +
          `${Battle.alive(sec) && !wait ? ` data-sec="${sec.id}"` : ''}>` +
          `<div class="ckghead"><span>${sec.isAlly ? sec.id : sec.id + ' Section'}</span>` +
          `<span class="ckgnote">${sec.isAlly ? 'not ours to command' : note}</span></div>` +
          sec.men.map(m => UI.cockpit.acRow(m, false)).join('') + `</div>`;
      }).join(''));

      // theirs, grouped as the squadron would see them
      const groups = [];
      const bmb = st.bmb.filter(x => Battle.alive(x));
      const esc = st.esc.filter(x => Battle.alive(x));
      // Their height is a guess, and it is the guess the decision rests on.
      const gnote = secs => 'about angels ' +
        Math.round(secs.reduce((t,x) => t + Battle.angelsGuess(x), 0) / secs.length) +
        ' \u00b7 ' + Battle.bearing(st, secs);
      // You can see contrails long before you can see what is making them, so
      // height and bearing are known from the start; only the type is not.
      const vague = secs => 'about angels ' +
        Math.round(secs.reduce((t,x) => t + Battle.angelsGuess(x), 0) / secs.length) +
        ' \u00b7 ' + Battle.bearing(st, secs) + ' \u00b7 not yet identified';
      if (bmb.length) groups.push({ id:'bombers', label:'Bombers', secs:bmb,
        note: st.identified ? gnote(bmb) : vague(bmb) });
      if (esc.length) groups.push({ id:'escort', label:'Escort', secs:esc,
        note: st.identified ? gnote(esc) : vague(esc) });
      UI.cockpit.set('ckthem', groups.map(g => {
        const men = g.secs.flatMap(x => x.men);
        const shown = men.slice(0, 8);
        const more = men.length - shown.length;
        return `<div class="ckgrp them${wait ? ' pickable' : ''}" id="ckgrp-${g.id}"` +
          `${wait ? ` data-target="${g.id}"` : ''}>` +
          `<div class="ckghead"><span>${g.label}</span><span class="ckgnote">${g.note}</span></div>` +
          shown.map(m => UI.cockpit.acRow(m, !st.identified)).join('') +
          (more > 0 ? `<div class="ckmore">and ${more} more</div>` : '') + `</div>`;
      }).join(''));

      UI.cockpit.bindBoard();
      UI.cockpit.wires();
    },

    bindBoard(){
      const st = Season.s.battle.ctx.st;
      document.querySelectorAll('[data-sec]').forEach(el => el.onclick = ev => {
        ev.stopPropagation();
        UI.cockpit.sectionMenu(el.dataset.sec, el);
      });
      document.querySelectorAll('[data-target]').forEach(el => el.onclick = ev => {
        ev.stopPropagation();
        const w = UI.cockpit.awaitTarget;
        if (!w) return;
        const sec = st.fr.find(x => x.id === w);
        const r = Battle.applyIntervention(st, 'attack', { section:w, target:el.dataset.target });
        UI.cockpit.awaitTarget = null;
        if (r && r.refused) return UI.cockpit.order(r.rt, true);
        const what = el.dataset.target === 'bombers'
          ? 'the bombers. Leave the fighters.' : 'the escort. Hold them off us.';
        UI.cockpit.order(sec && sec.isAlly
          ? sec.unit.name + ', can you take ' + what
          : w + ' Section, get at ' + what);
      });
    },

    // Lines from the section to what it has been sent against.
    wires(){
      const st = Season.s.battle.ctx.st;
      const svg = document.getElementById('ckwires');
      if (!svg || !svg.parentElement) return;
      const f = svg.parentElement.getBoundingClientRect();
      svg.setAttribute('viewBox', `0 0 ${f.width} ${f.height}`);
      let out = '';
      for (const sec of st.fr){
        if (!sec.prefer || !Battle.alive(sec)) continue;
        const a = document.getElementById('ckgrp-' + sec.id);
        const bx = document.getElementById('ckgrp-' + sec.prefer);
        if (!a || !bx) continue;
        const ra = a.getBoundingClientRect(), rb = bx.getBoundingClientRect();
        const x1 = ra.right - f.left, y1 = ra.top + ra.height/2 - f.top;
        const x2 = rb.left - f.left,  y2 = rb.top + rb.height/2 - f.top;
        const mx = (x1 + x2) / 2;
        out += `<path d="M${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" fill="none" ` +
          `stroke="#e8b264" stroke-width="1.4" stroke-dasharray="5 4" opacity=".8">` +
          `<animate attributeName="stroke-dashoffset" from="18" to="0" dur=".7s" repeatCount="indefinite"/>` +
          `</path><circle cx="${x2}" cy="${y2}" r="3" fill="#e8b264" opacity=".85"/>`;
      }
      svg.innerHTML = out;
    },

    /* ------------------------------------------------------- the orders */
    sectionMenu(secId, anchor){
      const st = Season.s.battle.ctx.st;
      const sec = st.fr.find(x => x.id === secId);
      const menu = document.getElementById('ckmenu');
      if (!sec || !menu) return;
      const r = anchor.getBoundingClientRect();
      menu.innerHTML = `<div class="ckmhead">${secId} Section</div>` +
        Battle.sectionOrders(st, sec).map(o =>
          `<button class="ckmopt" data-order="${o.id}">${o.label}</button>`).join('') +
        `<button class="ckmopt quiet" data-order="cancel">Never mind</button>`;
      menu.style.display = 'block';
      menu.style.left = Math.min(r.left, window.innerWidth - 190) + 'px';
      menu.style.top = Math.min(r.top + 6, window.innerHeight - 210) + 'px';
      menu.querySelectorAll('[data-order]').forEach(btn => btn.onclick = ev => {
        ev.stopPropagation();
        const id = btn.dataset.order;
        UI.cockpit.hideMenu();
        if (id === 'cancel') return;
        if (id === 'attack'){
          UI.cockpit.awaitTarget = secId;
          UI.cockpit.board();
          UI.cockpit.narrate('Which of them? Tap the formation you want ' + secId + ' Section onto.');
          return;
        }
        const r = Battle.applyIntervention(st, id, secId);
        if (r && r.refused) return UI.cockpit.order(r.rt, true);
        UI.cockpit.order(sec.isAlly
          ? sec.unit.name + ', can you get out of it? We are on our own here.'
          : id === 'climb_sec'
          ? secId + ' Section, get some height. Do not go in yet.'
          : secId + ' Section, break off and stay out of it.');
      });
    },

    hideMenu(){
      const m = document.getElementById('ckmenu');
      if (m){ m.style.display = 'none'; m.innerHTML = ''; }
    },

    // Your own voice on the wireless, ahead of whatever was queued.
    order(text, refused){
      const b = Season.s.battle;
      b.queue.unshift({ kind:'line', text, voice:'rt', cls: refused ? 'ckloss' : 'ckmine' });
      UI.cockpit.board();
    },

    // The squadron as a whole gets two orders and no more.
    offer(){
      const b = Season.s.battle; if (!b) return;
      const st = b.ctx.st;
      const box = document.getElementById('ckopts');
      if (!box) return;
      box.innerHTML = '';
      if (Battle.done(st)) return;
      if (UI.cockpit.awaitTarget){
        const cancel = document.createElement('button');
        cancel.className = 'ckopt';
        cancel.textContent = 'Never mind';
        cancel.onclick = () => { UI.cockpit.awaitTarget = null; UI.cockpit.board(); UI.cockpit.offer(); };
        box.appendChild(cancel);
        return;
      }
      const mk = (label, cls, fn) => {
        const el = document.createElement('button');
        el.className = 'ckopt' + (cls ? ' ' + cls : '');
        el.textContent = label; el.onclick = fn;
        box.appendChild(el);
      };
      mk('Squadron — in we go', 'primary', () => {
        Battle.applyIntervention(st, 'sqn_attack');
        UI.cockpit.order('Squadron, in we go. Every man pick one.');
        UI.cockpit.offer();
      });
      mk('Break off, all of you', 'danger', () => {
        Battle.applyIntervention(st, 'sqn_break');
        UI.cockpit.order('Break off, break off. Everybody home.');
        UI.cockpit.offer();
      });
    },

    quiet(){ UI.cockpit.offer(); },

    chrome(){
      const b = Season.s.battle; if (!b) return;
      const st = b.ctx.st;
      const phase = Battle.done(st) ? 'over' : Battle.phase(st);
      UI.cockpit.set('ckphase', { approach:'The climb', merge:'The merge',
        melee:'In among them', disengage:'Breaking off', over:'Landing' }[phase] || '');
      const co = st.co;
      const rounds = !co ? '' : (co.man.ammo <= 0.2 ? '<b class="ckdry">Guns empty</b>'
        : Math.round(co.man.ammo) + 's of ammunition');
      const ourSecs = st.fr.filter(x => !x.isAlly && Battle.alive(x));
      const band = ourSecs.length
        ? ourSecs.reduce((t,x) => t + x.heightBand, 0) / ourSecs.length : 3;
      const foes = st.esc.concat(st.bmb).filter(x => Battle.alive(x));
      const theirAngels = foes.length
        ? Math.round(foes.reduce((t,x) => t + Battle.angelsGuess(x), 0) / foes.length) : null;
      UI.cockpit.set('ckalt', 'Angels ' + Math.round(Battle.angels(band)) +
        (theirAngels !== null ? ' &middot; them about ' + theirAngels : '') +
        ' &middot; ' + rounds);

      const bal = Battle.balance(st);
      const mine = document.getElementById('ckbalmine');
      const theirs = document.getElementById('ckbaltheirs');
      if (mine && theirs){
        mine.style.width = (bal * 100).toFixed(1) + '%';
        theirs.style.width = ((1 - bal) * 100).toFixed(1) + '%';
      }
      const was = UI.cockpit.lastBal;
      const swing = was === undefined ? 0 : bal - was;
      UI.cockpit.lastBal = bal;
      const word = bal > 0.62 ? 'We have the better of it'
                 : bal > 0.54 ? 'Slightly our way'
                 : bal > 0.46 ? 'Evenly matched'
                 : bal > 0.38 ? 'Slightly their way' : 'They have the better of it';
      UI.cockpit.set('ckbaltext', word + (Math.abs(swing) < 0.012 ? ''
        : swing > 0 ? ' <span class="up">&#9650;</span>' : ' <span class="down">&#9660;</span>'));
      UI.cockpit.board();
    },

    narrate(text){
      const e = document.getElementById('cknarr');
      if (!e) return;
      e.innerHTML = text;
      e.style.animation = 'none'; void e.offsetWidth; e.style.animation = '';
    },

    say(text, cls){
      const e = document.getElementById('ckcall');
      if (!e) return;
      e.className = 'ckcall ' + (cls || '');
      e.innerHTML = text;
      e.style.animation = 'none'; void e.offsetWidth; e.style.animation = '';
    },

    radio(text){ UI.cockpit.say('<em>&ldquo;' + text + '&rdquo;</em>', 'ckrt'); },

    pump(){
      const s = Season.s, b = s.battle;
      if (!b || !UI.cockpit.el) return;
      const st = b.ctx.st;
      UI.cockpit.chrome();
      UI.cockpit.offer();

      if (!b.queue.length){
        if (Battle.done(st) || st.turnedAway) return UI.cockpit.finish();
        UI.cockpit.buildBeat();
        if (!b.queue.length) return UI.cockpit.finish();
      }
      const item = b.queue.shift();

      if (item.kind === 'line'){
        b.log.push({ text:item.text, cls:item.cls || '' });
        const ms = item.voice === 'narr' ? UI.cockpit.NARR_MS : UI.cockpit.LINE_MS;
        if (item.voice === 'narr') UI.cockpit.narrate(item.text);
        else UI.cockpit.radio(item.text);
        UI.cockpit.timer = setTimeout(() => UI.cockpit.pump(), ms);
        return;
      }
      if (item.kind === 'step'){
        const events = Battle.step(st, null);
        for (const e of events)
          b.queue.push({ kind:'line', text:e.text, cls:'ck' + (e.cls||''), voice:e.voice || 'rt' });
        if (!events.length)
          b.queue.push({ kind:'line', text: UI.chatter(st, Battle.phase(st) || 'melee'), voice:'rt' });
        UI.cockpit.timer = setTimeout(() => UI.cockpit.pump(), UI.cockpit.BEAT_GAP_MS);
        return;
      }
      UI.cockpit.pump();
    },

    // What the squadron looks like on the way back, drawn from what happened.
    homeward(st){
      const men = st.fr.filter(x => !x.isAlly).flatMap(x => x.men);
      const lost = men.filter(m => !m.alive).length;
      const hurt = men.filter(m => m.alive && m.markedDamaged).length;
      const dry  = men.filter(m => m.alive && m.ammo <= 0.2).length;
      const bits = ['The squadron turns for the coast, strung out across ten miles of sky.'];
      if (hurt) bits.push(hurt === 1
        ? 'One aircraft is limping home well behind the rest, streaming glycol.'
        : hurt + ' are straggling, shot about and losing height.');
      if (dry && !hurt) bits.push('Most of them have fired off everything they had.');
      if (lost) bits.push(lost === 1
        ? 'One did not answer when the roll was called over the R/T.'
        : lost + ' did not answer when the roll was called.');
      if (!lost && !hurt) bits.push('Everyone answers. It does not often go like that.');
      return bits.join(' ');
    },

    buildBeat(){
      const b = Season.s.battle, st = b.ctx.st;
      const phase = Battle.phase(st);
      if (phase !== b.lastPhase){
        const opener = { approach:'Climbing. Vapour trails ahead.',
          merge:'Tally ho. Bandits ahead and below.',
          melee:'The formation is gone. Every man for himself now.',
          disengage:'That will do. Everybody home.' }[phase];
        if (opener) b.queue.push({ kind:'line', text:opener, voice:'narr' });
        b.lastPhase = phase;
      }
      b.queue.push({ kind:'step' });
    },

    finish(){
      const b = Season.s.battle, st = b.ctx.st;
      const co = st.co;
      UI.cockpit.awaitTarget = null;
      Battle.settle(st);
      UI.cockpit.chrome();
      if (st.turnedAway){
        UI.cockpit.narrate('They turned back before we could close. Nothing to report.');
        UI.cockpit.say('', '');
      } else if (co && !co.man.alive){
        UI.cockpit.narrate('The aircraft is finished. Get out of it.');
        UI.cockpit.say('', '');
      } else {
        UI.cockpit.radio('Form up on me. Steer for home.');
        UI.cockpit.narrate(UI.cockpit.homeward(st));
      }
      const box = document.getElementById('ckopts');
      if (!box) return;
      box.innerHTML = '';
      const btn = document.createElement('button');
      btn.className = 'ckopt primary';
      btn.textContent = 'Land and file the report';
      btn.onclick = () => {
        clearTimeout(UI.cockpit.timer);
        UI.cockpit.close();
        Season.concludeBattle();
        Season.nextCall();
        UI.render();
      };
      box.appendChild(btn);
    }
  },

  sectionWord(sec){
    if (!Battle.alive(sec)) return 'gone';
    if (sec.cohesion <= BATTLE.cohesion.floor + 2) return 'scattered';
    if (sec.awareness < 46) return 'not looking';
    if (sec.cohesion < 40) return 'straggling';
    return 'in hand';
  },

  // Something on the wireless even when nothing happened, drawn from what the
  // squadron can actually see, so it is never pure decoration.
  chatter(st, phase){
    const blind = st.fr.filter(s => Battle.alive(s) && s.awareness < 46);
    const loose = st.fr.filter(s => Battle.alive(s) && s.cohesion < 34);
    const dry   = st.fr.filter(s => s.men.some(m => m.alive && m.ammo <= 0.2));
    const pool = [];
    if (phase === 'approach') pool.push('Still climbing. Nothing in sight.',
      'Control reports the raid crossing the coast.', 'Keep your eyes open.');
    if (blind.length) pool.push(blind[0].id + ' Section, watch your tails.',
      'Somebody look above and behind.');
    if (loose.length) pool.push(loose[0].id + ' Section, close up.',
      'I have lost sight of ' + loose[0].id + ' Section.');
    if (dry.length) pool.push(dry[0].id + ' Section is out of ammunition.');
    if (phase === 'disengage') pool.push('Form up on me. Steer three-one-zero.',
      'Anyone not answering?');
    if (!pool.length) pool.push('Nothing on the wireless.', 'Turning. Watch the sun.');
    return Rand.pick(pool);
  },

  /* ------------------------------------------------------------- sidebar */
  // The state board, always in view: who is on the squadron, how tired, how
  // steady, and whether they are on the sortie you are putting up.
  sidebar(){
    const s = Season.s, el = document.getElementById('sidebar');
    if (!el) return;
    if (s.over || s.awaitingSetup){ el.innerHTML = ''; return; }
    const picking = !!(s.pending || s.trainingChoice);
    const men = s.pilots.filter(p => p.status === 'active' || p.status === 'wounded')
      .sort((a,b) => (b.isCommander?1:0)-(a.isCommander?1:0) || a.flight.localeCompare(b.flight)
                     || b.rank - a.rank);
    const serv = Season.serviceable().length;
    const picked = men.filter(p => s.selected.has(p.id)).length;

    el.innerHTML = `<div class="sbhead">Readiness board</div>
      <div class="sbnote">${Season.readyPilots().length} available · ${serv} aircraft` +
      (picking ? ` · <b>${picked}</b> detailed` : '') + `</div>` +
      ['A','B'].map(f => {
        const flight = men.filter(p => p.flight === f);
        if (!flight.length) return '';
        return `<div class="sbflight">${f} Flight</div>` + flight.map(p => {
          const out = p.status === 'wounded';
          const on = s.selected.has(p.id) && picking;
          return `<div class="sbrow${on ? ' on' : ''}${out ? ' out' : ''}${p.resting ? ' rest' : ''}"
                       data-sb="${p.id}" title="${Pilot.name(p)}">
            <span class="sbn">${on ? '✓ ' : ''}${CAMPAIGN.ranks[p.rank].short} ${p.last}</span>
            <span class="sbbars">
              <span class="sbline" title="Fatigue ${Math.round(p.fatigue)}"><b>F</b>
                <i class="sbbar" style="width:${100 - clamp(p.fatigue,0,100)}%;background:${UI.scale(100-p.fatigue)}"></i></span>
              <span class="sbline" title="Morale ${Math.round(p.morale)}"><b>M</b>
                <i class="sbbar" style="width:${clamp(p.morale,0,100)}%;background:${UI.scale(p.morale)}"></i></span>
            </span>
            <span class="sbk">${out ? 'hosp' : (p.resting ? 'stood' : p.kills || '')}</span>
          </div>`;
        }).join('');
      }).join('');

    document.querySelectorAll('[data-sb]').forEach(row => row.onclick = () => {
      if (!picking) { UI.tab = 'pilots'; UI.render(); return; }
      const p = s.pilots.find(x => x.id === row.dataset.sb);
      if (!p || p.status !== 'active' || p.resting) return;
      s.selected.has(p.id) ? s.selected.delete(p.id) : s.selected.add(p.id);
      UI.render();
    });
  },
