<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Squadron Leader">
<meta name="theme-color" content="#0a1220">
<style>
  :root{
    color-scheme: dark only;
    /* Deep navy, after the roundel and the ops room. Every surface sets its own
       background: relying on body alone let a light host background show through. */
    /* Palette from the style guide: RAF dark, RAF blue, paper, brass,
       accent red, radar green. The semantic colours are lifted a little from
       the guide's swatches so they stay legible as text on the dark ground. */
    --bg:#0E1625; --panel:#1B2436; --raised:#22304a; --line:#2c3d59;
    --ink:#eef3fa; --dim:#a9bcd4; --faint:#8095b0;
    --brass:#B8924A; --paper:#E6DBC1; --accent:#8D2E2E; --radar:#3BD36A;
    --warn:#d2a45c; --bad:#e0705a; --good:#6fc98a; --cool:#7fb0e8;
  }
  *{box-sizing:border-box}
  html{background:var(--bg);color:var(--ink)}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{padding:12px 16px 0;border-bottom:1px solid var(--line);background:var(--bg)}
  main{background:var(--bg)}
  .hrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .roundel{flex:0 0 auto}
  header h1{font-size:14px;margin:0;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
  .motto{color:var(--faint);font-size:11px;font-style:italic}
  .meta{color:var(--dim);font-size:11px}
  .meta b{color:var(--ink);font-weight:400}
  .station{color:var(--warn);font-size:11px}
  .datewrap{text-align:center;margin:10px 0 4px}
  .bigdate{font-size:19px;letter-spacing:.05em;color:var(--ink);font-weight:400}
  .weatherline{font-size:11px;color:var(--dim);margin-top:3px;display:flex;gap:6px;
    align-items:center;justify-content:center}
  .weatherline b{color:var(--warn);font-weight:400}
  .wicon svg{display:block}
  .strength{display:flex;justify-content:center;gap:16px;font-size:11px;color:var(--dim);flex-wrap:wrap;margin:9px 0 10px}
  .strength b{color:var(--ink);font-weight:400}
  .strength .shortage,.strength span.shortage b{color:var(--bad)}
  nav{display:flex;gap:2px;flex-wrap:wrap}
  nav button{border-bottom:none;border-radius:2px 2px 0 0;padding:6px 13px;background:transparent;color:var(--dim);border:1px solid transparent}
  nav button.on{background:var(--panel);border-color:var(--line);color:var(--ink)}
  nav button{background:transparent}
  .shell{display:flex;align-items:flex-start;gap:0}
  main{padding:14px;max-width:1100px;flex:1 1 auto;min-width:0}
  aside#sidebar{flex:0 0 232px;padding:14px 12px;border-left:1px solid var(--line);
    background:var(--panel);align-self:stretch;position:sticky;top:0;max-height:100vh;overflow-y:auto}
  .sbhead{font:10px/1.5 "Courier New",monospace;letter-spacing:.16em;text-transform:uppercase;
    color:var(--warn);border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:5px}
  .sbnote{font-size:10px;color:var(--dim);margin-bottom:9px}
  .sbflight{font:9px/1.6 "Courier New",monospace;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);margin:9px 0 3px;border-bottom:1px dotted var(--line)}
  .sbrow{display:grid;grid-template-columns:1fr 42px 26px;gap:6px;align-items:center;
    padding:3px 4px;border-radius:2px;cursor:pointer;font-size:11px;color:var(--dim)}
  .sbrow:hover{background:#1a2740}
  .sbrow.on{background:#23304a;box-shadow:inset 2px 0 0 var(--warn);color:var(--ink)}
  .sbrow.out{opacity:.5} .sbrow.rest{opacity:.68}
  .sbn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .sbbars{display:flex;flex-direction:column;gap:2px}
  .sbbar{display:block;height:3px;border-radius:1px;min-width:2px}
  .sbk{text-align:right;font-size:10px;color:var(--faint)}
  @media (max-width:900px){ aside#sidebar{display:none} }
  h2{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:0 0 10px;font-weight:400}
  button{font:inherit;color:var(--ink);background:var(--raised);border:1px solid #33486a;padding:7px 11px;cursor:pointer;border-radius:2px}
  button:hover:not(:disabled){background:#1d2f4a;border-color:#4a668f}
  button:disabled{opacity:.35;cursor:default}
  button:focus-visible{outline:2px solid var(--warn);outline-offset:1px}
  button.primary{background:#1e3b57;border-color:#3f7099;color:#f2f7ff}
  button.quiet{background:transparent;border-color:#2c405e;color:var(--dim)}
  button.tiny{padding:3px 6px;font-size:10px}
  .footer button{background:transparent}
  .btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
  .panel{border:1px solid var(--line);background:var(--panel);padding:12px 13px;border-radius:2px;margin-bottom:12px}
  .call{border-left:2px solid var(--bad)}
  .incident{border-left:2px solid var(--warn)}
  .gong{border-left:2px solid var(--cool)}
  .training{border-left:2px solid #3f7099}
  .quietday{border-left:2px solid var(--line);color:var(--dim)}
  .notice.good{border-left:2px solid var(--good)}
  .notice.warn{border-left:2px solid var(--warn)}
  .confirm{border-left:2px solid var(--cool);background:#16243a}
  .endpanel{margin-bottom:14px}
  .faultbox{border-left:2px solid var(--bad)}
  .when{color:var(--warn);font-size:10px;letter-spacing:.11em;text-transform:uppercase}
  .plot{font-size:15px;line-height:1.4;margin:4px 0 6px;color:var(--ink)}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:9px}
  .card{border:1px solid var(--line);background:var(--panel);padding:10px 11px;border-radius:2px}
  .card.rest{opacity:.72} .card.gone{opacity:.5}
  .card.selectable{cursor:pointer}
  .card.selectable:hover{border-color:#42618c}
  .card.picked{border-color:var(--warn);background:#23304a;box-shadow:inset 3px 0 0 var(--warn)}
  .tick{color:var(--warn)}
  .picker{position:sticky;top:0;z-index:5}
  .card.boss{border-color:#4e7aa8;background:#132436}
  .who{display:flex;gap:9px;align-items:flex-start}
  .photo{flex:0 0 42px;height:52px;border:1px solid var(--line);background:#0d1728;border-radius:1px}
  .whotext{flex:1 1 auto;min-width:0}
  .card h3{margin:0;font-size:13px;font-weight:400;color:var(--ink)}
  .card h3 .rank{color:var(--dim)}
  .pname{cursor:text;border-bottom:1px dotted #4a648a}
  .flt{color:var(--faint);font-size:9px;letter-spacing:.08em;cursor:pointer;border:1px solid #2f486b;padding:1px 4px;border-radius:2px;white-space:nowrap}
  .flt:hover{color:var(--warn);border-color:var(--warn)}
  .sub{color:var(--faint);font-size:10px;margin:2px 0 0}
  .claims{display:flex;gap:3px;align-items:center;flex-wrap:wrap;margin:6px 0 2px;min-height:13px}
  .claims .lab{color:var(--faint);font-size:10px;margin-right:3px}
  .ribbons{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 2px}
  .ribbon{height:11px;width:26px;border:1px solid #000;border-radius:1px}
  .ribbon span{display:none}
  .rib-name{color:var(--warn);font-size:10px}
  .attrs{display:grid;grid-template-columns:1fr;gap:3px;font-size:11px;margin:9px 0 8px}
  .attr{display:grid;grid-template-columns:88px 1fr 44px;align-items:center;gap:8px;color:var(--dim)}
  .attr .an{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .delta{font-size:9px;margin-left:5px;padding:0 3px;border-radius:2px;letter-spacing:.02em}
  .delta.up{color:#14421f;background:rgba(46,120,60,.30);border:1px solid rgba(46,120,60,.55)}
  .delta.down{color:#6d1c12;background:rgba(150,50,38,.26);border:1px solid rgba(150,50,38,.5)}
  .attr b{font-weight:400;color:var(--ink);text-align:right;font-size:11px}
  .attr.c0 b{color:var(--faint);font-style:italic} .attr.c1 b{color:var(--dim)}
  .lvl{display:block;height:5px;background:#1e2f47;border-radius:1px;position:relative;overflow:hidden}
  .lvl i{position:absolute;left:0;top:0;bottom:0;display:block;border-radius:1px}
  .hurtline{color:var(--warn)}
  .bar{height:4px;background:#1e2f47;margin:2px 0 6px;position:relative;border-radius:1px}
  .bar i{position:absolute;left:0;top:0;bottom:0;display:block;border-radius:1px}
  .barlab{display:flex;justify-content:space-between;font-size:10px;color:var(--dim)}
  .toggle{margin-top:7px;width:100%;padding:5px;font-size:10px}
  .know.k0{color:var(--faint);font-style:italic} .know.k1{color:var(--dim)} .know.k2{color:var(--good)}

  /* --- Form 'F': a sheet of 1940 paper on the desk --------------------- */
  .sheet{
    background:#efe6d0;
    background-image:
      repeating-linear-gradient(180deg, transparent 0 25px, rgba(40,60,90,.10) 25px 26px),
      linear-gradient(105deg,#f3ecd9 0%,#eae0c6 55%,#e2d7ba 100%);
    color:#1d2740; margin:0 0 16px; padding:2px;
    border-radius:1px;
    box-shadow:0 1px 0 #cfc3a2, 0 2px 3px rgba(0,0,0,.5), 0 14px 26px rgba(0,0,0,.42);
    position:relative; transform:rotate(-.25deg);
  }
  .sheet::after{  /* the torn foot of the page */
    content:''; position:absolute; left:0; right:0; bottom:-5px; height:6px;
    background:repeating-linear-gradient(90deg,#e2d7ba 0 7px,transparent 7px 9px,#e8dfc6 9px 15px);
    filter:drop-shadow(0 2px 1px rgba(0,0,0,.35));
  }
  .sheetinner{padding:16px 18px 14px 34px; border-left:1px solid rgba(168,68,58,.55); margin-left:16px}
  .formhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    border-bottom:1.5px solid #46506b;padding-bottom:5px;margin-bottom:10px}
  .formno{font:10px/1 "Courier New",monospace;letter-spacing:.22em;color:#5a6076}
  .formtitle{font:600 15px/1 "Courier New",monospace;letter-spacing:.3em;text-transform:uppercase;color:#1d2740}
  .fieldband{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:2px 20px;
    margin:0 -8px 12px;padding:6px 8px;background:rgba(168,68,58,.08);
    border-top:1px solid rgba(70,80,107,.4);border-bottom:1px solid rgba(70,80,107,.4)}
  .fieldband .fk{color:#7d2b22}
  .hand.names{font-size:14px;color:#33406b;margin-bottom:4px}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:2px 20px;margin-bottom:12px}
  .ff{display:flex;gap:8px;align-items:baseline;border-bottom:1px dotted #9aa0ae;padding-bottom:2px}
  .fk{font:10px/1.5 "Courier New",monospace;letter-spacing:.06em;color:#5a6076;white-space:nowrap}
  .fv{font-family:"Bradley Hand","Brush Script MT","Segoe Script","Comic Sans MS",cursive;
      font-size:14px;color:#1a2a5c;flex:1 1 auto}
  .account{margin-top:4px}
  .hand{font-family:"Bradley Hand","Brush Script MT","Segoe Script","Comic Sans MS",cursive;
    font-size:15px;line-height:26px;color:#1a2a5c;margin:0 0 2px}
  .hand.claim{color:#14421f} .hand.loss{color:#7d1f16} .hand.hurt{color:#7a4a12}
  .hand.faintink{color:#4a5470;opacity:.85}
  .secblock{margin:11px 0 0}
  .seclab{font:10px/1.6 "Courier New",monospace;letter-spacing:.14em;text-transform:uppercase;
    color:#46506b;border-bottom:1px solid #b9ad8d;margin-bottom:2px}
  .sig{margin-top:16px;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
  .signed{font-size:18px;color:#1a2a5c;border-bottom:1px solid #46506b;padding:0 22px 1px 8px}
  .sigrule{font:9px/1.4 "Courier New",monospace;letter-spacing:.12em;text-transform:uppercase;color:#5a6076}
  .aar h4{margin:0 0 3px;font-size:13px;font-weight:400}
  .aar .sect{margin:10px 0 0;padding-left:10px;border-left:1px solid #2c405e}
  .aar p{margin:2px 0;color:var(--dim)}
  .aar .claim{color:var(--good)} .aar .loss{color:var(--bad)} .aar .hurt{color:var(--warn)}
  .aar .ally{color:var(--faint);font-style:italic}
  .aar .totals{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}

  .flightbar{margin:0 0 11px}
  .boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
  .board{border:1px solid var(--line);background:var(--panel);padding:11px 12px;border-radius:2px}
  .board h3{margin:0 0 8px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--warn);font-weight:400}
  .brow{display:grid;grid-template-columns:16px 1fr 64px 30px;align-items:center;gap:8px;
    font-size:11px;color:var(--dim);padding:2px 0}
  .brow.gone{opacity:.55}
  .bpos{color:var(--faint)}
  .bname{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bbar{height:5px;background:#1e2f47;border-radius:1px;position:relative;overflow:hidden}
  .bbar i{position:absolute;left:0;top:0;bottom:0;background:var(--cool);border-radius:1px}
  .bval{text-align:right;color:var(--ink)}
  .entry{margin-bottom:15px}
  .entry .date{color:var(--warn);font-size:10px;letter-spacing:.11em;text-transform:uppercase}
  .entry p{margin:2px 0;color:var(--dim);font-size:12px}
  .entry b{color:var(--ink);font-weight:400}
  .entry i{color:var(--faint)}
  .note{color:var(--faint);font-size:11px;margin-top:9px}
  .footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--line)}
  .savebar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .savebar .ok{color:var(--good)} .savebar .bad{color:var(--bad)}
  .textpanel{flex:1 1 100%;margin-top:8px;padding:10px;border:1px solid var(--line);
    background:var(--panel);border-radius:2px}
  .textpanel textarea{width:100%;height:110px;margin:6px 0;resize:vertical;
    font:11px/1.4 ui-monospace,monospace;color:var(--ink);background:#0d1728;
    border:1px solid var(--line);border-radius:2px;padding:7px}
  .savebar .btnrow{margin-top:0}

  /* ======================================================================
     PERIOD SURFACES. Each screen is modelled on a real object from a 1940
     fighter station rather than a theme applied over the top:
       · the sector tote board  -> squadron state lamps in the header
       · the dispersal blackboard -> records and the readiness board
       · buff personnel record cards -> pilots
       · Form 541, the Operations Record Book -> squadron diary
       · an oak memorial panel with engraved brass -> roll of honour
       · Form 'F' -> the combat report, already done
     ====================================================================== */

  /* --- the tote board -------------------------------------------------- */
  .tote{display:flex;gap:0;flex-wrap:wrap;margin:10px 0 2px;
    border:1px solid #0c1420;border-radius:2px;overflow:hidden;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 2px 6px rgba(0,0,0,.45)}
  .totecell{flex:1 1 auto;min-width:88px;padding:5px 9px;text-align:center;
    background:linear-gradient(#141d2e,#0d1524);border-right:1px solid #0c1420;
    font:9px/1.5 "Courier New",monospace;letter-spacing:.14em;text-transform:uppercase;
    color:#93a6c0}
  .totecell.lit{background:linear-gradient(#2b3a20,#1d2916);color:#cfe6a6;
    text-shadow:0 0 7px rgba(160,220,120,.65)}
  .totecell.lit.red{background:linear-gradient(#3d1d18,#2a1310);color:#f0b2a4;
    text-shadow:0 0 7px rgba(230,120,95,.6)}
  .totecell.lit.amber{background:linear-gradient(#3d3016,#2a2110);color:#f0d5a4;
    text-shadow:0 0 7px rgba(230,180,95,.6)}

  /* --- the dispersal blackboard ---------------------------------------- */
  .board2{
    background:
      radial-gradient(ellipse at 22% 18%, rgba(255,255,255,.05), transparent 46%),
      radial-gradient(ellipse at 74% 76%, rgba(255,255,255,.04), transparent 44%),
      linear-gradient(#2a322c,#242b26);
    border:9px solid #4a3a24;border-radius:3px;color:#e9e7dc;
    padding:15px 17px;margin-bottom:12px;
    box-shadow:inset 0 0 44px rgba(0,0,0,.5), 0 3px 9px rgba(0,0,0,.45);
  }
  .board2{border-color:#4a3a24;
    border-image:linear-gradient(160deg,#6b5433,#3d2f1c 45%,#5c4830) 1}
  .chalk{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;
    color:#f2efe4;text-shadow:0 0 2px rgba(255,255,255,.32);letter-spacing:.02em}
  .chalkhead{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;
    font-size:15px;color:#fdf9ec;letter-spacing:.09em;text-transform:uppercase;
    border-bottom:2px solid rgba(240,236,222,.45);padding-bottom:5px;margin:0 0 10px;
    text-shadow:0 0 3px rgba(255,255,255,.4)}
  .chalkdim{color:#b9c0b2}
  .board2 .brow{grid-template-columns:16px 1fr 64px 30px;color:#cdd3c6}
  .board2 .bname{color:#f2efe4}
  .board2 .bbar{background:rgba(255,255,255,.13)}
  .board2 .bbar i{background:#e4dfc9;box-shadow:0 0 4px rgba(255,255,255,.35)}
  .board2 .bval{color:#fdf9ec}
  .board2 .bpos{color:#9aa494}

  /* --- buff personnel record card -------------------------------------- */
  .card.rec{
    background:linear-gradient(176deg,#ded1af 0%,#d6c79d 62%,#cdbd90 100%);
    color:#241f14; border:1px solid #a8946b;
    box-shadow:0 1px 0 #efe6cd inset, 0 2px 5px rgba(0,0,0,.45);
    padding-left:16px; position:relative;
  }
  .card.rec::before{content:'';position:absolute;left:0;top:0;bottom:0;width:7px;
    background:repeating-linear-gradient(180deg,#8f3b2f 0 9px,#7d3327 9px 18px)}
  .card.rec.picked{border-color:#7c5a12;box-shadow:inset 4px 0 0 #b8860b, 0 2px 6px rgba(0,0,0,.5)}
  .card.rec.picked::before{background:#b8860b}
  .card.rec.boss::before{background:repeating-linear-gradient(180deg,#1b3a6b 0 9px,#16305a 9px 18px)}
  .card.rec h3{color:#1d1810;font-family:"Bradley Hand","Brush Script MT","Segoe Script",cursive;
    font-size:16px;letter-spacing:.01em}
  .card.rec h3 .rank{font-family:"Courier New",monospace;font-size:10px;letter-spacing:.12em;
    color:#5c5340;text-transform:uppercase}
  .card.rec .pname{border-bottom:1px dotted #8b7d5c;color:#20305e}
  .card.rec .flt{color:#4c4433;border-color:#a08d66;background:rgba(255,255,255,.22)}
  .card.rec .flt:hover{color:#7d2b22;border-color:#7d2b22}
  .card.rec .sub{color:#4e4634;font-family:"Courier New",monospace;font-size:10px}
  .card.rec .attr{color:#463e2d}
  .card.rec .attr b{color:#1d1810}
  .card.rec .attr.c0 b{color:#544b38} .card.rec .attr.c1 b{color:#4e4634}
  .card.rec .lvl,.card.rec .bar{background:#b3a175;box-shadow:inset 0 1px 1px rgba(0,0,0,.22)}
  .card.rec .barlab{color:#4e4634;font-family:"Courier New",monospace}
  .card.rec .claims .lab{color:#5c5340;font-family:"Courier New",monospace}
  .card.rec .know.k0{color:#544b38} .card.rec .know.k1{color:#4e4634} .card.rec .know.k2{color:#2f5a2c}
  .card.rec .hurtline{color:#8a3d18}
  .card.rec .awards,.card.rec .rib-name{color:#5c4308}
  .card.rec .photo{background:#c6b68b;border-color:#9c8a63}
  .card.rec .toggle{background:rgba(255,255,255,.28);border-color:#a08d66;color:#2f2a1d}
  .card.rec .toggle:hover{background:rgba(255,255,255,.45);border-color:#7d6b45}
  .card.rec .tick{color:#7c5a12}
  .cardstamp{position:absolute;right:9px;top:8px;font:9px/1 "Courier New",monospace;
    letter-spacing:.16em;color:#8b7d5c;text-transform:uppercase}

  /* --- Form 541, the Operations Record Book ---------------------------- */
  .orb{background:
      repeating-linear-gradient(180deg,transparent 0 27px,rgba(60,80,120,.13) 27px 28px),
      linear-gradient(#eee7d3,#e6ddc4);
    color:#20283c;border:1px solid #c3b795;border-radius:1px;
    box-shadow:0 2px 4px rgba(0,0,0,.4), 0 12px 22px rgba(0,0,0,.35);
    padding:0;margin-bottom:14px;overflow:hidden}
  .orbhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    padding:11px 16px 7px 46px;border-bottom:1.5px solid #46506b}
  .orbhead .formno{font:10px/1 "Courier New",monospace;letter-spacing:.2em;color:#5a6076}
  .orbhead .formtitle{font:600 13px/1 "Courier New",monospace;letter-spacing:.26em;
    text-transform:uppercase;color:#20283c}
  .orbbody{padding:10px 16px 16px 46px;border-left:1px solid rgba(168,68,58,.5);margin-left:30px}
  .orbentry{display:grid;grid-template-columns:118px 1fr;gap:4px 14px;padding:8px 0;
    border-bottom:1px dotted #b3a888}
  .orbdate{font:10px/1.6 "Courier New",monospace;letter-spacing:.06em;color:#5a6076;
    text-transform:uppercase}
  .orbtext{font:13px/23px "Courier New",monospace;color:#20283c}
  .orbtext p{margin:0 0 1px}
  .orbtext b{font-weight:700;color:#101728}
  .orbtext i{color:#4a5470}

  /* --- oak panel and engraved brass ------------------------------------ */
  .oak{background:
      repeating-linear-gradient(93deg,rgba(0,0,0,.055) 0 2px,transparent 2px 7px),
      repeating-linear-gradient(88deg,rgba(255,255,255,.035) 0 1px,transparent 1px 11px),
      linear-gradient(160deg,#5b4023,#3f2c17 55%,#4d3620);
    border:10px solid transparent;
    border-image:linear-gradient(150deg,#7a5a30,#3a2812 48%,#6b4d28) 1;
    padding:20px 18px;border-radius:2px;
    box-shadow:inset 0 0 50px rgba(0,0,0,.55), 0 4px 12px rgba(0,0,0,.5)}
  .oakhead{text-align:center;font:600 13px/1.5 Georgia,"Times New Roman",serif;
    letter-spacing:.34em;text-transform:uppercase;color:#e6c98a;margin-bottom:4px;
    text-shadow:0 1px 0 rgba(0,0,0,.7)}
  .oaksub{text-align:center;font:italic 11px/1.6 Georgia,serif;color:#d3b485;margin-bottom:16px}
  .plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:11px}
  .plate{background:linear-gradient(157deg,#d9b978,#a8874a 42%,#c9a765 70%,#8f7139);
    border:1px solid #6d5526;border-radius:1px;padding:11px 13px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 2px 4px rgba(0,0,0,.55)}
  .plate .pn{font:600 13px/1.4 Georgia,"Times New Roman",serif;letter-spacing:.07em;
    color:#241a08;text-shadow:0 1px 0 rgba(255,255,255,.35)}
  .plate .pd{font:11px/1.6 Georgia,serif;color:#33280d;margin-top:2px}
  .plate .pf{font:italic 11px/1.6 Georgia,serif;color:#3b2e10;margin-top:5px}
  .pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:9px;margin:6px 0 4px}
  .pickcard{border:1px solid #b3a888;background:rgba(255,255,255,.28);border-radius:2px;
    padding:9px 11px;cursor:pointer}
  .pickcard:hover{background:rgba(255,255,255,.45)}
  .pickcard.on{border-color:#7d2b22;background:rgba(168,68,58,.14);box-shadow:inset 3px 0 0 #7d2b22}
  .pickcard .pn{font:600 13px/1.4 Georgia,serif;color:#20283c}
  .pickcard .pd{font:10px/1.6 "Courier New",monospace;color:#5a6076}
  .pickcard .pf{font:italic 12px/1.5 Georgia,serif;color:#3a4258;margin-top:3px}
  .formfield{font-family:"Bradley Hand","Brush Script MT",cursive;font-size:16px;color:#1a2a5c;
    background:transparent;border:none;border-bottom:1px solid #9aa0ae;width:100%;padding:1px 2px}
  .formfield:focus{outline:none;border-bottom-color:#7d2b22}
  .plate .claims{margin-top:7px}
  .plate .claims .lab{color:#3b2e10}
  .plate .ribbons{margin-top:6px}
  .plate .rib-name{color:#33280d;font-family:Georgia,serif}

  /* ===================== THE COCKPIT ==================================== */
  .cockpit{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
    background:radial-gradient(ellipse at 50% 30%, #16263f 0%, #0a1220 62%, #060c16 100%);
    color:var(--ink);padding:13px 16px 10px;overflow:hidden}
  .ckhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex:0 0 auto;
    font:10px/1.6 "Courier New",monospace;letter-spacing:.2em;text-transform:uppercase;
    color:var(--warn);border-bottom:1px solid var(--line);padding-bottom:6px}
  .ckalt{color:var(--dim);letter-spacing:.12em}
  .ckdry{color:var(--bad);font-weight:400}
  .ckbal{display:flex;height:7px;border-radius:4px;overflow:hidden;margin:9px 0 3px;flex:0 0 auto;
    border:1px solid #24344c;background:#101a2b}
  .ckbal i{display:block;height:100%;transition:width .7s ease}
  .ckbal .bmine{background:linear-gradient(90deg,#2f6fb0,#5a9ade)}
  .ckbal .btheirs{background:linear-gradient(90deg,#8f3830,#c25a4a)}
  .ckballab{display:flex;justify-content:space-between;flex:0 0 auto;
    font:9px/1.5 "Courier New",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .ckballab span:nth-child(2){color:var(--dim);letter-spacing:.1em}
  .ckballab .up{color:var(--good)} .ckballab .down{color:var(--bad)}
  .cknarr{flex:0 0 auto;text-align:center;padding:8px 6px 4px;max-width:46em;margin:0 auto;
    font:400 13px/1.55 Georgia,"Times New Roman",serif;color:var(--dim);animation:ckin .3s ease-out}

  .ckfield{flex:1 1 auto;display:grid;grid-template-columns:1fr 80px 1fr;position:relative;
    min-height:0;overflow-y:auto;margin-top:4px}
  .ckwires{position:absolute;inset:0;pointer-events:none;z-index:3}
  .ckside{display:flex;flex-direction:column;gap:6px;min-width:0}

  .ckgrp{border:1px solid var(--line);background:rgba(13,23,40,.72);border-radius:2px;
    padding-bottom:3px;transition:border-color .2s, box-shadow .2s}
  .ckgrp[data-sec],.ckgrp.pickable{cursor:pointer}
  .ckgrp[data-sec]:hover,.ckgrp.pickable:hover{border-color:#5a7ba6}
  .ckgrp.pickable{border-style:dashed;border-color:var(--warn)}
  .ckgrp.ordered{border-color:var(--warn);box-shadow:0 0 0 1px rgba(232,178,100,.25)}
  .ckgrp.held .ckghead{background:linear-gradient(90deg,#2a2b33,#1e1f26);color:#a8adba}
  .ckgrp.dead{opacity:.4}
  .ckghead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 8px;
    border-bottom:1px solid var(--line);
    font:10px/1.4 "Courier New",monospace;letter-spacing:.15em;text-transform:uppercase}
  .ckgrp.us .ckghead{background:linear-gradient(90deg,#1c3350,#152742);color:#cfe0f5}
  .ckgrp.them .ckghead{background:linear-gradient(90deg,#42211c,#2c1613);color:#f0c0b5}
  .ckgrp.ally .ckghead{background:linear-gradient(90deg,#1e3a2c,#16291f);color:#bfe0c9}
  .ckgrp.ally{border-color:#2f5340}
  .ckgrp.ally .ckplane{color:#8bc9a0}
  .ckgnote{font-size:9px;letter-spacing:.08em;color:var(--faint);text-transform:none}
  .ckmore{padding:2px 8px;font-size:10px;color:var(--faint);font-style:italic}

  .ckac{display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:6px;
    padding:2px 8px;transition:opacity .4s}
  .ckplane{width:19px;height:19px;color:#8fa8c6;transition:transform .45s ease}
  .them .ckplane{color:#c08b80}
  .ckac.bank .ckplane{transform:rotate(-36deg)}
  .ckac.gone{opacity:.34}
  .ckac.gone .ckwho b{text-decoration:line-through}
  .ckac.gone .ckplane{color:#5b6b80}
  .ckac.hit{animation:ckflash .5s ease-out}
  @keyframes ckflash{0%{background:rgba(224,112,90,.55)}100%{background:transparent}}
  .ckwho{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--dim)}
  .ckwho b{font-weight:400;color:var(--ink)}
  .ckwho span{color:var(--faint)}
  .ckac.vague .ckwho b{color:var(--faint);font-style:italic}
  .ckac.vague .ckplane{opacity:.45;filter:blur(.7px)}
  .ckmarks{display:flex;gap:4px;align-items:center;min-height:12px}
  .ckmk{font:9px/1 "Courier New",monospace;letter-spacing:.05em;text-transform:uppercase;
    padding:2px 4px;border-radius:2px;border:1px solid transparent;white-space:nowrap}
  .ckmk.fire{color:#ffd9a0;border-color:#8a6224;background:rgba(232,178,100,.14);
    animation:ckblink .42s steps(2,end) infinite}
  @keyframes ckblink{0%,50%{opacity:1}51%,100%{opacity:.3}}
  .ckmk.manv{color:#a9cdf0;border-color:#2f5480;background:rgba(127,176,232,.12)}
  .ckmk.dam{color:#e6b3a6;border-color:#7a3e34;background:rgba(224,112,90,.12)}
  .cksmoke{width:15px;height:12px;overflow:visible}
  .cksmoke circle{fill:#7d8896;opacity:0}
  .cksmoke.on circle{animation:ckpuff 1.5s linear infinite}
  .cksmoke.on circle:nth-child(2){animation-delay:.5s}
  .cksmoke.on circle:nth-child(3){animation-delay:1s}
  @keyframes ckpuff{0%{opacity:.5;transform:translate(0,0) scale(.5)}
    100%{opacity:0;transform:translate(9px,-7px) scale(1.5)}}

  .ckmid{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:9px 4px;min-height:62px}
  .ckcall{font-size:clamp(18px,2.7vw,30px);line-height:1.3;max-width:22em;color:var(--ink);
    animation:ckin .28s ease-out}
  .ckcall em{font-style:italic}
  @keyframes ckin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .ckcall.ckrt{color:#dbe8fa} .ckcall.ckclaim{color:var(--good)}
  .ckcall.ckloss{color:var(--bad)} .ckcall.ckmine{color:var(--warn)}
  .ckfoot{flex:0 0 auto}
  .ckopts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:36px}
  .ckopt{font:inherit;font-size:13px;color:var(--dim);background:#16243a;border:1px solid #2f486b;
    border-radius:3px;padding:9px 15px;cursor:pointer}
  .ckopt:hover{background:#22364f;border-color:#5a7ba6;color:var(--ink)}
  .ckopt.primary{background:#1e3b57;border-color:#4a7ea8;color:var(--ink)}
  .ckopt.danger{border-color:#6b3b33;color:#e0a294}
  .ckopt.danger:hover{background:#3a201b;border-color:#a8564a}

  .ckmenu{display:none;position:fixed;z-index:210;min-width:172px;
    background:#16243a;border:1px solid #4a668f;border-radius:3px;
    box-shadow:0 8px 24px rgba(0,0,0,.6);padding:5px}
  .ckmhead{font:9px/1.5 "Courier New",monospace;letter-spacing:.16em;text-transform:uppercase;
    color:var(--warn);padding:4px 8px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .ckmopt{display:block;width:100%;text-align:left;font:inherit;font-size:13px;color:var(--ink);
    background:transparent;border:none;border-radius:2px;padding:8px 10px;cursor:pointer}
  .ckmopt:hover{background:#24395a}
  .ckmopt.quiet{color:var(--faint);font-size:12px}
  @media (max-width:820px){
    .ckfield{grid-template-columns:1fr;gap:6px} .ckwires{display:none}
    .cockpit{padding:11px 12px} .ckopt{padding:8px 12px;font-size:12px}
  }

  /* --- tabs as a card index on the adjutant's desk ---------------------- */
  nav#tabs{display:flex;gap:3px;flex-wrap:wrap;padding:9px 2px 0;align-items:flex-end}
  nav#tabs button{position:relative;border:1px solid #8a7856;border-bottom:none;
    border-radius:5px 5px 0 0;padding:8px 15px 7px 19px;
    font:11px/1.4 "Courier New",monospace;letter-spacing:.13em;text-transform:uppercase;
    background:linear-gradient(180deg,#b8a67e,#9d8a63);color:#3a3222;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 -1px 3px rgba(0,0,0,.3);
    top:3px;transition:top .1s ease, background .1s ease}
  nav#tabs button::before{content:'';position:absolute;left:7px;top:50%;transform:translateY(-50%);
    width:4px;height:4px;border-radius:50%;background:rgba(0,0,0,.22)}
  nav#tabs button:hover{background:linear-gradient(180deg,#c6b489,#a8956d);top:1px}
  nav#tabs button.on{background:linear-gradient(180deg,#e8dcbb,#d6c79d);color:#231c0e;
    border-color:#a8946b;top:0;z-index:2;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 -2px 5px rgba(0,0,0,.35)}
  nav#tabs button.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#e8dcbb}
  header{padding-bottom:0}

  /* --- header statistics ------------------------------------------------ */
  .strength{gap:22px;align-items:flex-start}
  .strength .stat{display:flex;flex-direction:column;align-items:center;gap:2px}
  .strength .statline{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
  .strength .statline b{color:var(--ink);font-weight:400}
  .strength .statlab{font:9px/1.4 "Courier New",monospace;letter-spacing:.14em;
    text-transform:uppercase;color:var(--faint)}
  .statico{display:block;color:var(--faint);flex:0 0 auto}
  .strength .cross{display:inline-flex;gap:2px;align-items:center}
  .strength .shortage .statico,.strength .shortage .statlab{color:var(--bad)}

  /* --- the tote board as lamps ------------------------------------------ */
  .tote{align-items:stretch}
  .totecell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 9px 7px}
  .lamp .glass{fill:#141d2e;stroke:#2c4062;stroke-width:1.1}
  .lamp .fil{fill:none;stroke:#33486a;stroke-width:1.1}
  .lamp .cap{fill:#26344c}
  .totelab{font:9px/1.4 "Courier New",monospace;letter-spacing:.14em;text-transform:uppercase}
  .totecell.lit .glass{fill:#3f5a24;stroke:#7fa64a;filter:drop-shadow(0 0 5px rgba(150,215,105,.6))}
  .totecell.lit .fil{stroke:#d8f0a8}
  .totecell.lit .cap{fill:#3c4a3a}
  .totecell.lit.red .glass{fill:#5a231a;stroke:#c46152;filter:drop-shadow(0 0 5px rgba(226,120,95,.6))}
  .totecell.lit.red .fil{stroke:#f7cdc2}
  .totecell.lit.amber .glass{fill:#5a4419;stroke:#c9a052;filter:drop-shadow(0 0 5px rgba(230,180,95,.6))}
  .totecell.lit.amber .fil{stroke:#f6e3b8}
  .flt.sect{border-style:dashed}
  .card.rec .flt.sect{border-color:#8b7d5c}

  /* --- readiness board: which bar is which ------------------------------ */
  .sbbars{display:flex;flex-direction:column;gap:2px}
  .sbline{display:flex;align-items:center;gap:3px}
  .sbline b{font:8px/1 "Courier New",monospace;color:var(--faint);font-weight:400;width:6px}
  .sbrow{grid-template-columns:1fr 54px 26px}

  /* --- an aircraft on its way out of the fight -------------------------- */
  .ckmk.out{color:#c9cfda;border-color:#4a5468;background:rgba(160,175,200,.12)}

  /* --- the score card at the end ---------------------------------------- */
  .scoretab{width:100%;border-collapse:collapse;font:12px/1.7 "Courier New",monospace;color:#20283c}
  .scoretab td{padding:1px 0;border-bottom:1px dotted #b3a888}
  .scoretab td.n,.scoretab td.e,.scoretab td.p{text-align:right;white-space:nowrap;padding-left:10px}
  .scoretab td.e{color:#6a6350}
  .scoretab td.p{font-weight:700;color:#14421f}
  .scoretab td.p.neg{color:#7d1f16}
  .scoretab tr.tot td{border-top:1.5px solid #46506b;border-bottom:none;padding-top:5px;
    font-weight:700;font-size:14px}
  .scoretab tr.tot td:first-child{font-family:Georgia,serif;letter-spacing:.04em}

  /* --- room to scroll past the end on a phone --------------------------- */
  main{padding-bottom:96px}
  @media (max-width:640px){ main{padding-bottom:132px} }
  .fv.good{color:#14421f;font-weight:700}
  .fv.bad{color:#7d1f16;font-weight:700}
  .pagefoot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;gap:9px}
  .buildstamp{font:9px/1.4 "Courier New",monospace;letter-spacing:.16em;
    text-transform:uppercase;color:var(--faint)}
  .pagefoot button.restart{font-size:11px;opacity:.75;border-color:#4a3330;color:#c9948a}
  .pagefoot button.restart:hover{opacity:1;border-color:#a8564a;color:#e0a294;background:#2a1512}
  .photo{object-fit:cover;border-radius:1px}
  img.photo{width:42px;height:52px}
  .plate img.photo{float:left;margin:0 9px 4px 0;width:46px;height:57px;
    border:1px solid #6d5526;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .acart{display:block;width:100%;border-radius:2px;margin-bottom:7px;
    border:1px solid rgba(0,0,0,.25)}
  .card.rec img.photo{border:1px solid #9c8a63;box-shadow:0 1px 2px rgba(0,0,0,.35)}
  input.rename{font:inherit;font-size:13px;background:#0d1728;color:var(--ink);border:1px solid var(--warn);border-radius:2px;padding:1px 4px;width:75%}
</style>
</head>

</header>

<div class="shell">

function makeRand(seed){
  let s = (seed >>> 0) || 1;
  const f = () => { s = (Math.imul(s,1664525) + 1013904223) >>> 0; return s / 4294967296; };
  return {
    raw: f,
    getState: () => s,
    setState: v => { s = (v >>> 0) || 1; },
    int: (a,b) => a + Math.floor(f() * (b - a + 1)),
    pick: arr => arr[Math.floor(f() * arr.length)],
    chance: p => f() < p,
    gauss: (m,sd) => { const u = Math.max(1e-9,f()), v = f();
      return m + sd * Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }
  };
}

// Every surname issued this campaign, so no two men ever share one. Derived
// from the roll rather than saved separately, which keeps old saves loadable.
// The dead stay on the register: reusing a lost man's name is the jarring part.
const NameBook = {
  used: new Set(), pairs: new Set(), faces: new Set(),
  reset(){ NameBook.used = new Set(); NameBook.pairs = new Set(); NameBook.faces = new Set(); },
  seed(roll){
    NameBook.reset();
    for (const p of roll || []){
      if (p && p.last) NameBook.claim(p.last, p.first);
      if (p && p.portrait !== undefined && p.portrait !== null) NameBook.faces.add(p.portrait);
    }
  },
  pair: (last, first) => String(last).toLowerCase() + '|' + String(first || '').charAt(0).toLowerCase(),
  claim(last, first){
    if (!last) return;
    NameBook.used.add(String(last).toLowerCase());
    if (first) NameBook.pairs.add(NameBook.pair(last, first));
  },
  release(last){ if (last) NameBook.used.delete(String(last).toLowerCase()); },
  free(list){ return list.filter(l => !NameBook.used.has(String(l).toLowerCase())); },

  take(nat){
    const pool = Pilot.namesFor(nat);
    let last = null, first = null;
    const free = NameBook.free(pool.last);
    if (free.length) last = Rand.pick(free);
    else {
      // That nation's pool is spent. Borrow from the general pool before
      // repeating anything -- a squadron did not run out of surnames.
      const wider = NameBook.free(CAMPAIGN.surnames);
      if (wider.length) last = Rand.pick(wider);
    }
    if (last) first = Rand.pick(pool.first);
    else {
      // Every surname in play. Repeat one, but never with the same initial,
      // so the readiness board still reads unambiguously.
      // Prefer the surname with the most initials still free, so repeats
      // spread out rather than piling onto one name.
      const spare = pool.last.map(l => ({
        l, free: pool.first.filter(f => !NameBook.pairs.has(NameBook.pair(l, f))) }))
        .sort((a, b) => b.free.length - a.free.length);
      const bestFree = spare[0].free.length;
      const best = spare.filter(x => x.free.length === bestFree);
      const choice = best[Math.floor(Rand.raw() * best.length)];
      last = choice.l;
      first = choice.free.length ? Rand.pick(choice.free) : Rand.pick(pool.first);
    }
    NameBook.claim(last, first);
    return { first, last, label: pool.label };
  }
};

const Pilot = {
  // Which pool a man is drawn from, and therefore what he is called.
  pickNationality(founding){
    const table = (CAMPAIGN.squadron.intake &&
                   CAMPAIGN.squadron.intake[founding ? 'founding' : 'replacement'])
                  || CAMPAIGN.defaultIntake;
    let r = Rand.raw(), acc = 0;
    for (const k in table){ acc += table[k]; if (r <= acc) return k; }
    return 'british';
  },

  // A face, chosen from the right pool so the badge on his card matches where
  // he came from, and kept on the pilot so it never changes under him.
  portraitFor(nat, release){
    // The roll does not exist yet while the founding pilots are being made, so
    // the register has to do the remembering -- exactly as it does for names.
    if (release !== undefined && release !== null) NameBook.faces.delete(release);
    const pool = PORTRAITS.pool[
      nat === 'polish' ? 'polish' : nat === 'czech' ? 'czech'
      : nat === 'canadian' ? 'commonwealth' : 'british'];
    const free = pool.filter(i => !NameBook.faces.has(i));
    const pick = Rand.pick(free.length ? free : pool);
    NameBook.faces.add(pick);
    return pick;
  },

  namesFor(nat){
    if (nat === 'british' || !CAMPAIGN.nationalities[nat])
      return { first: CAMPAIGN.firstNames, last: CAMPAIGN.surnames, label:'' };
    const n = CAMPAIGN.nationalities[nat];
    return { first: n.first, last: n.last, label: n.label };
  },

  create(founding){
    const spec = founding ? CAMPAIGN.intake.founding : CAMPAIGN.intake.replacement;
    const truth = {}, bias = {};
    for (const a of CAMPAIGN.attributes){
      truth[a.key] = clamp(Math.round(Rand.gauss(spec.mean, spec.sd)),
                           CAMPAIGN.attributeRange.min, CAMPAIGN.attributeRange.max);
      bias[a.key] = Rand.raw()*2 - 1;
    }
    const A = CAMPAIGN.aptitude;
    const aptitude = clamp(Math.round(Rand.gauss(A.mean, A.sd)),
                           CAMPAIGN.attributeRange.min, CAMPAIGN.attributeRange.max);
    const nat = Pilot.pickNationality(founding);
    const pool = Pilot.namesFor(nat);
    const drawn = NameBook.take(nat);
    const first = drawn.first, last = drawn.last;
    return {
      id: 'p' + Math.floor(Rand.raw()*1e9).toString(36),
      first, last, initial: first[0], truth, bias,
      nationality: nat, nationLabel: pool.label, aptitude, aptitudeSeen: 0,
      portrait: Pilot.portraitFor(nat),
      growth:{}, baseline:{ ...truth },
      seen: Object.fromEntries(CAMPAIGN.attributes.map(a => [a.key, 0])),
      acquaintance: 0,
      rank: founding ? Rand.int(0,2) : 0,
      xp: founding ? Rand.int(120,600) : 0,
      hours: Rand.int(spec.hours[0], spec.hours[1]),
      flight:'A',
      sorties:0, kills:0, shared:0, damaged:0, damageDealt:0, fatigue:0, morale:82,
      recommended:{}, burden:0, isCommander:false, notableActions:0,
      injury:null, permanentHarm:[],
      awards:[], status:'active', backOn:null, resting:false
    };
  },
  name: p => CAMPAIGN.ranks[p.rank].short + ' ' + p.initial + '. ' + p.last,

  estimate(p, key){
    const o = CAMPAIGN.observation, R = CAMPAIGN.attributeRange;
    const conf = Math.min(1, (p.seen[key]||0) / o.certainty);
    const err = o.maxError * (1 - conf);
    const centre = clamp(p.truth[key] + p.bias[key]*err, R.min, R.max);
    const half = Math.round(err * 0.7);
    return { value: Math.round(centre),
             low: clamp(Math.round(centre-half), R.min, R.max),
             high: clamp(Math.round(centre+half), R.min, R.max),
             spread: half,
             confidence: conf < 0.34 ? 0 : conf < 0.75 ? 1 : 2 };
  },
  acquaintance(p){
    const o = CAMPAIGN.observation;
    const mean = CAMPAIGN.attributes.reduce((t,a) =>
      t + Math.min(1, (p.seen[a.key]||0)/o.certainty), 0) / CAMPAIGN.attributes.length;
    return mean < 0.3 ? 0 : mean < 0.72 ? 1 : 2;
  },
  acquaintanceLabel: ['an unknown quantity','still forming a view','a known man'],

  // 0 for a man straight from OTU, 1 for one who is worked up.
  workedUp(p){
    const W = CAMPAIGN.workUp;
    return clamp((p.hours - W.offsetHours) / W.hoursForFull, 0, 1);
  },

  effective(p, key){
    // Fatigue now bites non-linearly: the last quarter costs far more than the
    // first, so flying the same six men every scramble collapses rather than sags.
    let drag = 1 - 0.58 * Math.pow(p.fatigue/100, 1.5);
    if (p.isCommander) drag *= 1 - 0.30 * (p.burden/100);
    const W = CAMPAIGN.workUp;
    const green = W.floor + (1 - W.floor) * Pilot.workedUp(p);
    // Inexperience shows up first in what a man notices and how he flies formation.
    const weight = (key === 'awareness' || key === 'airmanship') ? green : (0.45 + 0.55 * green);
    return p.truth[key] * drag * weight;
  },


};

  applySetup(setup){

    CAMPAIGN.squadron.name = sq.name;
    CAMPAIGN.squadron.aircraft = sq.type;
    CAMPAIGN.squadron.home = sq.home;
    CAMPAIGN.squadron.motto = sq.motto;
    CAMPAIGN.squadron.intake = sq.intake || null;
    return sq;
  },

  begin(setup, seed){
    Season.applySetup(setup);
    Season.start(seed);
    const s = Season.s;
    s.setup = { ...setup };
    s.awaitingSetup = false;
    const boss = Season.commander();
    if (boss && setup.commander){
      const bits = setup.commander.trim().split(/\s+/);
      boss.first = bits.length > 1 ? bits[0] : '';
      boss.last  = bits.length > 1 ? bits.slice(1).join(' ') : bits[0];
      boss.initial = (boss.first || boss.last)[0].toUpperCase();
      NameBook.claim(boss.last, boss.first);
    }
    const sq = CAMPAIGN.squadrons.find(x => x.id === setup.squadronId);
    const st = Season.station();
    s.diary.length = 0;
    Season.pushDiary([
      `<b>${CAMPAIGN.squadron.name}</b> at ${st.name}, ${st.county} — ${Season.group().name}.`,
      `${s.aircraft.length} ${BALANCE.types[CAMPAIGN.squadron.aircraft].name}s on charge, ` +
      `${Season.activePilots().length} pilots.`,
      `<b>${boss ? Pilot.name(boss) : ''}</b> assumes command. <i>${sq.motto}</i>`
    ]);
    return s;
  },

  start(seed){
    Rand = makeRand(seed || Date.now());
    NameBook.reset();
    const C = CAMPAIGN;
    const pilots = [];
    for (let i = 0; i < C.squadron.pilotEstablishment; i++){
      const p = Pilot.create(true); p.flight = i % 2 ? 'B' : 'A'; pilots.push(p);
    }
    // You. The squadron leader flies like everyone else, and carries what the
    // others do not.
    const boss = pilots[0];
    if (CAMPAIGN.squadron.intake && boss.nationality !== 'british'){
      NameBook.release(boss.last);
      const drawn = NameBook.take('british');
      boss.first = drawn.first; boss.last = drawn.last;
      boss.portrait = Pilot.portraitFor('british', boss.portrait);
      NameBook.claim(boss.last, boss.first);
      boss.initial = boss.first[0]; boss.nationality = 'british'; boss.nationLabel = '';
    }
    boss.rank = CAMPAIGN.ranks.length - 1;
    boss.isCommander = true; boss.burden = 0; boss.commandSince = 1;
    boss.hours = Rand.int(700, 1400);
    // Serial blocks were allocated by type: Spitfires ran in the X4/P9/R6
    // ranges, Hurricanes in P2/V6/N2. It is a small thing and it is wrong the
    // moment you see a Hurricane squadron flying X4 serials.
    const aircraft = [];
    for (let i = 0; i < C.squadron.aircraftEstablishment; i++)
      aircraft.push({ id:'A'+(i+1), serial:Season.newSerial(), repairUntil:null, lost:false });

    Season.s = {
      date: new Date(Date.UTC(C.start.y, C.start.m, C.start.d)),
      day: 1, week: 1,
      stationId: C.squadron.home, restDays: 0,
      standing: C.command.standingStart, groundCrewFatigue: 0,
      pilots, roll: pilots.slice(), aircraft,
      weather: null, calls: [], callIndex: 0, pending: null, report: null, incident: null,
      selected: new Set(), trainingChoice: null,
      citations: [], recommendation: null,
      diary: [], dayLines: [], pendingWriteOffs: 0,
      tally: { claims:0, shared:0, damaged:0, losses:0, sorties:0, aircraftLost:0 },
      recentLosses: [], notices: [], carryNotices: [], over: null, serviceableYesterday: 0,
      awaitingSetup: true, setup: null
    };
    const st = Season.station();
    Season.pushDiary([`<b>${C.squadron.name}</b> at ${st.name}, ${st.county}. ` +
      `${pilots.length} pilots and ${aircraft.length} ` +
      `${BALANCE.types[C.squadron.aircraft].short}s on charge.`]);
    Season.beginDay();
    return Season.s;
  },

  // A serial from the block the type was actually issued from.
  newSerial(){
    const blocks = CAMPAIGN.serials[CAMPAIGN.squadron.aircraft] || CAMPAIGN.serials.spitfire;
    return Rand.pick(blocks) + Rand.int(100, 999);
  },

  station: () => GEOGRAPHY.station(Season.s.stationId),
  group: () => GEOGRAPHY.groups[Season.station().group],

  // Day numbers are an implementation detail; the player should only ever see
  // a date.
  dateFor(day){
    const d = new Date(Date.UTC(CAMPAIGN.start.y, CAMPAIGN.start.m, CAMPAIGN.start.d));
    d.setUTCDate(d.getUTCDate() + (day - 1));
    return CAMPAIGN.days[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + CAMPAIGN.months[d.getUTCMonth()];
  },
  shortDateFor(day){
    const d = new Date(Date.UTC(CAMPAIGN.start.y, CAMPAIGN.start.m, CAMPAIGN.start.d));
    d.setUTCDate(d.getUTCDate() + (day - 1));
    return d.getUTCDate() + ' ' + CAMPAIGN.months[d.getUTCMonth()].slice(0,3);
  },

  // Convalescence is not a countdown. Men rally and men relapse.
  reviewSickbay(){
    const s = Season.s;
    for (const p of s.roll){
      if (p.status !== 'wounded' || !p.backOn || p.backOn <= s.day) continue;
      if (p.grounded) continue;
      if (!Rand.chance(CAMPAIGN.convalescence.reviewOdds)) continue;
      if (Rand.chance(CAMPAIGN.convalescence.worseOdds)){
        const extra = Rand.int(CAMPAIGN.convalescence.setback[0], CAMPAIGN.convalescence.setback[1]);
        p.backOn += extra;
        s.dayLines.push(`Word from the hospital: <b>${Pilot.name(p)}</b> has taken a turn for the worse. ` +
          `Not expected back before ${Season.dateFor(p.backOn)}.`);
      } else {
        const less = Rand.int(CAMPAIGN.convalescence.rally[0], CAMPAIGN.convalescence.rally[1]);
        p.backOn = Math.max(s.day + 1, p.backOn - less);
        s.dayLines.push(`<b>${Pilot.name(p)}</b> is mending faster than the MO expected — ` +
          `back about ${Season.dateFor(p.backOn)}.`);
      }
    }
  },

  dateLabel(){
    const x = Season.s.date;
    return CAMPAIGN.days[x.getUTCDay()] + ' ' + x.getUTCDate() + ' ' +
           CAMPAIGN.months[x.getUTCMonth()] + ' ' + x.getUTCFullYear();
  },

  phase(){
    const x = Season.s.date;
    const stamp = String(x.getUTCMonth()+1).padStart(2,'0') + '-' + String(x.getUTCDate()).padStart(2,'0');
    let found = CAMPAIGN.timeline[0];
    for (const p of CAMPAIGN.timeline) if (stamp >= p.from) found = p;
    return found;
  },

  activePilots: () => Season.s.pilots.filter(p => p.status === 'active'),
  readyPilots: () => Season.activePilots().filter(p => !p.resting)
    .sort((a,b) => a.fatigue - b.fatigue || b.truth.leadership - a.truth.leadership),
  serviceable(){
    const s = Season.s;
    return s.aircraft.filter(a => !a.lost && (!a.repairUntil || a.repairUntil <= s.day));
  },
  maxCommit: () => Math.min(Season.readyPilots().length, Season.serviceable().length),

  /* --- the day --------------------------------------------------------- */
  beginDay(){
    const s = Season.s;
    s.dayLines = [];
    s.weather = Season.rollWeather();
    s.callIndex = 0; s.pending = null; s.report = null;

    s.groundCrewFatigue = clamp(s.groundCrewFatigue - CAMPAIGN.groundCrew.nightlyRecovery, 0, 100);
    const boss0 = Season.commander();
    const burdenDrag = boss0 ? boss0.burden/100 : 0;
    for (const p of Season.activePilots()){
      p.fatigue = clamp(p.fatigue - CAMPAIGN.fatigue.nightlyRecovery, 0, 100);
      p.morale  = clamp(p.morale + CAMPAIGN.morale.nightlyRecovery * (1 - burdenDrag*0.5), 0, 100);
    }
    s.notices = s.carryNotices || [];
    s.carryNotices = [];
    for (const p of s.roll)
      if (p.deltaOn && s.day - p.deltaOn >= CAMPAIGN.development.showDays){
        p.delta = {}; p.deltaOn = null;
      }
    for (const p of s.roll)
      if (p.status === 'wounded' && p.backOn <= s.day) Season.returnFromHospital(p);

    // Aircraft that came off the line overnight.
    const serv = Season.serviceable().length;
    if (s.serviceableYesterday && serv > s.serviceableYesterday){
      const n = serv - s.serviceableYesterday;
      s.notices.push({ kind:'good',
        text: `${n} aircraft returned to serviceability overnight. ${serv} on the line this morning.` });
    }
    s.serviceableYesterday = serv;

    if (!Season.canFly())
      s.notices.push({ kind:'warn',
        text:`<b>The squadron is non-operational.</b> ` +
          (Season.readyPilots().length ? '' : 'No pilots are fit to fly. ') +
          (Season.serviceable().length ? '' : 'No aircraft are serviceable. ') +
          `Any call from Sector can be answered by reporting the squadron unable.` });

    // More men than aeroplanes is the state that quietly costs you sorties.
    const ready = Season.readyPilots().length;
    if (ready > serv)
      s.notices.push({ kind:'warn',
        text: `${ready} pilots at readiness but only ${serv} aircraft serviceable. ` +
              `${ready - serv} men will be standing about.` });

    // 48-hour passes and standing-down orders expire
    for (const p of s.pilots)
      if (p.restUntil && p.restUntil <= s.day){ p.resting = false; p.restUntil = null; }

    Season.releaseCitations();
    Season.judgeCommand();
    Season.reviewSickbay();
    Season.emergencyPosting();
    // Opinion drifts back towards neutral, so a bad fortnight is not permanent.
    s.standing = s.standing < 50 ? Math.min(50, s.standing + CAMPAIGN.command.standingDrift)
                                 : s.standing;
    if (Season.overCap().length) Season.rebalanceFlights(true);
    s.incident = Season.rollIncident();
    s.calls = Season.generateCalls();
    if (!s.calls.length)
      s.dayLines.push(s.weather.name === 'rain'
        ? 'No flying. ' + s.weather.note
        : 'A quiet day. ' + s.weather.note + ' No calls from the sector controller.');
    Season.nextCall();
  },

  rollIncident(){
    if (!Rand.chance(CAMPAIGN.incidentOdds)) return null;
    const s = Season.s;
    s.incidentSeen = s.incidentSeen || {};
    const pool = [];
    for (const def of INCIDENTS){
      // Cooldowns stop the same thing happening three times in a fortnight,
      // which is what made the sick parade look absurd.
      const last = s.incidentSeen[def.id];
      if (last && s.day - last < (def.cooldown || 0)) continue;
      const ctx = def.ctx(s);
      if (!ctx) continue;
      for (let w = 0; w < def.weight; w++) pool.push({ def, ctx });
    }
    return pool.length ? Rand.pick(pool) : null;
  },

  resolveIncident(index){
    const s = Season.s, inc = s.incident;
    s.incidentSeen = s.incidentSeen || {};
    s.incidentSeen[inc.def.id] = s.day;
    const line = inc.def.options[index].apply(s, inc.ctx);
    s.dayLines.push(line);
    s.incident = null;
  },

  // Fly through the quiet days until something needs you.
  skipToAction(maxDays){
    const s = Season.s;
    for (let i = 0; i < (maxDays || 21); i++){
      Season.endDay();
      if (s.over || s.calls.length || s.incident || (s.notices && s.notices.length)) return;
    }
  },

  // A non-operational flight. Costs a day on the state, buys hours and lets you
  // see what the man is actually made of.
  train(pilots, typeId){
    const s = Season.s, T = CAMPAIGN.training;
    const ex = T.types.find(t => t.id === typeId);
    const lines = [];
    for (const p of pilots){
      if (p.status !== 'active') continue;
      p.hours += ex.hours;
      p.resting = true; p.restUntil = s.day + 1;
      p.fatigue = clamp(p.fatigue + ex.fatigue, 0, 100);
      p.xp += 4;
      for (const k in ex.seen) p.seen[k] = (p.seen[k]||0) + ex.seen[k];
      Season.develop(p, CAMPAIGN.development.training[ex.id]);

      const risk = ex.risk
        * (1 + (T.greenRisk - 1) * (1 - Pilot.workedUp(p)))
        * (1 + (T.weatherRisk - 1) * (1 - s.weather.contact))
        * (1 + (T.fatigueRisk - 1) * (p.fatigue/100));

      if (!Rand.chance(risk)) continue;
      Season.trainingAccident(p, ex, lines);
    }
    if (!lines.length)
      lines.push(`${pilots.length} aircraft up on ${ex.name.toLowerCase()}. Nothing to report.`);
    s.dayLines.push(...lines);
    s.selected = new Set();
    return lines;
  },

  trainingAccident(p, ex, lines){
    const s = Season.s, S = CAMPAIGN.training.severity, r = Rand.raw();
    const ac = Season.serviceable();
    if (r < S.aircraftOnly){
      if (ac.length) ac[0].repairUntil = s.day + Rand.int(2,6);
      p.morale = clamp(p.morale - 6, 0, 100);
      lines.push(`<b>${Pilot.name(p)}</b> overshot and went through the boundary hedge on ${ex.name.toLowerCase()}. ` +
        `Shaken, not hurt; the aircraft is a repair job.`);
    } else if (r < S.aircraftOnly + S.injured){
      if (ac.length) ac[0].lost = true;
      s.tally.aircraftLost++;
      lines.push(`<b>${Pilot.name(p)}</b> crashed on ${ex.name.toLowerCase()}.`);
      const others = Season.activePilots().filter(x => x.id !== p.id && !x.resting);
      if (others.length && Rand.chance(0.22)){
        const hero = Rand.pick(others);
        hero.nonOperationalGallantry = true;
        lines.push(`<b>${Pilot.name(hero)}</b> ran to the wreck and dragged him clear ` +
          `before the tanks went up.`);
      }
      Season.injure(p);
    } else {
      if (ac.length) ac[0].lost = true;
      p.status = 'killed';
      p.lostOn = s.day; p.lostDate = Season.dateLabel();
      s.tally.losses++; s.tally.aircraftLost++;
      s.recentLosses.push(s.day);
      s.pilots = s.pilots.filter(x => x.id !== p.id);
      Season.weighOnCommander();
      if (p.isCommander) Season.succeedCommand();
      for (const other of Season.activePilots())
        other.morale = clamp(other.morale + CAMPAIGN.morale.comradeLost * 0.6, 0, 100);
      lines.push(`<b>${Pilot.name(p)}</b> spun in on ${ex.name.toLowerCase()} and was killed. ` +
        `He had ${p.hours} hours and had flown ${p.sorties} operational sorties.`);
    }
  },

  rollWeather(){
    let r = Rand.raw();
    for (const w of CAMPAIGN.weather){ r -= w.odds; if (r <= 0) return w; }
    return CAMPAIGN.weather[0];
  },

  generateCalls(){
    const s = Season.s, ph = Season.phase(), g = Season.group();
    const intensity = g.intensity * s.weather.flying;
    if (intensity <= 0) return [];
    const n = Math.round(Rand.int(ph.calls[0], ph.calls[1]) * intensity);
    if (n <= 0) return [];
    const busy = ph.contact > 0.55 && g.front;
    const times = CAMPAIGN.callTimes.slice().sort(() => Rand.raw() - 0.5).slice(0, n).sort();
    const calls = [];

    for (let i = 0; i < n; i++){
      const pool = [];
      for (const t of CAMPAIGN.callTypes)
        for (let w = 0; w < (busy ? t.weight.busy : t.weight.quiet); w++) pool.push(t);
      let type = Rand.pick(pool);
      // A convoy patrol has to be over water. Inland sectors get other work.
      const station = Season.station();
      if (type.id === 'convoy' && !(station.sea && station.sea.length))
        type = CAMPAIGN.callTypes.find(t => t.id === 'standing');
      const strength = Rand.int(ph.enemy[0], ph.enemy[1]);
      const call = {
        time: times[i] || CAMPAIGN.callTimes[i % CAMPAIGN.callTimes.length],
        type,
        place: type.id === 'convoy' && station.sea && station.sea.length
          ? Rand.pick(station.sea) : Rand.pick(station.patrols),
        convoy: type.id === 'convoy' ? Rand.pick(GEOGRAPHY.convoys) : null,
        convoyKind: type.id === 'convoy' ? Season.pickConvoyKind() : null,
        ships: Rand.int(6, 22),
        ship: Rand.pick(GEOGRAPHY.ships),
        shipName: Rand.pick(CAMPAIGN.shipNames),
        target: Season.pickTarget(ph),
        // What the plotting table says, which is not what is actually there.
        reported: Math.max(1, Math.round(strength * Rand.gauss(1.15, 0.35))),
        strength,
        willContact: false,   // filled in below, once the convoy kind is known
        height: Rand.int(8,22) * 1000
      };
      const kind = call.convoyKind && CAMPAIGN.convoyKinds.find(k => k.id === call.convoyKind);
      call.willContact = Rand.chance(clamp(ph.contact * call.type.contact * s.weather.contact *
        (kind ? kind.bias : 1) * (0.4 + 0.6*g.intensity) * CAMPAIGN.contactBoost, 0, 0.97));
      calls.push(call);
    }
    return calls;
  },

  // What this raid is going for. STATION means your own aerodrome.
  pickTarget(ph){
    const list = CAMPAIGN.raid.targets[ph.name];
    if (!list) return null;
    const t = Rand.pick(list);
    return t === 'STATION' ? Season.station().name : t;
  },

  pickConvoyKind(){
    const pool = [];
    for (const k of CAMPAIGN.convoyKinds) for (let i=0;i<k.weight;i++) pool.push(k);
    return Rand.pick(pool).id;
  },

  nextCall(){
    const s = Season.s;
    if (s.battle) return;          // the fight is still going on
    s.pending = s.callIndex < s.calls.length ? s.calls[s.callIndex] : null;
  },

  callText(c){
    if (c.convoy){
      const kind = CAMPAIGN.convoyKinds.find(k => k.id === c.convoyKind) || CAMPAIGN.convoyKinds[0];
      return kind.line(c) + ' Standing patrol ordered, strength at your discretion.';
    }
    if (c.type.id === 'scramble')
      return `<b>Scramble.</b> Raid of ${c.reported}+ plotted crossing the coast at ${c.place}, angels ${Math.round(c.height/1000)}.`;
    if (c.type.id === 'readiness')
      return `<b>Scramble.</b> ${c.reported}+ approaching ${c.place}. Angels ${Math.round(c.height/1000)}.`;
    if (c.type.id === 'sweep')
      return `Interception patrol ordered over ${c.place}. ${c.reported}+ reported inbound.`;
    return `Standing patrol ordered over ${c.place} at ${c.height.toLocaleString()} feet.`;
  },

  /* --- flying a sortie -------------------------------------------------- */
  // Who flies with whom. A pilot posted to a section stays in it; anyone not
  // posted anywhere fills the gaps, seniors first, so the old behaviour is what
  // you get if you never touch it. You can make one section of aces and one of
  // sprogs, and live with what that means.
  formSections(pilots, size){
    size = size || BALANCE.sim.sectionSize;
    const names = CAMPAIGN.sectionNames;
    const buckets = {}; for (const n of names) buckets[n] = [];
    const spare = [];
    for (const p of pilots){
      if (p.section && buckets[p.section] && buckets[p.section].length < size) buckets[p.section].push(p);
      else spare.push(p);
    }
    spare.sort((a,b) => b.rank - a.rank || b.truth.leadership - a.truth.leadership);
    for (const n of names)
      while (buckets[n].length < size && spare.length) buckets[n].push(spare.shift());
    const out = [];
    for (const n of names) if (buckets[n].length) out.push({ name:n, pilots:buckets[n] });
    // anyone still over is a fourth-section overflow
    while (spare.length){
      const n = names[out.length % names.length];
      out.push({ name:n, pilots: spare.splice(0, size) });
    }
    return out;
  },

  // Accepts either an explicit list of pilots (the player's choice of who goes)
  // or a plain number, which takes the freshest available. The headless runner
  // uses the number form.
  fly(chosen){
    const s = Season.s, c = s.pending, ph = Season.phase();
    const pilots = (Array.isArray(chosen) ? chosen.slice() : Season.readyPilots().slice(0, chosen))
      .filter(p => p.status === 'active')
      .sort((a,b) => b.rank - a.rank || b.truth.leadership - a.truth.leadership);
    const kit = Season.serviceable().slice(0, pilots.length);
    const size = BALANCE.sim.sectionSize;

    const report = {
      ledByYou: !!s.leadNext,
      time: c.time, date: Season.dateLabel(), station: Season.station().name, type: c.type.name,
      place: c.place, convoy: c.convoy, reported: c.reported,
      up: pilots.length, sections: [], claims: 0, shared: 0, damagedClaims: 0, damaged: 0,
      contact: c.willContact, lines: []
    };

    // Sections of three, as flown, and made up as the CO chose them.
    const sections = Season.formSections(pilots, size);

    s.pendingWriteOffs = 0;

    if (!c.willContact){
      // Some of these are a sighting the squadron could not turn into a combat.
      const S = CAMPAIGN.sighting;
      const sighted = Rand.chance(S.odds);
      if (sighted){
        const n = Rand.int(S.seen[0], S.seen[1]);
        const met = {};
        for (let i=0;i<n;i++){
          const k = Rand.chance(ph.escortOdds * 0.5) ? Rand.pick(ph.fighters) : Rand.pick(ph.bombers);
          met[BALANCE.types[k].short] = (met[BALANCE.types[k].short]||0) + 1;
        }
        report.sighted = true;
        report.reason = Rand.pick(S.reasons);
        report.met = met;
        report.strength = n; report.engaged = 0; report.unengaged = n;
        report.lines.push('Enemy aircraft were sighted but no combat took place. ' + report.reason);
      } else {
        report.strength = 0; report.engaged = 0; report.unengaged = 0; report.met = {};
        report.lines.push('Patrol carried out as ordered. No enemy aircraft were seen.');
      }
      for (const p of pilots) Season.afterSortie(p, null, 0, true);
      report.sections = sections.map(sec =>
        ({ name: sec.name, pilots: sec.pilots.map(Pilot.name), lines: [], quiet: true,
           sighted: !!report.sighted }));
      s.tally.sorties += pilots.length;
    } else {
      const ctx = Season.beginEngagement(report, c, ph, sections, s);
      if (s.leadNext && ctx.st){
        // You are flying it. Nothing is applied to the campaign until the
        // fight is over, so abandoning it mid-way costs nothing.
        s.battle = { ctx, report, kit, pilots, call:c, looks:[], log:[], queue:[] };
        return null;
      }
      if (ctx.st) Battle.autoResolve(ctx.st);
      Season.finishEngagement(ctx);
    }

    return Season.completeSortie(report, kit, pilots, c);
  },

  // Closing a sortie out: wear on the aircraft, the ground crews, the tallies
  // and the diary. Shared by the auto path and the one the player flew.
  completeSortie(report, kit, pilots, c){
    const s = Season.s;
    c = c || s.pending || {};
    Season.wearAircraft(kit, report);
    s.groundCrewFatigue = clamp(s.groundCrewFatigue +
      pilots.length * CAMPAIGN.groundCrew.fatiguePerSortieFlown, 0, 100);
    s.standing = clamp(s.standing + report.claims * CAMPAIGN.command.standingPerClaim, 0, 100);
    s.tally.claims += report.claims;
    s.tally.shared += report.shared;
    s.tally.damaged += report.damagedClaims;

    Season.resolveRaid(report, c);
    (s.presenceLog = s.presenceLog || []).push(!!report.ledByYou);
    s.report = report;
    s.dayLines.push(Season.diaryLineFor(report));
    if (report.rt && report.rt.length)
      s.dayLines.push('From the R/T: ' +
        report.rt.slice(0, 2).map(x => `<i>&ldquo;${x}&rdquo;</i>`).join(' &mdash; '));
    s.callIndex++;
    s.pending = null;
    s.selected = new Set();
    if (typeof Save !== 'undefined') Save.now();
    return report;
  },

  // A squadron with nobody fit to fly, or nothing to fly, is non-operational.
  // It was a real state and it was reported as such; the deadlock was that the
  // game had no way to say it.
  canFly(){
    return Season.readyPilots().length >= 1 && Season.serviceable().length >= 1;
  },

  // Telling Operations the squadron cannot put anything up. Always available,
  // because the alternative is a call nobody can answer and a day that cannot end.
  reportUnable(){
    const s = Season.s, c = s.pending;
    if (!c) return;
    const men = Season.readyPilots().length, kit = Season.serviceable().length;
    const why = !men && !kit ? 'no pilots fit to fly and no serviceable aircraft'
              : !men ? 'no pilots fit to fly'
              : 'no serviceable aircraft';
    s.standing = clamp(s.standing - CAMPAIGN.command.standingForUnable, 0, 100);
    s.unableDays = s.unableDays || [];
    if (s.unableDays[s.unableDays.length-1] !== s.day) s.unableDays.push(s.day);
    s.dayLines.push(`${c.time} \u2014 the squadron is returned non-operational: ${why}. ` +
      `Sector sends another squadron to ${c.place}.`);
    (s.notices = s.notices || []).push({ kind:'warn',
      text:`The squadron was returned non-operational \u2014 ${why}.` });
    // Any other calls today are somebody else's business.
    s.callIndex = s.calls.length;
    s.pending = null; s.report = null;
    Season.groupNoticesState();
  },

  // Group does not leave a squadron sitting in the front line unable to fly.
  groupNoticesState(){
    const s = Season.s, K = CAMPAIGN.command;
    s.unableDays = (s.unableDays || []).filter(d => d > s.day - 10);
    if (s.unableDays.length < K.unableDaysBeforeRelief) return;
    if (!Season.group().front) return;
    const lines = [];
    Season.postTo(Rand.chance(0.5) ? '12' : '13', lines,
      'The squadron has been unable to meet its commitments. Fighter Command withdraws it ' +
      'from the line to make itself good again.');
    s.unableDays = [];
    s.dayLines.push(...lines);
    (s.notices = s.notices || []).push({ kind:'warn', text: lines.join(' ') });
  },

  // You cannot refuse a scramble. You can get on the telephone to the sector
  // controller and tell him what state the squadron is in.
  plead(){
    const s = Season.s, c = s.pending, K = CAMPAIGN.command;
    if (!c) return 'none';        // nothing to plead about
    // You may ring back. He will like it less each time, but a call you cannot
    // answer must never be a dead end.
    c.pleaded = (c.pleaded || 0) + 1;
    const r = Rand.raw() + (c.pleaded - 1) * 0.12;
    if (r < K.pleadDiverted){
      s.dayLines.push(`${c.time} — the plot over ${c.place} turned out to be friendly. Stand down.`);
      s.callIndex++; s.pending = null; s.report = null;
      return 'diverted';
    }
    if (r < K.pleadDiverted + K.pleadRelease){
      s.standing = clamp(s.standing - 2, 0, 100);
      s.dayLines.push(`${c.time} — you put the squadron's state to the controller. ` +
        `Another squadron is sent to ${c.place}.`);
      s.callIndex++; s.pending = null; s.report = null;
      return 'released';
    }
    s.standing = clamp(s.standing + K.standingForDeclinedScramble/2, 0, 100);
    s.dayLines.push(`${c.time} — the controller has nothing else to send. The order stands.`);
    return 'refused';
  },

  decline(){ return Season.plead(); },

  // "two Bf 109s", not "Bf 109 and Bf 109".
  tally(list){
    const counts = {};
    for (const k of list) counts[k] = (counts[k]||0) + 1;
    const word = n => ['','one','two','three','four','five','six'][n] || String(n);
    return Object.entries(counts)
      .map(([k,n]) => `${word(n)} ${k}${n > 1 ? 's' : ''}`)
      .join(' and ');
  },

  pilotLine(p, u, statusBefore){
    // Claims are assembled first, because a man who was shot down may still
    // have claimed something on the way. Leaving those out of his account made
    // the summary disagree with the report beneath it.
    const claims = [];
    if (u.kills) claims.push(`claimed ${Season.tally(u.victims)} destroyed`);
    if (u.sharedList.length) claims.push(`shared in ${Season.tally(u.sharedList)} destroyed`);
    if (u.damagedList.length) claims.push(`claimed ${Season.tally(u.damagedList)} damaged`);

    if (!u.alive && u.out !== 'disengaged'){
      const now = p.status;
      const what = now === 'wounded'  ? 'was shot down and wounded'
                 : now === 'killed'   ? 'was killed'
                 : now === 'missing'  ? 'failed to return'
                 : now === 'invalided'? 'was shot down and will not fly again'
                 : 'was shot down but returned to the squadron';
      return { cls:'loss', text: claims.length
        ? `${Pilot.name(p)} ${claims.join(', ')}, and ${what}.`
        : `${Pilot.name(p)} ${what}.` };
    }

    const bits = claims.slice();
    if (u.outOfAmmo) bits.push('fired off all his ammunition');
    else if (u.fleeing) bits.push('broke off and came home');
    else if (u.damageTaken > u.stats.structure*0.4) bits.push('came back badly shot about');
    else if (u.damageTaken > 0) bits.push('took hits');
    if (!bits.length) return { cls:'', text:`${Pilot.name(p)} could not close with the enemy formation.` };

    const cls = u.kills || u.sharedList.length ? 'claim'
              : (u.fleeing || u.damageTaken > u.stats.structure*0.4) ? 'hurt' : '';
    return { cls, text: `${Pilot.name(p)} ${bits.join(', ')}.` };
  },

  afterSortie(p, u, friendsLost, quiet){
    const C = CAMPAIGN;
    p.sorties++; p.hours += 1; p.xp += C.experience.perSortie;
    p.fatigue = clamp(p.fatigue + (quiet ? C.fatigue.perQuietSortie : C.fatigue.perSortie) *
      (1 - C.fatigue.staminaRelief * (p.truth.stamina-10)/20), 0, 100);
    p.morale = clamp(p.morale + C.morale.perSortie, 0, 100);
    Season.observe(p, u, friendsLost, quiet);
    const D = CAMPAIGN.development;
    Season.develop(p, D.perSortie, quiet ? 0.5 : 1);
    if (friendsLost) Season.develop(p, D.whenComradeLost, friendsLost);
    if (!u) return;
    Season.develop(p, D.perShot, u.shots);
    Season.develop(p, D.perKill, u.kills + u.sharedList.length * 0.5);
    if (u.kills || u.sharedList.length) Season.develop(p, D.whenVictory);
    if (u.damageTaken > 0)
      Season.develop(p, D.whenHit, Math.min(2, u.damageTaken / (u.stats.structure * 0.35)));
    if (u.fleeing) Season.develop(p, D.whenBrokeOff);

    p.kills += u.kills; p.shared += u.sharedList.length; p.damaged += u.damagedList.length;
    p.damageDealt += u.damageDealt;
    p.xp += u.kills * C.experience.perKill + u.damageDealt * C.experience.perDamage;
    if (u.kills >= 2) p.notableActions++;
    if (u.kills) p.morale = clamp(p.morale + C.morale.ownVictory * u.kills, 0, 100);
    if (u.damageTaken > 0 && u.alive)
      p.morale = clamp(p.morale + C.morale.shotUp * (u.damageTaken/u.stats.structure), 0, 100);
    if (friendsLost)
      p.morale = clamp(p.morale + friendsLost * C.morale.comradeLost *
        (1 - C.morale.nerveRelief * (p.truth.nerve-10)/20), 0, 100);
    // Nicolson's action, generalised: a man who scored and then went down
    // burned, or who kept attacking after his aircraft was shot to pieces.
    const scored = u.kills + u.sharedList.length;
    if (!u.alive && u.out !== 'disengaged') Season.pilotDown(p);
    const CON = CAMPAIGN.conspicuous;
    if (scored >= 1 && p.injury && p.injury.id === 'burns' && Rand.chance(CON.burningAircraft)){
      p.conspicuous = true;
      Season.s.dayLines.push(`<b>${Pilot.name(p)}</b> stayed with his aircraft after it caught ` +
        `fire and shot down the machine that had set him alight.`);
    } else if (u.alive && u.kills >= 2 && u.damageTaken > u.stats.structure * 0.7
               && Rand.chance(CON.pressedOnBadlyHit)){
      p.conspicuous = true;
      Season.s.dayLines.push(`<b>${Pilot.name(p)}</b> pressed his attack home with his aircraft ` +
        `shot to pieces and brought it back.`);
    } else if (scored >= 2 && ['killed','missing'].includes(p.status)
               && Rand.chance(CON.lastAction)){
      // Most of these were won posthumously.
      p.conspicuous = true;
      Season.s.dayLines.push(`<b>${Pilot.name(p)}</b> was last seen attacking the formation alone.`);
    }
  },

  // Accumulates fractional change and applies a whole point when it crosses.
  // A change you can see is also a thing you have learned about the man, so it
  // sharpens the estimate at the same time.
  // How fast this particular man comes on, and who he has been flying beside.
  learnRate(p){
    const A = CAMPAIGN.aptitude;
    const a = p.aptitude === undefined ? A.mean : p.aptitude;
    const base = A.floor + (a / CAMPAIGN.attributeRange.max) * A.span;
    return base * (p._mentored ? 1 + CAMPAIGN.mentoring.learnBonus : 1);
  },

  // Work out, for one section, who is learning from whom.
  markMentoring(pilots){
    if (!pilots || pilots.length < 2) return;
    const score = q => (q.truth.airmanship + q.truth.awareness) * 0.5 + Pilot.workedUp(q) * 8;
    const ranked = pilots.slice().sort((a,b) => score(b) - score(a));
    const best = ranked[0];
    for (const q of pilots) q._mentored = false;
    for (const q of ranked.slice(1))
      if (score(best) - score(q) >= CAMPAIGN.mentoring.gap) q._mentored = true;
  },
  aptitudeWord(p){
    const A = CAMPAIGN.aptitude;
    const a = p.aptitude === undefined ? A.mean : p.aptitude;
    for (const [floor, word] of A.words) if (a >= floor) return word;
    return A.words[A.words.length-1][1];
  },

  develop(p, table, mult){
    if (!table) return;
    const D = CAMPAIGN.development, s = Season.s;
    mult = (mult === undefined ? 1 : mult) * Season.learnRate(p);
    p.aptitudeSeen = (p.aptitudeSeen || 0) + 0.4;
    p.growth = p.growth || {};
    p.baseline = p.baseline || { ...p.truth };
    for (const k in table){
      p.growth[k] = (p.growth[k] || 0) + table[k] * mult;
      while (Math.abs(p.growth[k]) >= 1){
        const step = p.growth[k] > 0 ? 1 : -1;
        const moved = (p.truth[k] + step) - p.baseline[k];
        // A man can only travel so far from what he arrived with.
        if (moved > D.ceiling || moved < -D.floor){ p.growth[k] = 0; break; }
        p.truth[k] = clamp(p.truth[k] + step, 1, CAMPAIGN.attributeRange.max);
        p.growth[k] -= step;
        p.seen[k] = (p.seen[k] || 0) + 2.5;    // you saw it happen
        // Recorded rather than announced: a single summary goes out at the end
        // of the day and the figure carries a mark on the pilot's card.
        p.delta = p.delta || {};
        p.delta[k] = (p.delta[k] || 0) + step;
        if (!p.delta[k]) delete p.delta[k];
        p.deltaOn = s.day;
      }
    }
  },

  observe(p, u, friendsLost, quiet){
    const o = CAMPAIGN.observation;
    const add = (t,m) => { if (!t) return;
      for (const k in t) p.seen[k] = (p.seen[k]||0) + t[k] * (m === undefined ? 1 : m); };
    add(o.perSortie, quiet ? 0.7 : 1);
    if (u){
      add(o.perShot, u.shots);
      add(o.perKill, u.kills);
      if (u.damageTaken > 0) add(o.whenHit, Math.min(2, u.damageTaken/(u.stats.structure*0.3)));
      if (u.fleeing || !u.alive) add(o.whenBrokeOff);
    }
    if (p.fatigue > 50) add(o.whenFlownTired);
    if (friendsLost) add(o.whenComradeLost, friendsLost);
  },

  // Called for every man the squadron does not get back.
  weighOnCommander(){
    const s = Season.s, K = CAMPAIGN.command;
    const boss = Season.commander();
    if (!boss) return;
    const days = s.day - (boss.commandSince || 1);
    const sensitivity = K.burdenFloor + (1 - K.burdenFloor) * Math.min(1, days / K.burdenRampDays);
    const before = boss.burden;
    boss.burden = clamp(boss.burden + K.burdenPerLoss * sensitivity, 0, 100);
    for (const [mark, line] of [[35,'You find you have stopped learning the new men\u2019s names.'],
                                [65,'You are writing the letters at four in the morning now.'],
                                [88,'The adjutant has started answering questions you have not asked.']])
      if (before < mark && boss.burden >= mark) s.dayLines.push(`<i>${line}</i>`);
  },

  commander: () => Season.s.pilots.find(p => p.isCommander && p.status === 'active')
                || Season.s.pilots.find(p => p.isCommander),

  succeedCommand(){
    const s = Season.s;
    const heir = Season.activePilots()
      .filter(p => !p.isCommander)
      .sort((a,b) => b.truth.leadership - a.truth.leadership || b.rank - a.rank)[0];
    if (!heir) return;
    for (const p of s.roll) p.isCommander = false;
    heir.isCommander = true; heir.rank = CAMPAIGN.ranks.length - 1;
    heir.burden = 0; heir.commandSince = s.day;
    s.dayLines.push(`<b>${Pilot.name(heir)}</b> takes command of the squadron.`);
  },

  pilotDown(p){
    const s = Season.s, B = CAMPAIGN.baleOut, r = Rand.raw();
    s.tally.aircraftLost++; s.pendingWriteOffs++;
    // Armour plate behind the seat turned a good many deaths into woundings.
    const armour = Season.hasUpgrade('armour') ? 0.07 : 0;
    const fate = r < B.returnsToUnit + armour ? 'returned'
               : r < B.returnsToUnit + armour + B.wounded ? 'wounded'
               : r < B.returnsToUnit + armour + B.wounded + B.killed ? 'killed' : 'missing';

    if (fate === 'returned'){
      p.morale = clamp(p.morale - 22, 0, 100);
      p.fatigue = clamp(p.fatigue + 18, 0, 100);
      if (Rand.chance(CAMPAIGN.minorInjuryOdds)){
        p.status = 'wounded';
        p.injury = { id:'minor', name:'Cuts and a wrenched shoulder', since:s.day };
        p.backOn = s.day + Rand.int(CAMPAIGN.minorInjuryDays[0], CAMPAIGN.minorInjuryDays[1]);
        const line = `<b>${Pilot.name(p)}</b> walked away from the crash with cuts and a ` +
          `wrenched shoulder. Off flying until about ${Season.dateFor(p.backOn)}.`;
        s.dayLines.push(line);
        (s.notices = s.notices || []).push({ kind:'warn', text: line });
      }
      return;
    }
    if (fate === 'wounded'){
      Season.injure(p);
    } else {
      p.status = fate === 'killed' ? 'killed' : 'missing';
      p.lostOn = s.day; p.lostDate = Season.dateLabel();
      s.tally.losses++;
      s.pilots = s.pilots.filter(x => x.id !== p.id);
      Season.weighOnCommander();
      if (p.isCommander) Season.succeedCommand();
    }
    s.recentLosses.push(s.day);
  },

  // A wound is not a number of days off. It is a particular thing that happened
  // to a particular man, some of it does not heal, and some of them never fly
  // again. Weights and durations follow the pattern of Fighter Command's 1940
  // casualty returns: burns are the commonest serious injury of the period,
  // because the gravity tank sat between the engine and the instrument panel.
  injure(p){
    const s = Season.s;
    // Covering the gravity tank is why the burns unit stopped filling up.
    const table = CAMPAIGN.injuries.map(i =>
      (i.id === 'burns' && Season.hasUpgrade('tanks')) ? { ...i, weight: i.weight * 0.35 } : i);
    const total = table.reduce((t,i) => t + i.weight, 0);
    let r = Rand.raw() * total, inj = table[0];
    for (const i of table){ r -= i.weight; if (r <= 0){ inj = i; break; } }

    p.injury = { id:inj.id, name:inj.name, since:s.day };
    p.morale = clamp(p.morale - 14, 0, 100);
