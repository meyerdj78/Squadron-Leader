    // What does not heal.
    const marks = [];
    for (const k in inj.lasting){
      p.truth[k] = clamp(p.truth[k] + inj.lasting[k], 1, CAMPAIGN.attributeRange.max);
      marks.push(CAMPAIGN.attributes.find(a => a.key === k).name.toLowerCase());
    }
    if (marks.length) p.permanentHarm = (p.permanentHarm || []).concat(inj.name);

    if (!Rand.chance(inj.returns)){
      p.status = 'invalided';
      p.lostOn = s.day; p.lostDate = Season.dateLabel();
      s.pilots = s.pilots.filter(x => x.id !== p.id);
      s.dayLines.push(`<b>${Pilot.name(p)}</b> has ${inj.name}. The medical board has ` +
        `invalided him from flying duties.` + (inj.note ? ' ' + inj.note : ''));
      Season.weighOnCommander();
      if (p.isCommander) Season.succeedCommand();
      return;
    }

    p.status = 'wounded';
    p.backOn = s.day + Rand.int(inj.days[0], inj.days[1]);
    (s.notices = s.notices || []).push({ kind:'warn',
      text:`<b>${Pilot.name(p)}</b> has ${inj.name}. Expected back about ${Season.dateFor(p.backOn)}.` });
    s.dayLines.push(`<b>${Pilot.name(p)}</b> has ${inj.name} and is in hospital.` +
      (inj.note ? ' ' + inj.note : '') +
      (marks.length ? ` It will cost him something in ${marks.join(' and ')}.` : ''));
  },

  // Put a man in the flight that needs him, respecting the cap.
  assignFlight(p){
    const count = f => Season.activePilots().filter(x => x.flight === f && x.id !== p.id).length;
    const a = count('A'), b = count('B');
    p.flight = a <= b ? 'A' : 'B';
    return p.flight;
  },

  // Evens the two flights up without touching anyone already at readiness on a
  // sortie. Called when the roster changes and offered as a button.
  rebalanceFlights(quiet){
    const s = Season.s;
    const men = Season.activePilots().slice().sort((x,y) => y.rank - x.rank || y.hours - x.hours);
    let i = 0, moved = 0;
    for (const p of men){
      const want = i++ % 2 ? 'B' : 'A';
      if (p.flight !== want){ p.flight = want; moved++; }
    }
    if (moved && !quiet) s.dayLines.push(`Flights re-formed: ${moved} pilot${moved===1?'':'s'} moved between A and B.`);
    return moved;
  },

  overCap(){
    const cap = CAMPAIGN.flight.cap;
    return ['A','B'].filter(f => Season.activePilots().filter(p => p.flight === f).length > cap);
  },

  returnFromHospital(p){
    const s = Season.s;
    // p.injury is a record, not a string. Printing it directly produced
    // "[object Object]" in the diary.
    const was = p.injury && p.injury.name ? p.injury.name.toLowerCase() : null;
    const grounded = p.grounded;
    p.status = 'active'; p.fatigue = 0; p.backOn = null; p.grounded = false;
    p.morale = clamp(p.morale + 8, 0, 100);
    p.injury = null;
    if (!s.pilots.includes(p)) s.pilots.push(p);
    Season.assignFlight(p);

    const line = grounded
      ? `<b>${Pilot.name(p)}</b> is passed fit and back on the state.`
      : was
      ? `<b>${Pilot.name(p)}</b> rejoined the squadron, passed fit after ${was}.`
      : `<b>${Pilot.name(p)}</b> rejoined the squadron from hospital.`;
    s.dayLines.push(line +
      (p.permanentHarm && p.permanentHarm.length ? ' He is not quite the pilot he was.' : ''));
    (s.notices = s.notices || []).push({ kind:'good', text: line });

    // A man coming back to a full squadron means somebody is posted away. This
    // is what let the roster climb past establishment and stay there.
    while (Season.activePilots().length > CAMPAIGN.squadron.maxPilots){
      const spare = Season.activePilots()
        .filter(x => !x.isCommander && x.id !== p.id)
        .sort((a,b) => (a.kills + a.shared) - (b.kills + b.shared) || a.hours - b.hours)[0];
      if (!spare) break;
      spare.status = 'transferred';
      spare.lostOn = s.day; spare.lostDate = Season.dateLabel();
      s.pilots = s.pilots.filter(x => x.id !== spare.id);
      const t = `<b>${Pilot.name(spare)}</b> posted to another squadron — we are over establishment.`;
      s.dayLines.push(t);
      s.notices.push({ kind:'warn', text: t });
    }
    Season.rebalanceFlights(true);
  },

  wearAircraft(kit, report){
    const s = Season.s, G = CAMPAIGN.groundCrew;
    const tired = 1 + G.tiredRepairPenalty * (s.groundCrewFatigue/100);
    let i = 0;
    for (; i < s.pendingWriteOffs && i < kit.length; i++) kit[i].lost = true;
    for (; i < kit.length; i++){
      const dmg = Rand.raw() < (report.contact ? 0.30 : 0.05) ? Rand.int(3,14) : 0;
      if (dmg) kit[i].repairUntil = s.day + Math.max(1, Math.round(dmg * G.repairDaysPerDamage * tired));
    }
    s.pendingWriteOffs = 0;
  },

  // Did they get through? Decided on what the squadron actually did to the
  // bombers, not on the kill tally.
  resolveRaid(report, c){
    const s = Season.s, R = CAMPAIGN.raid;
    if (!report.contact || !c.target) return;
    const total = Math.max(1, report.bomberStrength || 0);
    const killed = report.bombersDown || 0;
    const broken = report.turnedAway || (killed / total) >= R.brokenIfBomberLossOver;
    report.raidBroken = broken;
    report.target = c.target;

    if (broken){
      s.tally.raidsStopped = (s.tally.raidsStopped || 0) + 1;
      for (const p of Season.activePilots())
        p.morale = clamp(p.morale + R.moraleStopped, 0, 100);
      s.standing = clamp(s.standing + R.standingStopped, 0, 100);
      s.dayLines.push(report.turnedAway
        ? `The raid turned back before it reached ${c.target}. Nothing was bombed.`
        : `The bombers broke up short of ${c.target} and jettisoned into the sea.`);
      return;
    }

    s.tally.raidsThrough = (s.tally.raidsThrough || 0) + 1;
    for (const p of Season.activePilots())
      p.morale = clamp(p.morale + R.moraleThrough, 0, 100);
    s.standing = clamp(s.standing + R.standingThrough, 0, 100);

    if (c.target === Season.station().name) Season.stationBombed(report);
    else s.dayLines.push(`They got through. ${c.target} was bombed this afternoon.`);
  },

  // The peril of the airfield period: they came for you, and the aircraft you
  // did not get off the ground burned where they stood.
  stationBombed(report){
    const s = Season.s, R = CAMPAIGN.raid;
    const serviceable = Season.serviceable();
    const n = Math.min(serviceable.length,
      Rand.int(R.ownStationLoss[0], R.ownStationLoss[1]));
    for (let i = 0; i < n; i++){ serviceable[i].lost = true; s.tally.aircraftLost++; }
    for (const p of Season.activePilots())
      p.morale = clamp(p.morale + R.moraleOwnStationHit, 0, 100);
    s.groundCrewFatigue = clamp(s.groundCrewFatigue + 14, 0, 100);
    report.stationHit = n;
    s.dayLines.push(`<b>They bombed the station.</b> ${n} aircraft destroyed on the ground, ` +
      `the mess windows gone and craters across the flarepath. The ground crews will be ` +
      `filling them in until dark.`);
    (s.notices = s.notices || []).push({ kind:'warn',
      text:`${Season.station().name} was bombed. ${n} aircraft destroyed on the ground.` });
  },

  // Whether you go up with them, over the last few calls.
  presenceRatio(){
    const s = Season.s;
    const log = s.presenceLog || [];
    if (log.length < 4) return null;
    const w = log.slice(-CAMPAIGN.presence.window);
    return w.filter(Boolean).length / w.length;
  },

  // The men notice, and somebody eventually says so.
  judgeCommand(){
    const s = Season.s, P = CAMPAIGN.presence;
    const r = Season.presenceRatio();
    if (r === null) return;
    const boss = Season.commander();
    for (const p of Season.activePilots())
      p.morale = clamp(p.morale +
        (r < P.lowRatio ? P.moraleDriftLow : r > P.highRatio ? P.moraleDriftHigh : 0), 0, 100);
    if (s.day - (s.lastPresenceRemark || -99) < P.remarkCooldown) return;
    const flight = Season.activePilots()
      .filter(x => !x.isCommander).sort((a,b) => b.rank - a.rank || b.truth.leadership - a.truth.leadership)[0];
    if (r < P.lowRatio && flight){
      s.lastPresenceRemark = s.day;
      s.dayLines.push(Rand.pick([
        `<b>${Pilot.name(flight)}</b> catches you after dinner. He is careful about it, but the ` +
          `men have noticed how few of the shows you have been on.`,
        `The MO mentions, apropos of nothing, that a squadron takes its temperature from the ` +
          `man who leads it, and that yours has not seen you up for a while.`,
        `You hear the tail end of something in the dispersal hut, and it stops when you come in.`]));
    } else if (r > P.highRatio && flight && Rand.chance(0.5)){
      s.lastPresenceRemark = s.day;
      s.dayLines.push(Rand.pick([
        `<b>${Pilot.name(flight)}</b> says, without making anything of it, that the men like ` +
          `knowing you are up there with them.`,
        `The adjutant remarks that he has never known a CO fly so much, and that he wishes ` +
          `you would fly rather less.`]));
    }
  },

  diaryLineFor(r){
    const where = r.convoy ? `convoy ${r.convoy} off ${r.place}` : r.place;
    if (!r.contact)
      return `${r.time} — ${r.up} aircraft up on ${r.type.toLowerCase()} over ${where}. ` +
        (r.sighted ? 'Enemy sighted but not engaged. ' + r.reason : 'Nothing seen.');
    return `${r.time} — ${r.up} aircraft up over ${where}. ` +
      (r.claims || r.shared ? `<b>${r.claims}</b> destroyed, ${r.shared} shared. ` : 'No claims. ') +
      (r.damaged ? `${r.damaged} of ours damaged.` : '');
  },

  /* --- end of day and week --------------------------------------------- */
  endDay(){
    const s = Season.s;
    // Anything still outstanding at dusk that the squadron could not answer.
    if (s.pending && !Season.canFly()) Season.reportUnable();
    const flew = s.callIndex > 0 && s.calls.length > 0;
    if (!flew){
      for (const p of Season.activePilots()){
        Season.develop(p, CAMPAIGN.development.whenRested);
        p.fatigue = clamp(p.fatigue - CAMPAIGN.fatigue.restDayRecovery, 0, 100);
        p.morale  = clamp(p.morale + CAMPAIGN.morale.restDayRecovery, 0, 100);
      }
      s.groundCrewFatigue = clamp(s.groundCrewFatigue - CAMPAIGN.groundCrew.restRecovery, 0, 100);
      const boss = Season.commander();
      if (boss) boss.burden = clamp(boss.burden - CAMPAIGN.command.burdenRelief, 0, 100);
    }
    for (const p of s.roll){
      if (p.status === 'killed' || p.status === 'missing'){
        if (!p.reported){
          p.reported = true;
          s.dayLines.push(`<b>${Pilot.name(p)}</b> ${p.status === 'killed' ? 'killed in action' : 'missing'}. ` +
            `${p.sorties} sorties, ${p.kills} destroyed.`);
        }
        continue;
      }
      if (p.status !== 'active') continue;
      const know = Pilot.acquaintance(p);
      if (know > p.acquaintance){
        p.acquaintance = know;
        s.dayLines.push(know === 2
          ? `You have seen enough of <b>${Pilot.name(p)}</b> now to know what he is.`
          : `You are beginning to form a view of <b>${Pilot.name(p)}</b>.`);
      }
      Season.checkExhaustion(p);
      Season.checkPromotion(p); Season.checkAwards(p);
    }

      Season.tellAVignette();

  // One line for everyone who moved today, rather than one line each.
    const moved = Season.activePilots().filter(p => p.deltaOn === s.day);
    if (moved.length){
      const D = CAMPAIGN.development;
      const worse = moved.filter(p => Object.values(p.delta).some(v => v < 0)).length;
      // Say what changed, in the adjutant's words, rather than sending the
      // player off to hunt for it on the cards.
      const said = p => Object.entries(p.delta || {})
        .map(([k,v]) => D.notes[k] ? D.notes[k][v > 0 ? 0 : 1] : null)
        .filter(Boolean).join(', and ');
      const text = moved.length === 1
        ? `<b>${Pilot.name(moved[0])}</b> — ${said(moved[0])}.`
        : moved.map(p => `<b>${Pilot.name(p)}</b> — ${said(p)}`).join('. ') + '.';
      const names = moved.map(p => Pilot.name(p)).join(', ');
      s.dayLines.push(text);
      // beginDay clears the notice list, so anything raised at the end of a day
      // has to be carried across the boundary or it is never seen.
      (s.carryNotices = s.carryNotices || []).push({ kind: worse > moved.length/2 ? 'warn' : 'good', text });
    }

    if (Season.checkEnding()) return;
    Season.pushDiary([s.weather.note, ...s.dayLines]);
    s.day++;
    s.restDays = Season.group().front ? 0 : s.restDays + 1;
    s.date = new Date(s.date.getTime() + 86400000);
    s.recentLosses = s.recentLosses.filter(d => d > s.day - CAMPAIGN.command.lossWindowDays);
    if (s.date.getUTCDay() === 1){ s.week++; Season.weekly(); }
    if (Season.checkEnding()) return;
    Season.beginDay();
    if (typeof Save !== 'undefined') Save.now();
  },

  // One small observed thing an evening, drawn from men who actually match it.
  tellAVignette(){
    const s = Season.s;
    if (!Rand.chance(CAMPAIGN.vignetteOdds)) return;
    s.vignetteSeen = s.vignetteSeen || {};
    const pool = [];
    for (const v of VIGNETTES){
      if (s.day - (s.vignetteSeen[v.id] || -99) < CAMPAIGN.vignetteCooldown) continue;
      let who = [];
      try { who = v.when() || []; } catch(e){ who = []; }
      if (!who.length) continue;
      for (let i = 0; i < v.weight; i++) pool.push({ v, who });
    }
    if (!pool.length) return;
    const pick = Rand.pick(pool);
    const line = pick.v.say(Rand.pick(pick.who));
    if (!line) return;
    s.vignetteSeen[pick.v.id] = s.day;
    s.dayLines.push('<i>' + line + '</i>');
  },

  // Two ways this ends: the battle is won, or the squadron is finished.
  checkEnding(){
    const s = Season.s;
    if (s.over) return true;
    const [em, ed] = CAMPAIGN.battleEnds.split('-').map(Number);
    const endsOn = Date.UTC(CAMPAIGN.start.y, em - 1, ed);
    const pilots = Season.activePilots().length;
    const aircraft = s.aircraft.filter(a => !a.lost).length;

    if (pilots <= CAMPAIGN.collapse.pilots || aircraft <= CAMPAIGN.collapse.aircraft){
      s.over = 'collapsed';
      const to = GEOGRAPHY.station(CAMPAIGN.collapse.station);
      s.dayLines.push(`<b>${CAMPAIGN.squadron.name} is withdrawn from the line.</b> ` +
        `With ${pilots} pilots and ${aircraft} aircraft the squadron is no longer operational. ` +
        `It moves to ${to.name} to re-form, and you are posted away from it.`);
      Season.pushDiary([...s.dayLines]);
      return true;
    }
    if (s.date.getTime() >= endsOn){
      s.over = 'won';
      s.dayLines.push(`<b>The Battle of Britain is over.</b> The invasion did not come.`);
      Season.pushDiary([...s.dayLines]);
      return true;
    }
    return false;
  },

  // A single figure, so two players can argue about it. Weighted for what a
  // squadron was actually for: stopping raids counts for more than a kill tally,
  // and pilots lost counts against you hardest, because they were the scarce
  // thing in 1940 and everyone at the time knew it.
  scoreCard(){
    const s = Season.s, t = s.tally;
    const rows = [
      { what:'Enemy destroyed',      n:t.claims,             each:6,   pts:t.claims * 6 },
      { what:'Shared',               n:t.shared,             each:3,   pts:t.shared * 3 },
      { what:'Damaged',              n:t.damaged,            each:1,   pts:t.damaged },
      { what:'Raids broken up',      n:t.raidsStopped || 0,  each:12,  pts:(t.raidsStopped||0) * 12 },
      { what:'Raids that got through', n:t.raidsThrough || 0, each:-4, pts:-(t.raidsThrough||0) * 4 },
      { what:'Pilots killed or missing', n:t.losses,         each:-15, pts:-t.losses * 15 },
      { what:'Aircraft lost',        n:t.aircraftLost,       each:-2,  pts:-t.aircraftLost * 2 }
    ];
    let total = rows.reduce((a,r) => a + r.pts, 0);
    const survived = s.over === 'won';
    if (survived) { rows.push({ what:'Still in the line on 31 October', n:1, each:120, pts:120 }); total += 120; }
    const grade = total >= 520 ? 'Outstanding'
                : total >= 380 ? 'Distinguished'
                : total >= 250 ? 'Creditable'
                : total >= 140 ? 'Held its place'
                : total >= 40  ? 'Hard used'
                : 'Fought to a standstill';
    return { rows, total: Math.round(total), grade };
  },

  // Everything the player earned, gathered up.
  finalReport(){
    const s = Season.s;
    const roll = s.roll;
    const survivors = Season.activePilots();
    const dead = roll.filter(p => ['killed','missing'].includes(p.status));
    const invalided = roll.filter(p => p.status === 'invalided');
    const decorated = roll.filter(p => p.awards.length);
    const top = roll.slice().sort((a,b) =>
      (b.kills + b.shared*0.5) - (a.kills + a.shared*0.5) || b.sorties - a.sorties);
    const boss = Season.commander();

    // A verdict, weighted for what a squadron could actually achieve.
    const score = s.tally.claims + s.tally.shared*0.5 - s.tally.losses*1.5;
    const verdict = s.over === 'collapsed'
      ? 'The squadron was fought to a standstill.'
      : score >= 45 ? 'One of the outstanding squadrons of the battle.'
      : score >= 28 ? 'A fine record, and a hard-used squadron.'
      : score >= 14 ? 'The squadron held its place in the line.'
      : 'The squadron survived, which was not nothing.';

    const card = Season.scoreCard();
    return { roll, survivors, dead, invalided, decorated, top: top.slice(0,6), boss, verdict,
      score: card,
      claims: s.tally.claims, shared: s.tally.shared, damaged: s.tally.damaged,
      sorties: s.tally.sorties, losses: s.tally.losses, served: roll.length,
      won: s.over === 'won' };
  },

  // Below the working floor Group does not wait for Monday.
  emergencyPosting(){
    const s = Season.s, C = CAMPAIGN;
    while (Season.activePilots().length < C.squadron.workingFloor
           && Season.activePilots().length < C.squadron.maxPilots){
      const n = Pilot.create(false);
      Season.assignFlight(n);
      s.pilots.push(n); s.roll.push(n);
      s.dayLines.push(`<b>${Pilot.name(n)}</b> posted in urgently from OTU, ${n.hours} hours on type.`);
      (s.notices = s.notices || []).push({ kind:'good',
        text: `<b>${Pilot.name(n)}</b> posted in from OTU with ${n.hours} hours on type.` });
    }
  },

  weekly(){
    const s = Season.s, C = CAMPAIGN, lines = [];
    // Count the men in hospital who are due back soon: posting replacements for
    // them is what made the squadron grow past establishment and never shrink.
    // Men in hospital who are due back soon count against the establishment, so
    // the squadron stops growing every time somebody is wounded. But below the
    // working floor Group posts replacements regardless — a squadron is not
    // left at six pilots because four are expected back next month.
    const dueBack = s.roll.filter(p => p.status === 'wounded' && p.backOn <= s.day + 14).length;
    while (Season.activePilots().length < C.squadron.maxPilots
           && (Season.activePilots().length < C.squadron.workingFloor
               || Season.activePilots().length + dueBack < C.squadron.pilotEstablishment)){
      const n = Pilot.create(false);
      const inA = Season.activePilots().filter(x => x.flight === 'A').length;
      const inB = Season.activePilots().filter(x => x.flight === 'B').length;
      Season.assignFlight(n);
      // A well-regarded squadron gets the better of what is available.
      if (s.standing > 65) for (const a of C.attributes) n.truth[a.key] = clamp(n.truth[a.key]+1, 1, 20);
      s.pilots.push(n); s.roll.push(n);
      lines.push(`<b>${Pilot.name(n)}</b> posted in from OTU, ${n.hours} hours on type.`);
    }
    const need = s.aircraft.filter(a => a.lost).length;
    const got = Math.min(need, Rand.int(C.aircraftReplacementPerWeek[0], C.aircraftReplacementPerWeek[1]));
    let done = 0;
    for (const a of s.aircraft)
      if (a.lost && done < got){ a.lost = false; a.repairUntil = null;
        a.serial = Season.newSerial(); done++; }
    if (got) lines.push(`${got} replacement ${BALANCE.types[C.squadron.aircraft].short}` +
      `${got===1?'':'s'} delivered from the Aircraft Storage Unit.`);
    Season.commandReview(lines);
    s.dayLines.push(...lines);
  },

  /* --- Fighter Command decides where you go ---------------------------- */
  strain(){
    const s = Season.s, active = Season.activePilots();
    if (!active.length) return 100;
    const fat = active.reduce((t,p) => t + p.fatigue, 0) / active.length;
    const mor = active.reduce((t,p) => t + p.morale, 0) / active.length;
    return clamp(fat*0.45 + (100-mor)*0.30 + s.recentLosses.length*7 + s.groundCrewFatigue*0.14, 0, 100);
  },

  commandReview(lines){
    const s = Season.s, K = CAMPAIGN.command, strain = Season.strain();
    if (Season.group().front && strain >= K.strainForRelief)
      Season.postTo(Rand.chance(0.5) ? '12' : '13', lines,
        'Fighter Command has ordered the squadron out of the line to rest and re-form.');
    else if (!Season.group().front && s.restDays >= K.minRestDays && strain <= K.strainToReturn)
      Season.postTo('11', lines, 'The squadron is ordered south again. Command needs it in the line.');
  },

  postTo(groupId, lines, why){
    const s = Season.s;
    const to = Rand.pick(GEOGRAPHY.stations.filter(st => st.group === groupId && st.id !== s.stationId));
    s.stationId = to.id; s.restDays = 0;
    lines.push(`${why} The squadron moves to <b>${to.name}</b>, ${to.county} — ${GEOGRAPHY.groups[groupId].name}.`);
  },

  requestRelief(){
    const s = Season.s, K = CAMPAIGN.command, lines = [];
    if (!Season.group().front){ s.dayLines.push('The squadron is already out of the line.'); return; }
    if (Season.strain() >= K.strainToAskRelief)
      Season.postTo(Rand.chance(0.5) ? '12' : '13', lines, 'Your application for relief is granted.');
    else {
      s.standing = clamp(s.standing + K.standingForRefusedRequest, 0, 100);
      lines.push('Your application for relief is refused. Command considers the squadron fit to continue.');
    }
    s.dayLines.push(...lines);
  },

  requestReturn(){
    const s = Season.s, K = CAMPAIGN.command, lines = [];
    if (Season.group().front){ s.dayLines.push('The squadron is already in the line.'); return; }
    if (Season.strain() <= K.strainToReturn + 12)
      Season.postTo('11', lines, 'Your request to return to the line is granted.');
    else {
      lines.push('Command declines to move the squadron south. It is not yet fit for the line.');
      s.standing = clamp(s.standing + K.standingForRefusedRequest/2, 0, 100);
    }
    s.dayLines.push(...lines);
  },

  // The consequence of flying your best men into the ground: you lose them
  // anyway, and for longer than a rest would have cost.
  checkExhaustion(p){
    const s = Season.s, E = CAMPAIGN.exhaustion;
    if (p.fatigue < E.threshold || !Rand.chance(E.chance)) return;
    if (Rand.chance(E.postedAway)){
      p.status = 'transferred';
      s.pilots = s.pilots.filter(x => x.id !== p.id);
      s.dayLines.push(`The MO has taken <b>${Pilot.name(p)}</b> off flying altogether. ` +
        `He is posted to a training unit. ${p.sorties} sorties, ${p.kills} destroyed.`);
      return;
    }
    p.status = 'wounded';                       // grounded, not hurt
    p.grounded = true;
    p.backOn = s.day + Rand.int(E.daysOut[0], E.daysOut[1]);
    p.morale = clamp(p.morale - 10, 0, 100);
    s.dayLines.push(`The MO has grounded <b>${Pilot.name(p)}</b> for operational exhaustion. ` +
      `He is off flying until about ${Season.dateFor(p.backOn)}.`);
  },

  checkPromotion(p){
    for (let r = CAMPAIGN.ranks.length-1; r > p.rank; r--){
      const rank = CAMPAIGN.ranks[r];
      if (p.xp < rank.xp) continue;
      if (rank.leadership && p.truth.leadership < rank.leadership) continue;
      if (rank.posts && Season.activePilots().filter(x => x.rank >= r).length >= rank.posts) continue;
      p.rank = r;
      Season.s.dayLines.push(`<b>${Pilot.name(p)}</b> promoted ${rank.name}.`);
      return;
    }
  },

  // Eligibility does not award anything. It puts a recommendation on your desk.
  checkAwards(p){
    const s = Season.s;
    if (s.recommendation) return;
    const stamp = String(s.date.getUTCMonth()+1).padStart(2,'0') + '-' +
                  String(s.date.getUTCDate()).padStart(2,'0');
    p.awardTimes = p.awardTimes || {};

    for (const a of CAMPAIGN.awards){
      const held = p.awards.filter(x => x === a.name).length;
      const cap = a.repeatable || 1;
      if (held >= cap) continue;
      if (p.recommended[a.name] && !a.repeatable) continue;
      if (a.repeatable && p.awardTimes[a.name] && s.day - p.awardTimes[a.name] < (a.cooldown || 30)) continue;
      if (a.requires && !p.awards.includes(a.requires)) continue;
      if (a.sergeantOnly && p.rank !== 0) continue;
      if (a.officerOnly && p.rank === 0) continue;
      if (a.nationality && p.nationality !== a.nationality) continue;
      if (a.from && stamp < a.from) continue;

      let earned = false;
      if (a.special === 'conspicuous')        earned = !!p.conspicuous;
      else if (a.special === 'ground')        earned = !!p.groundGallantry;
      else if (a.special === 'nonOperational') earned = !!p.nonOperationalGallantry;
      else earned = (p.kills + p.shared * 0.5 + p.notableActions) >= a.kills;

      if (earned){
        s.recommendation = { pilotId: p.id, award: a.name, note: a.note || '' };
        p.awardTimes[a.name] = s.day;
        return;
      }
    }
  },

  decideRecommendation(yes){
    const s = Season.s, r = s.recommendation;
    const p = s.roll.find(x => x.id === r.pilotId);
    p.recommended[r.award] = true;
    if (yes){
      const wait = Rand.int(CAMPAIGN.citationDays[0], CAMPAIGN.citationDays[1]);
      s.citations.push({ pilotId: p.id, award: r.award, dueOn: s.day + wait });
      s.dayLines.push(`Recommendation for ${Season.awardNoun(r.award)} forwarded to Group for ` +
        `<b>${Pilot.name(p)}</b>.`);
    } else {
      p.morale = clamp(p.morale - 6, 0, 100);
      s.dayLines.push(`You let the recommendation for <b>${Pilot.name(p)}</b> lie.`);
    }
    s.recommendation = null;
  },

  // Citations come through when they come through, and the Gazette does not
  // check first whether the man is still alive.
  releaseCitations(){
    const s = Season.s;
    for (const c of s.citations.filter(c => !c.done && c.dueOn <= s.day)){
      c.done = true;
      const p = s.roll.find(x => x.id === c.pilotId);
      if (!p) continue;
      p.awards.push(c.award);
      if (c.award === 'Victoria Cross') s.tally.vc = (s.tally.vc || 0) + 1;
      const gone = p.status === 'killed' || p.status === 'missing';
      s.dayLines.push(gone
        ? `<b>${Pilot.name(p)}</b> ${Season.awardPhrase(c.award, true)}. The notice reached the ` +
          `squadron this morning; he was lost on ${p.lostDate}.`
        : `<b>${Pilot.name(p)}</b> ${Season.awardPhrase(c.award)}.`);
    }
  },

  // A decoration is awarded. A mention is not a thing you receive.
  awardPhrase(award, perfect){
    if (award === 'Mentioned in Despatches')
      return perfect ? 'has been mentioned in despatches' : 'was mentioned in despatches';
    return perfect ? ('has been awarded the ' + award) : ('awarded the ' + award);
  },
  awardNoun(award){
    return award === 'Mentioned in Despatches' ? 'a mention in despatches' : 'the ' + award;
  },

  pushDiary(lines){
    const clean = lines.filter(Boolean);
    if (clean.length)
      Season.s.diary.unshift({ date: Season.dateLabel(), station: Season.station().name, lines: clean });
  }
};

/* ============================================================================
   PART 4b — THE BATTLE LAYER

   Replaces the hex model at the point of contact. The squadron fights ONE
   engagement rather than each section fighting its own, because the thing the
   player controls is ATTENTION, and attention has to be spent across sections
   to mean anything.

   Control degrades as the fight goes on: high in the climb and the approach,
   one big call at the merge, then it comes apart. Orders after that are advice.

   The hex model it replaced has been removed.
   ========================================================================== */

const BATTLE = {
  // Beats. Sections are named for the R/T, so the log reads as radio traffic.
  beats: { approach:2, merge:1, melee:5, disengage:1 },

  looksPerBeat: 3,
  lookAwayCost: 3,          // any look not spent on your own six leaves you blinder

  look: {
    checkSixAwareness: 30,
    watchAwareness: 24,
    watchCompliance: 0.30,
    scanAwarenessAll: 4,
    scanSelf: 8,
    scanHunterSuppression: 0.55
  },

  awareness: { start:88, floor:5, regen:0.07,
               decay:{ approach:3, merge:14, melee:16, disengage:9 },
               fixationPerDepth:11, bounceThreshold:48 },

  // A bounce is an EVENT, not a standing condition. Getting jumped and living
  // means you now know they are there.
  bounce: { byHeight:{ plus2:0.85, plus1:0.60, level:0.25, below:0.05 },
            damageMult:2.0, firingMult:2.0, cooldown:3, shock:22, maxPerSection:2 },

  cohesion: { start:95, floor:16, mergeLoss:[34,48], meleeDecay:[4,9], recoverOnWatch:6 },

  // The approach is where most of the player's real influence lives.
  stance: {
    climb_high: { band:5, energyCost:26, surprise:0.22, pullMod:1.10,
                  label:'Climb above them', rt:'Going up. Keep it tight.' },
    meet_level: { band:4, energyCost:10, surprise:0.05, pullMod:0.90,
                  label:'Meet them level', rt:'Straight in. Line astern.' },
    dive_early: { band:3, energyCost:-8, surprise:-0.14, pullMod:0.32,
                  label:'Straight through to the bombers', rt:'Never mind the escort. Get the bombers.' }
  },

  energyStart: 70,

  // Getting into a firing position was the hard part. Once there, eight
  // Brownings at close range did the job -- so opportunity is the limiter,
  // not lethality, and EXPERIENCE decides who gets the opportunity at all.
  gunnery: {
    burstSeconds: { snap:1.5, normal:3.0, hold:5.0 },
    baseFiringPosition: 0.09,
    expFloor: 0.0, expScale: 2.0,
    lethality: 0.32,
    hitThreshold: 0.34,
    variance: [0.55, 1.45],
    bomberDefensiveMult: 0.5,
    lwFiringMult: 1.60          // 109 pilots: better trained, better positioned, and choosing the fight.
    // Tuned so a campaign costs what the original model cost: about nine pilots
    // killed or missing and forty aircraft written off across the Battle.
  },

  // Dowding's 400yd spread vs the unofficial 250yd re-set that 74 Squadron's
  // armourers did under Malan. The spread forgives poor marksmanship; the close
  // set is lethal but demands it. A squadron decision with a real trade in it.
  harmonisation: {
    dowding_400: { hitMult:1.30, lethalMult:0.70, gunFloor:0.86, gunScale:0.30,
                   label:'400 yards, as laid down' },
    close_250:   { hitMult:0.52, lethalMult:1.34, gunFloor:0.10, gunScale:1.52,
                   label:'250 yards, unofficially' }
  },

  // What the fitters' work is worth in the air.
  upgrade: {
    mirrorAwareness: 12,     // rear-view mirrors: you see them coming
    climbBonus: 0.55,        // constant-speed propeller: height, which is everything
    boostFiring: 1.12,       // 100 octane: better position, low down
    armourClimb: -0.15,      // armour plate: heavy
    compliance: 0.12         // VHF: they can hear you
  },

  allyCompliance: 0.5,   // another squadron leader has his own fight on
  compliance: { base:0.42, perExperience:0.0045, cohesionWeight:0.34, cohesionFloor:30 },

  co: { bounceBase:0.055, irreducibleRisk:0.004 },

  escortPullRatio: 0.80,
  freeHunterBounce: 0.30,
  // Per melee beat, and there are five of them, so this compounds. 0.021 a beat
  // works out at about one fight in ten.
  lateArrivalOdds: 0.021,
  sectionSize: 3
};

// Battle stats per aircraft. turnDivisor here is LOWER = turns tighter, which is
// the opposite polarity to BALANCE.types.turnDivisor (aileron weight in the hex
// model) -- kept separate rather than reused so neither model corrupts the other.
// ammoSeconds: Spitfire I, 8 x .303 at 300rpg ~ 15s. The 109's cannon far longer.
BATTLE.ac = {
  spitfire: { turnDivisor:1.00, ammoSeconds:14.7, durability:1.00 },
  hurricane:{ turnDivisor:1.15, ammoSeconds:16.0, durability:1.20 },
  bf109:    { turnDivisor:1.25, ammoSeconds:55.0, durability:1.28 },
  bf110:    { turnDivisor:1.90, ammoSeconds:60.0, durability:1.75 },
  ju87:     { turnDivisor:2.40, ammoSeconds:99.0, durability:1.60 },
  ju88:     { turnDivisor:2.60, ammoSeconds:99.0, durability:2.60 },
  he111:    { turnDivisor:3.00, ammoSeconds:99.0, durability:2.90 },
  do17:     { turnDivisor:2.80, ammoSeconds:99.0, durability:2.50 }
};

/* --- the join between the layers ---------------------------------------- */
// Attributes are 1-20 here; the battle model works in 0-100.
// Whether the squadron has had a given modification done.
Season.hasUpgrade = function(id){
  return !!(Season.s && Season.s.upgrades && Season.s.upgrades[id]);
};

Pilot.toBattleSpec = function(p, typeKey){
  const e = k => clamp(Pilot.effective(p, k) * 5, 5, 100);
  const t = BALANCE.types[typeKey], b = BATTLE.ac[typeKey];
  return {
    ref: p.id, label: Pilot.name(p), kind: t.short, typeKey,
    gunnery: e('gunnery'), awareness: e('awareness'), aggression: e('aggression'),
    nerve: e('nerve'), experience: clamp(Pilot.workedUp(p)*70 + (p.truth.airmanship/20)*30, 5, 100),
    // A mirror is worth more than the four miles an hour it costs.
    awarenessBonus: Season.hasUpgrade('mirror') ? BATTLE.upgrade.mirrorAwareness : 0,
    structure: t.structure, ac: b, ally:false, unitName:null,
    ammo: b.ammoSeconds, damage:0, alive:true, hitBy:{},
    shots:0, kills:0, victims:[], sharedList:[], damagedList:[],
    damageDealt:0, damageTaken:0, fleeing:false, outOfAmmo:false, out:null
  };
};

Pilot.battleAlly = function(typeKey, quality, unitName){
  const t = BALANCE.types[typeKey], b = BATTLE.ac[typeKey];
  const q = () => clamp(Rand.gauss(quality, 2.5) * 5, 5, 100);
  return { ref:null, label:unitName, kind:t.short, typeKey,
    gunnery:q(), awareness:q(), aggression:q(), nerve:q(), experience:q(),
    structure:t.structure, ac:b, ally:true, unitName,
    ammo:b.ammoSeconds, damage:0, alive:true, hitBy:{},
    shots:0, kills:0, victims:[], sharedList:[], damagedList:[],
    damageDealt:0, damageTaken:0, fleeing:false, outOfAmmo:false, out:null };
};

Pilot.battleEnemy = function(typeKey, quality, isBomber){
  const t = BALANCE.types[typeKey], b = BATTLE.ac[typeKey];
  const q = () => clamp(Rand.gauss(quality, 2.5) * 5, 5, 100);
  return { ref:null, label:t.name, kind:t.short, typeKey, isBomber:!!isBomber,
    gunnery:q(), awareness:q(), aggression:q(), nerve:q(), experience:q(),
    structure:t.structure, ac:b, ally:false, unitName:null,
    ammo:b.ammoSeconds, damage:0, alive:true, hitBy:{},
    shots:0, kills:0, victims:[], sharedList:[], damagedList:[],
    damageDealt:0, damageTaken:0, fleeing:false, outOfAmmo:false, out:null };
};

/* --- the machine --------------------------------------------------------- */
// One machine, two drivers: the player's looks, or a flight commander's
// attributes. Auto-resolve and flying it yourself are the same code path.
const Battle = {
  LOOK: { SIX:'six', WATCH:'watch', PRESS:'press', SCAN:'scan' },

  alive: sec => sec.men.filter(m => m.alive && !m.gone).length,
  avg(sec, k){
    const live = sec.men.filter(m => m.alive);
    return live.length ? live.reduce((t,m) => t + m[k], 0) / live.length : 50;
  },

  // A man is only as safe as the pair of eyes behind him. Fly an old hand with
  // two sprogs and it is the old hand the 109s get at, because nobody called
  // the break in time.
  markCover(men){
    if (!men.length) return;
    const live = men.filter(m => m.alive);
    for (const m of men){
      const others = live.filter(x => x !== m);
      const cover = others.length
        ? others.reduce((t,x) => t + x.experience, 0) / others.length : m.experience;
      const gap = Math.max(0, m.experience - cover);
      m.exposure = 1 + (gap / 100) * CAMPAIGN.mentoring.exposure;
    }
  },

  makeSection(id, men, opts){
    Battle.markCover(men);
    return { id, men, heightBand:(opts && opts.band) || 3,
      energy: BATTLE.energyStart, cohesion: BATTLE.cohesion.start,
      awareness: BATTLE.awareness.start, ac: men[0] ? men[0].ac : BATTLE.ac.spitfire,
      engagedWith:null, orderLanded:true, bounceCount:0, bounceCooldown:0,
      isEscort: !!(opts && opts.escort), isBomber: !!(opts && opts.bomber),
      topCover: !!(opts && opts.topCover) };
  },

  create(friendlySections, enemyPool, opts){
    opts = opts || {};
    const fr = friendlySections.map(s => Battle.makeSection(s.name, s.men));
    if (opts.allySquadron && opts.allySquadron.men.length){
      const a = Battle.makeSection(
        opts.allySquadron.unit.name.replace('No. ','').replace(' Squadron',' Sqn'),
        opts.allySquadron.men);
      a.isAlly = true; a.unit = opts.allySquadron.unit;
      a.prefer = /bomber/.test(opts.allySquadron.unit.task || '') ? 'bombers' : 'escort';
      fr.push(a);
    }
    // Enemy sections of three. Escort sits high; one element is top cover,
    // above anything the RAF can climb to.
    const esc = [], bmb = [];
    const fighters = enemyPool.filter(e => !e.isBomber);
    const bombers  = enemyPool.filter(e =>  e.isBomber);
    for (let i = 0; i < fighters.length; i += 3){
      const men = fighters.slice(i, i+3);
      const top = esc.length === 0;
      const s = Battle.makeSection('E'+esc.length, men,
        { escort:true, topCover:top, band: top ? 6 : 4 + (Rand.chance(0.5) ? 1 : 0) });
      s.energy = 78; s.awareness = 80;
      esc.push(s);
    }
    for (let i = 0; i < bombers.length; i += 3){
      const s = Battle.makeSection('B'+bmb.length, bombers.slice(i, i+3), { bomber:true, band:3 });
      s.awareness = 62; s.cohesion = 92;
      bmb.push(s);
    }

    const leaderMan = opts.leader || null;
    const state = {
      fr, esc, bmb, freeHunters: [], tally: { ours:{}, theirs:{}, allied:{} }, identified: false,
      lateArrival: false,
      stanceKey: opts.stance || 'climb_high',
      harm: opts.harmonisation || CAMPAIGN.squadron.harmonisation || 'dowding_400',
      leader: leaderMan,
      co: leaderMan ? { man:leaderMan, awareness:BATTLE.awareness.start,
                        checkedSix:false, pressQueue:[], target:null,
                        hit:null } : null,
      phases: [], beat:0, scanned:false, stanceApplied:false,
      rt: []
    };
    for (let i=0;i<BATTLE.beats.approach;i++)  state.phases.push('approach');
    for (let i=0;i<BATTLE.beats.merge;i++)     state.phases.push('merge');
    for (let i=0;i<BATTLE.beats.melee;i++)     state.phases.push('melee');
    for (let i=0;i<BATTLE.beats.disengage;i++) state.phases.push('disengage');
    return state;
  },

  done: st => st.beat >= st.phases.length,
  phase: st => st.phases[st.beat],

  // What the player may spend attention on this beat.
  options(st){
    const opts = [{ type:Battle.LOOK.SIX, label:'Check your six' },
                  { type:Battle.LOOK.SCAN, label:'Scan the sky' }];
    for (const s of st.fr)
      if (Battle.alive(s)) opts.push({ type:Battle.LOOK.WATCH, sectionId:s.id,
        label:'Watch ' + s.id + ' Section' });
    if (Battle.phase(st) !== 'approach'){
      opts.push({ type:Battle.LOOK.PRESS, depth:1, label:'Snap shot and away' });
      opts.push({ type:Battle.LOOK.PRESS, depth:2, label:'Press the attack' });
      opts.push({ type:Battle.LOOK.PRESS, depth:3, label:'Hold the trigger down' });
    }
    return opts;
  },

  // A flight commander flying it for you. His attributes decide how he spends
  // his eyes: aggression buys attacks, awareness buys his own tail, leadership
  // buys the squadron's.
  autoLooks(st){
    const co = st.co;
    if (!co) return [{ type:Battle.LOOK.SCAN }];
    const m = co.man;
    const agg = m.aggression/100, awa = m.awareness/100;
    const ldr = clamp(((m.leadership !== undefined ? m.leadership : 50))/100, 0, 1);
    const looks = [];
    const melee = Battle.phase(st) !== 'approach';
    // Weakest section first: the one not being looked after.
    const weak = st.fr.filter(s => Battle.alive(s)).sort((a,b) => a.awareness - b.awareness);
    const wantWatch = Math.round(ldr * 2.2);
    const wantSix   = Math.round(awa * 1.6);
    for (let i=0;i<wantWatch && i<weak.length && looks.length<BATTLE.looksPerBeat;i++)
      looks.push({ type:Battle.LOOK.WATCH, sectionId: weak[i].id });
    for (let i=0;i<wantSix && looks.length<BATTLE.looksPerBeat;i++)
      looks.push({ type:Battle.LOOK.SIX });
    while (looks.length < BATTLE.looksPerBeat){
      if (melee && Rand.chance(0.35 + agg*0.45))
        looks.push({ type:Battle.LOOK.PRESS, depth: agg > 0.72 ? 3 : 2 });
      else looks.push({ type:Battle.LOOK.SCAN });
    }
    return looks.slice(0, BATTLE.looksPerBeat);
  },

  firingPosition(att, def, bounced){
    const turnRatio = def.ac.turnDivisor / att.ac.turnDivisor;
    const energyEdge = 1 + (att.energy - def.energy) / 260;
    const heightEdge = 1 + (att.heightBand - def.heightBand) * 0.09;
    const cohesionEdge = 0.72 + (att.cohesion / 100) * 0.42;
    let c = BATTLE.gunnery.baseFiringPosition * Math.pow(turnRatio, 0.55) *
            energyEdge * heightEdge * cohesionEdge;
    if (bounced) c *= BATTLE.bounce.firingMult;
    return clamp(c, 0.01, 0.92);
  },

  bounceCheck(att, def){
    if (def.bounceCooldown > 0) return false;
    if (def.bounceCount >= BATTLE.bounce.maxPerSection) return false;
    if (def.awareness >= BATTLE.awareness.bounceThreshold) return false;
    const d = att.heightBand - def.heightBand;
    const p = d >= 2 ? BATTLE.bounce.byHeight.plus2
            : d === 1 ? BATTLE.bounce.byHeight.plus1
            : d === 0 ? BATTLE.bounce.byHeight.level : BATTLE.bounce.byHeight.below;
    return Rand.chance(p);
  },

  applyBounce(def){
    def.bounceCount++; def.bounceCooldown = BATTLE.bounce.cooldown;
    def.awareness = Math.min(100, def.awareness + BATTLE.bounce.shock);
    // Being jumped means throwing the aeroplane about.
    for (const m of def.men) if (m.alive) m.manv = true;
  },

  fire(att, def, depth, harm, bounced, defensive, sideMult, st){
    const G = BATTLE.gunnery;
    const burst = depth === 1 ? G.burstSeconds.snap
                : depth === 2 ? G.burstSeconds.normal : G.burstSeconds.hold;
    const H = BATTLE.harmonisation[harm] || BATTLE.harmonisation.dowding_400;
    let destroyed = 0;

    for (const m of att.men){
      if (!m.alive || m.gone || m.leaving || m.ammo <= 0.2) continue;
      const targets = def.men.filter(t => t.alive && !t.gone);
      if (!targets.length) break;

      let fpc = Battle.firingPosition(att, def, bounced) *
                (G.expFloor + (m.experience/100) * G.expScale);
      if (!m.ally && m.pilot && Season.hasUpgrade('octane')) fpc *= BATTLE.upgrade.boostFiring;
      if (defensive) fpc *= G.bomberDefensiveMult;
      if (sideMult) fpc *= sideMult;
      if (!Rand.chance(fpc)) continue;

      const spend = Math.min(burst, m.ammo);
      m.ammo -= spend; m.shots++;
      m.firing = true;
      if (m.ammo <= 0.2) m.outOfAmmo = true;

      // Harmonisation keys off gunnery; a longer burst tracks him better.
      const gunFactor = (H.gunFloor + (m.gunnery/100) * H.gunScale) * (0.78 + spend * 0.08);
      if (Rand.raw() * H.hitMult * gunFactor < G.hitThreshold) continue;

      // Not a flat pick: the man nobody is covering is the man they go for.
      const weights = targets.map(x => x.exposure || 1);
      const total = weights.reduce((a,b) => a + b, 0);
      let roll = Rand.raw() * total, tgt = targets[targets.length - 1];
      for (let i = 0; i < targets.length; i++){ roll -= weights[i]; if (roll <= 0){ tgt = targets[i]; break; } }
      const V = G.variance;
      const variance = V[0] + Rand.raw() * (V[1] - V[0]);
      let dmg = spend * G.lethality * H.lethalMult * variance / def.ac.durability;
      if (bounced) dmg *= BATTLE.bounce.damageMult;

      // Held on the same scale as the hex model's structure, so every existing
      // ratio test downstream (damageTaken > structure*0.4) still means what it did.
      const asStructure = dmg * tgt.structure;
      tgt.damage += dmg;
      tgt.hitNow = true;
      tgt.damageTaken += asStructure;
      tgt.hitBy[m.uid] = (tgt.hitBy[m.uid] || 0) + asStructure;
      m.damageDealt += asStructure;

      if (tgt.damage >= 1.0 && tgt.alive){
        tgt.alive = false; tgt.out = 'shot down'; destroyed++;
        if (st){
          st.killed = (st.killed || []).concat([tgt]);
          st.killedKinds = (st.killedKinds || []).concat([tgt.kind]);
          Battle.record(st, def, tgt, 'destroyed', att);
        }
      } else if (st && tgt.damage >= 0.35 && !tgt.markedDamaged){
        tgt.markedDamaged = true;
        Battle.record(st, def, tgt, 'damaged', att);
      }
    }
    return destroyed;
  },

  applyLooks(st, looks){
    const co = st.co;
    for (const s of st.fr) s.watched = false;
    if (co){ co.checkedSix = false; co.pressQueue = []; }
    st.scanned = false;

    for (const look of (looks || []).slice(0, BATTLE.looksPerBeat)){
      if (look.type === Battle.LOOK.SIX){
        if (co){ co.awareness = Math.min(100, co.awareness + BATTLE.look.checkSixAwareness);
                 co.checkedSix = true; }
      } else if (look.type === Battle.LOOK.WATCH){
        if (co) co.awareness -= BATTLE.lookAwayCost;
        const s = st.fr.find(f => f.id === look.sectionId);
        if (s && Battle.alive(s)){
          s.awareness = Math.min(100, s.awareness + BATTLE.look.watchAwareness);
          s.cohesion  = Math.min(100, s.cohesion + BATTLE.cohesion.recoverOnWatch);
          s.watched = true;
        }
      } else if (look.type === Battle.LOOK.PRESS){
        if (co){
          const d = look.depth || 2;
          co.pressQueue.push(d);
          co.awareness -= BATTLE.awareness.fixationPerDepth * d;
        }
      } else if (look.type === Battle.LOOK.SCAN){
        if (co) co.awareness -= BATTLE.lookAwayCost;
        st.scanned = true;
        for (const s of st.fr)
          s.awareness = Math.min(100, s.awareness + BATTLE.look.scanAwarenessAll);
        if (co) co.awareness = Math.min(100, co.awareness + BATTLE.look.scanSelf);
      }
    }
    if (co) co.awareness = clamp(co.awareness, 0, 100);
  },

  orderLands(sec){
    const C = BATTLE.compliance;
    let chance = C.base + Battle.avg(sec,'experience') * C.perExperience
               + (sec.cohesion/100) * C.cohesionWeight
               + (sec.watched ? BATTLE.look.watchCompliance : 0)
               + (Season.hasUpgrade('vhf') ? BATTLE.upgrade.compliance : 0);
    if (sec.cohesion < C.cohesionFloor) chance *= 0.55;
    return Rand.chance(clamp(chance, 0.05, 0.97));
  },

  // Committing more sections PULLS MORE ESCORT DOWN. Surplus escorts free-hunt
  // rather than diluting, so mass never thins the opposition.
  assign(st){
    const fr = st.fr.filter(s => Battle.alive(s) && !s.held && !s.climbing);
    const esc = st.esc.filter(s => Battle.alive(s));
    const bmb = st.bmb.filter(s => Battle.alive(s));
    for (const s of fr) s.engagedWith = null;
    for (const s of esc) s.engagedWith = null;
    for (const s of bmb) s.engagedWith = null;
    if (!fr.length) { st.freeHunters = esc; return; }

    const stance = BATTLE.stance[st.stanceKey];
    const raw = fr.length * BATTLE.escortPullRatio * stance.pullMod;
    const pulled = Math.min(esc.length, Math.floor(raw) + (Rand.chance(raw % 1) ? 1 : 0));
    for (let i=0;i<pulled;i++){
      const f = fr[i % fr.length];
      esc[i].engagedWith = f;
      if (!f.engagedWith) f.engagedWith = esc[i];
    }
    st.freeHunters = esc.slice(pulled);

    // A section told to get at the bombers does so, escort or no escort.
    for (const f of fr){
      if (f.prefer === 'bombers' && bmb.length){
        if (f.engagedWith && f.engagedWith.isEscort) f.engagedWith = null;
        f.engagedWith = bmb[0];
        if (!bmb[0].engagedWith) bmb[0].engagedWith = f;
      } else if (f.prefer === 'escort' && esc.length && (!f.engagedWith || f.engagedWith.isBomber)){
        f.engagedWith = esc[0];
      }
    }
    // Concentration, not dispersal: spare sections pile onto one formation.
    const free = fr.filter(f => !f.engagedWith);
    free.forEach((f,i) => {
      if (!bmb.length) return;
      const t = bmb[Math.floor(i/2) % bmb.length];
      f.engagedWith = t;
      if (!t.engagedWith) t.engagedWith = f;
    });
  },

  step(st, looks){
    if (Battle.done(st)) return [];
    const phase = Battle.phase(st);
    const events = [];
    const say = (t, cls, voice) => events.push({ text:t, cls: cls || '', voice: voice || 'rt' });

    // Clear last beat's states before anything happens in this one.
    for (const sec of st.fr.concat(st.esc, st.bmb))
      for (const m of sec.men){ m.firing = false; m.hitNow = false; m.manv = false; }

    // A section told to climb is out of it while it does so.
    for (const sec of st.fr){
      if (!sec.climbing) continue;
      sec.climbing--;
      // A constant-speed airscrew is the difference between reaching them and
      // watching them go over the top of you.
      const lift = 1 + (Season.hasUpgrade('prop') ? BATTLE.upgrade.climbBonus : 0)
                     + (Season.hasUpgrade('armour') ? BATTLE.upgrade.armourClimb : 0);
      sec.heightBand = Math.min(6, sec.heightBand + (Rand.raw() < lift - Math.floor(lift) ? 1 : 0)
                                                  + Math.floor(lift));
      sec.energy = Math.max(15, sec.energy - 8);
      for (const m of sec.men) if (m.alive) m.manv = true;
    }

    // You get close enough to see what they are at the merge.
    if (phase !== 'approach') st.identified = true;

    // Your orders if you gave any, his judgement if you did not.
    const mine = (st.pendingLooks || []).concat(looks || []);
    Battle.applyLooks(st, mine.length ? mine.slice(0, BATTLE.looksPerBeat) : Battle.autoLooks(st));
    st.pendingLooks = [];

    if (st.turnedAway){ st.beat = st.phases.length; return events; }
    if (st.breakOff && phase !== 'disengage'){
      // Everything after this beat is the run for home.
      st.phases = st.phases.slice(0, st.beat).concat(['disengage']);
      st.brokeOff = true;
    }

    // The approach stance lands at the merge.
    if (phase === 'merge' && !st.stanceApplied){
      if (Battle.rollTurnAway(st)){
        st.turnedAway = true; st.beat = st.phases.length;
        say('The whole formation is turning back for France.', '', 'narr');
        return events;
      }
      const sc = BATTLE.stance[st.stanceKey];
      for (const s of st.fr){
        s.heightBand = sc.band;
        s.energy = Math.max(15, s.energy - sc.energyCost);
        s.awareness = Math.min(100, s.awareness + sc.surprise * 60);
      }
      st.stanceApplied = true;
      say(sc.rt, 'rt', 'rt');
    }

    const decay = BATTLE.awareness.decay[phase];
    const all = st.fr.concat(st.esc, st.bmb);
    for (const s of all){
      if (!Battle.alive(s)) continue;
      if (s.bounceCooldown > 0) s.bounceCooldown--;
      const regen = Battle.avg(s,'awareness') * BATTLE.awareness.regen +
        (st.fr.includes(s) && !s.isAlly ? (s.men[0] && s.men[0].awarenessBonus || 0) * 0.25 : 0);
      const d = st.fr.includes(s) ? decay : decay * 0.9;
      s.awareness = clamp(s.awareness - d + regen, BATTLE.awareness.floor, 100);
      if (st.fr.includes(s)){
        if (phase === 'merge')
          s.cohesion -= BATTLE.cohesion.mergeLoss[0] +
            Rand.raw() * (BATTLE.cohesion.mergeLoss[1] - BATTLE.cohesion.mergeLoss[0]);
        else if (phase === 'melee')
          s.cohesion -= BATTLE.cohesion.meleeDecay[0] +
            Rand.raw() * (BATTLE.cohesion.meleeDecay[1] - BATTLE.cohesion.meleeDecay[0]);
        s.cohesion = Math.max(BATTLE.cohesion.floor, s.cohesion);
      }
    }
    if (st.co)
      st.co.awareness = clamp(st.co.awareness - decay * 0.9 +
        st.co.man.awareness * BATTLE.awareness.regen * 0.5, 0, 100);

    if (phase === 'approach'){ st.beat++; return events; }

    const late = Battle.rollLateArrival(st);
    if (late) say('More of them — 109s coming down out of the sun, above and behind us.', 'loss', 'narr');

    for (const s of st.fr) if (Battle.alive(s)) s.orderLanded = Battle.orderLands(s);
    Battle.assign(st);
    st.killed = [];

    // ours
    for (const s of st.fr){
      if (!Battle.alive(s) || !s.engagedWith || !Battle.alive(s.engagedWith)) continue;
      const def = s.engagedWith;
      const bounced = Battle.bounceCheck(s, def);
      if (bounced){ Battle.applyBounce(def);
        say((s.isAlly ? s.unit.name : s.id + ' Section') +
          ', tally ho — they haven\u2019t seen us.', s.isAlly ? 'rt' : 'claim'); }
      const depth = s.orderLanded ? 2 : (Rand.chance(0.5) ? 3 : 1);
      st.killedKinds = [];
      const n = Battle.fire(s, def, depth, st.harm, bounced, false, null, st);
      if (n) say((s.isAlly ? s.unit.name : s.id + ' Section') + ' — one ' +
        (st.killedKinds[0] || 'of them') + ' going down.',
        s.isAlly ? 'rt' : 'claim');
    }
    // theirs
    for (const e of st.esc){
      if (!Battle.alive(e) || !e.engagedWith || !Battle.alive(e.engagedWith)) continue;
      const def = e.engagedWith;
      const bounced = Battle.bounceCheck(e, def);
      if (bounced){ Battle.applyBounce(def);
        say((def.isAlly ? def.unit.name : def.id + ' Section') + ' — break! Break!', 'loss'); }
      const before = def.men.filter(m => m.alive).length;
      Battle.fire(e, def, 2, 'dowding_400', bounced, false, BATTLE.gunnery.lwFiringMult, st);
      const down = def.men.find(m => !m.alive && !m.reported && m.pilot);
      if (down){
        down.reported = true; st.hurt = down;
        say(down.label + ' is hit — he is going down.', 'loss');
      }
    }
    for (const b of st.bmb){
      if (!Battle.alive(b) || !b.engagedWith || !Battle.alive(b.engagedWith)) continue;
      Battle.fire(b, b.engagedWith, 2, 'dowding_400', false, true, null, st);
    }
    // the ones nobody saw
    const hunterChance = BATTLE.freeHunterBounce *
      (st.scanned ? (1 - BATTLE.look.scanHunterSuppression) : 1);
    for (const h of st.freeHunters){
      if (!Battle.alive(h)) continue;
      const cand = st.fr.filter(s => Battle.alive(s) && Battle.bounceCheck(h, s));
      if (!cand.length || !Rand.chance(hunterChance)) continue;
      const tgt = Rand.pick(cand);
      Battle.applyBounce(tgt);
      say('109s coming down out of the sun on ' +
        (tgt.isAlly ? tgt.unit.name : tgt.id + ' Section') + '.', 'loss');
      Battle.fire(h, tgt, 2, 'dowding_400', true, false, BATTLE.gunnery.lwFiringMult, st);
    }

    // the CO's own fight
    const co = st.co;
    if (co && co.man.alive && !co.man.gone){
      for (const depth of co.pressQueue){
        if (co.man.ammo <= 0.2) break;
        let tsec = co.target && Battle.alive(co.target.sec) && co.target.man.alive
          ? co.target.sec : null;
        if (!tsec){
          const pool = st.esc.concat(st.bmb).filter(s => Battle.alive(s));
          if (!pool.length) break;
          tsec = Rand.pick(pool);
          co.target = { sec:tsec, man: Rand.pick(tsec.men.filter(m => m.alive)) };
        }
        const G = BATTLE.gunnery;
        const H = BATTLE.harmonisation[st.harm] || BATTLE.harmonisation.dowding_400;
        const burst = depth === 1 ? G.burstSeconds.snap
                    : depth === 2 ? G.burstSeconds.normal : G.burstSeconds.hold;
        const spend = Math.min(burst, co.man.ammo);
        co.man.ammo -= spend; co.man.shots++;
        if (co.man.ammo <= 0.2) co.man.outOfAmmo = true;
        const mySec = st.fr.find(s => s.men.includes(co.man)) || st.fr[0];
        const fpc = Battle.firingPosition(mySec, tsec, false) *
                    (G.expFloor + (co.man.experience/100) * G.expScale);
        if (!Rand.chance(fpc)) continue;
        const gunFactor = (H.gunFloor + (co.man.gunnery/100) * H.gunScale) * (0.78 + spend * 0.08);
        if (Rand.raw() * H.hitMult * gunFactor < G.hitThreshold) continue;
        const variance = G.variance[0] + Rand.raw() * (G.variance[1] - G.variance[0]);
        const dmg = spend * G.lethality * H.lethalMult * variance / tsec.ac.durability;
        const t = co.target.man;
        t.damage += dmg;
        t.damageTaken += dmg * t.structure;
        t.hitBy[co.man.uid] = (t.hitBy[co.man.uid] || 0) + dmg * t.structure;
        co.man.damageDealt += dmg * t.structure;
        if (t.damage >= 1.0 && t.alive){
          t.alive = false; t.out = 'shot down';
          st.killed.push(t); co.target = null;
          Battle.record(st, tsec, t, 'destroyed', mySec);
          say('That is one for the commanding officer — a ' + t.kind + '.', 'claim');
        }
      }

      // And the one he did not see, because he was looking at his squadron.
      const threat = st.freeHunters.length * 0.5 +
                     st.esc.filter(e => Battle.alive(e)).length * 0.22;
      const exposure = Math.pow(1 - co.awareness/100, 1.6);
      if (Rand.chance(BATTLE.co.bounceBase * exposure * Math.min(1.5, threat))){
        const hit = co.man;
        hit.damageTaken += hit.structure * (0.45 + Rand.raw() * 0.8);
        const mySec = st.fr.find(x => x.men.includes(hit)) || st.fr[0];
        if (hit.damageTaken >= hit.structure){
          hit.alive = false; hit.out = 'shot down';
          Battle.record(st, mySec, hit, 'destroyed');
        } else if (!hit.markedDamaged){
          hit.markedDamaged = true; Battle.record(st, mySec, hit, 'damaged');
        }
        say('You never saw him. Something heavy goes through the wing.', 'loss', 'narr');
      }
    }

    // Empty guns or a badly shot-about aeroplane, and a man goes home. He is
    // still up there, he is just no longer any use to you.
    for (const sec of st.fr.concat(st.esc, st.bmb)){
      for (const m of sec.men){
        if (!m.alive || m.leaving) continue;
        const spent = m.ammo <= 0.2;
        const hurt = m.damageTaken > m.structure * 0.55;
        if (!spent && !hurt) continue;
        m.leaving = true;
        if (st.fr.includes(sec) && !sec.isAlly)
          say(spent
            ? (m.pilot ? Pilot.name(m.pilot) : m.label) + ' is out of ammunition and going home.'
            : (m.pilot ? Pilot.name(m.pilot) : m.label) + ' is shot about and breaking off.',
            'loss');
      }
    }

    // Keep the lines worth writing down.
    for (const e of events)
      if (e.cls === 'claim' || e.cls === 'loss') (st.rt = st.rt || []).push(e.text);

    st.beat++;
    return events;
  },

  // Nobody flies a whole battle untouched, however carefully.
  // When the shooting stops, nobody is still firing. Transient states are set
  // during a beat and cleared at the start of the next one, so the last beat's
  // flags need clearing explicitly or they stand until the player lands.
  settle(st){
    for (const sec of st.fr.concat(st.esc, st.bmb))
      for (const m of sec.men){ m.firing = false; m.manv = false; m.hitNow = false; }
  },

  finish(st){
    Battle.settle(st);
    for (const s of st.fr){
      for (const m of s.men){
        if (!m.alive) continue;
        if (m.ammo <= 0.2) m.outOfAmmo = true;
        if (m.damageTaken > m.structure * 0.55 || Rand.chance(BATTLE.co.irreducibleRisk))
          m.fleeing = true;
      }
    }
    // Claims assessed exactly as the hex model does, so the taxonomy is one
    // set of rules rather than two.
    const G = BALANCE.gunnery;
    const byUid = new Map();
    for (const s of st.fr) for (const m of s.men) byUid.set(m.uid, m);
    const enemies = st.esc.concat(st.bmb);
    for (const es of enemies){
      for (const e of es.men){
        const total = Object.values(e.hitBy).reduce((a,b)=>a+b, 0);
        if (!total) continue;
        if (!e.alive){
          const hands = Object.entries(e.hitBy)
            .filter(([,d]) => d/total >= G.shareThreshold)
            .sort((a,b) => b[1] - a[1]);
          if (hands.length && hands[0][1]/total >= G.outrightThreshold){
            const h = byUid.get(hands[0][0]);
            if (h){ h.kills++; h.victims.push(e.kind); }
          } else {
            for (const [uid] of hands){
              const h = byUid.get(uid);
              if (h) h.sharedList.push(e.kind);
            }
          }
        } else {
          for (const [uid, dmg] of Object.entries(e.hitBy)){
            if (dmg / e.structure < G.damagedThreshold) continue;
            const h = byUid.get(uid);
            if (h) h.damagedList.push(e.kind);
          }
        }
      }
    }
    return st;
  },

  // The old contract, unchanged: everything downstream keeps working.
  result(st){
    const units = [];
    for (const s of st.fr) for (const m of s.men){
      units.push({
        side:'blue', ref:m.ref, label:m.label, kind:m.kind, ally:m.ally, unitName:m.unitName,
        stats:{ structure:m.structure }, alive:m.alive,
        out: m.alive ? null : (m.out || 'shot down'),
        fleeing: m.fleeing, outOfAmmo: m.outOfAmmo,
        shots:m.shots, kills:m.kills, victims:m.victims,
        sharedList:m.sharedList, damagedList:m.damagedList,
        damageDealt:m.damageDealt, damageTaken:m.damageTaken
      });
    }
    for (const s of st.esc.concat(st.bmb)) for (const m of s.men){
      units.push({ side:'red', ref:null, kind:m.kind, alive:m.alive,
        out: m.alive ? null : 'shot down', stats:{ structure:m.structure },
        kills:0, victims:[], sharedList:[], damagedList:[],
        damageDealt:m.damageDealt, damageTaken:m.damageTaken, shots:m.shots });
    }
    return { units, rt: st.rt, stance: st.stanceKey };
  },

  // What the squadron knows before a shot is fired. Somebody sees them first,
  // and it matters who: it is his eyes the whole squadron is borrowing.
  openingReport(st, call){
    const band = st.fr.length ? st.fr[0].heightBand : 3;
    const alt = (8 + band * 3) * 1000;
    const all = st.fr.flatMap(s => s.men.filter(m => m.alive && m.pilot));
    const spotter = all.length
      ? all.slice().sort((a,b) => b.awareness - a.awareness)[0] : null;
    const where = call && call.place ? call.place : 'the coast';
    const dir = Rand.pick(['east','south-east','south','starboard beam','port quarter']);
    const enemyAlt = st.esc.concat(st.bmb).length
      ? Math.max(1, Math.round(Math.abs(alt - (8 + (st.bmb[0] ? st.bmb[0].heightBand : 3) * 3) * 1000) / 1000)) * 1000
      : 3000;
    const below = Rand.chance(0.68);
    const strength = st.esc.concat(st.bmb).reduce((t,x) => t + Battle.alive(x), 0);
    const out = [
      'The squadron has been cruising at ' + alt.toLocaleString() + ' feet over ' + where + '.',
      (spotter ? spotter.label : 'Somebody') + ' sees them first \u2014 contrails to the ' + dir +
        ', about ' + enemyAlt.toLocaleString() + ' feet ' + (below ? 'below' : 'above') + ' us.'
    ];
    out.push(strength >= 12 ? 'It is a big formation. More than we were told.'
           : strength >= 6  ? 'Perhaps ' + strength + ' of them, in vics.'
                            : 'Only a handful of them.');
    return out;
  },

  // Some interceptions were nothing at all. The raid turns for France and the
  // squadron comes home with nothing to write down.
  rollTurnAway(st){
    const ours = st.fr.reduce((t,s) => t + Battle.alive(s), 0);
    const theirs = st.esc.concat(st.bmb).reduce((t,s) => t + Battle.alive(s), 0);
    if (!theirs) return true;
    // Outnumbered raiders with no bombers to protect had every reason to go home.
    const odds = ours / Math.max(1, theirs);
    return Rand.chance(clamp(0.05 + (odds - 1) * 0.16, 0.03, 0.34));
  },

  // The one thing worth asking about this beat. Priority is what would actually
  // be shouting at a squadron leader, not a menu of everything possible.
  prompt(st){
    const phase = Battle.phase(st);
    const co = st.co;
    if (phase === 'approach') return null;
    const live = st.fr.filter(s => Battle.alive(s));
    if (!live.length) return null;

    const hunted = live.filter(s => s.awareness < BATTLE.awareness.bounceThreshold);
    const loose  = live.filter(s => s.cohesion <= BATTLE.cohesion.floor + 4);
    const mine   = co && co.target && Battle.alive(co.target.sec) && co.target.man.alive;
    const blindMe = co && co.awareness < 45;
    const L = Battle.LOOK;

    // Somebody is about to be jumped and does not know it.
    if (hunted.length && st.freeHunters.length){
      const h = hunted[0];
      return { text: h.id + ' Section have not seen the 109s coming down on them.',
        options: [
          { label:'Warn them \u2014 "' + h.id + ', break!"',
            looks:[{type:L.WATCH, sectionId:h.id},{type:L.WATCH, sectionId:h.id},{type:L.SCAN}] },
          { label:'Watch your own tail instead',
            looks:[{type:L.SIX},{type:L.SIX},{type:L.SCAN}] },
          { label:'Press your own attack',
            looks:[{type:L.PRESS,depth:3},{type:L.PRESS,depth:2},{type:L.SIX}] }
        ] };
    }
    // You have one, but you have stopped looking behind you.
    if (mine && blindMe){
      return { text:'You have him. You have also lost the picture behind you.',
        options: [
          { label:'Hold the trigger down',
            looks:[{type:L.PRESS,depth:3},{type:L.PRESS,depth:3},{type:L.PRESS,depth:2}] },
          { label:'One more burst, then break',
            looks:[{type:L.PRESS,depth:2},{type:L.SIX},{type:L.SIX}] },
          { label:'Break off now',
            looks:[{type:L.SIX},{type:L.SIX},{type:L.SCAN}] }
        ] };
    }
    // A section has come apart.
    if (loose.length){
      const l = loose[0];
      return { text: l.id + ' Section has come apart. They are all over the sky.',
        options: [
          { label:'Call them back to you',
            looks:[{type:L.WATCH, sectionId:l.id},{type:L.WATCH, sectionId:l.id},{type:L.SIX}] },
          { label:'Let them fight it out',
            looks:[{type:L.SCAN},{type:L.PRESS,depth:2},{type:L.SIX}] }
        ] };
    }
    // Nothing urgent: where are your eyes?
    const weak = live.slice().sort((a,b) => a.awareness - b.awareness)[0];
    return { text:'A moment. Where are you looking?',
      options: [
        { label:'Over the squadron', looks:[{type:L.WATCH, sectionId:weak.id},{type:L.SCAN},{type:L.SIX}] },
        { label:'Behind you', looks:[{type:L.SIX},{type:L.SIX},{type:L.SCAN}] },
        { label:'Down the sights', looks:[{type:L.PRESS,depth:2},{type:L.PRESS,depth:2},{type:L.SIX}] }
      ] };
  },

  // Which way the fight is going. Not a kill count -- a reading of who is in a
  // position to hurt whom: numbers, height, energy, whether the sections are
  // still together, whether anyone has ammunition left. 0 theirs, 1 ours.
  balance(st){
    const weigh = (secs, ours) => secs.reduce((t, sec) => {
      const up = Battle.alive(sec);
      if (!up) return t;
      let v = up * (sec.isBomber ? 0.5 : 1);
      v *= 0.75 + (sec.cohesion / 100) * 0.5;
      v *= 0.78 + (sec.awareness / 100) * 0.44;
      v *= 0.85 + (sec.energy / 100) * 0.3;
      v *= 1 + (sec.heightBand - 3) * 0.07;
      const out = sec.men.filter(m => m.alive && (m.leaving || m.ammo <= 0.2)).length;
      if (out) v *= 1 - 0.55 * (out / up);
      if (ours && sec.held) v *= 0.22;   // safe, and not helping
      return t + v;
    }, 0);
    const ours = weigh(st.fr, true);
    const theirs = weigh(st.esc.concat(st.bmb), false);
    return clamp(ours / Math.max(0.001, ours + theirs), 0, 1);
  },

  // The running score as reported over the wireless, not as assessed on the
  // ground. It is what the squadron thinks it has done. The Form 'F' decides.
  record(st, sec, man, what, att){
    st.tally = st.tally || { ours:{}, theirs:{}, allied:{} };
    st.tally.allied = st.tally.allied || {};
    // Ours, theirs, or the other squadron's. The board showed every aircraft
    // that went down and credited us with all of it; the Form 'F' only credits
    // our own pilots, so the two disagreed.
    const book = st.fr.includes(sec) ? st.tally.ours
               : (att && att.isAlly) ? st.tally.allied : st.tally.theirs;
    const k = man.kind;
    book[k] = book[k] || { destroyed:0, damaged:0 };
    if (what === 'destroyed'){
      book[k].destroyed++;
      if (man.markedDamaged && book[k].damaged > 0) book[k].damaged--;
    } else book[k].damaged++;
  },

  // Interventions. The fight goes on without you; these are the things you can
  // reach in and change, and none of them is compulsory. Each is available only
  // when it would actually mean something.
  interventions(st){
    const out = [];
    const phase = Battle.phase(st);
    if (!phase) return out;
    const live = st.fr.filter(s => Battle.alive(s));
    const inIt = live.filter(s => !s.held);
    const held = live.filter(s => s.held);
    const before = phase === 'approach';

    if (before && !st.committed){
      out.push({ id:'climb', label:'Climb before we go in',
        rt:'Keep climbing. We go in from above or not at all.' });
      out.push({ id:'straight', label:'Straight in at them now',
        rt:'Never mind the height. Going in now.' });
    }
    for (const sec of inIt)
      if (inIt.length > 1)
        out.push({ id:'hold', arg:sec.id, label:'Keep ' + sec.id + ' Section out of it',
          rt:sec.id + ' Section, stay up and keep watch. Do not come down.' });
    for (const sec of held)
      out.push({ id:'release', arg:sec.id, label:'Send ' + sec.id + ' Section in',
        rt:sec.id + ' Section, come on down. We need you.' });

    if (!before){
      const bombersLeft = st.bmb.some(b => Battle.alive(b));
      for (const sec of inIt){
        if (bombersLeft && sec.prefer !== 'bombers')
          out.push({ id:'bombers', arg:sec.id, label:sec.id + ' Section onto the bombers',
            rt:sec.id + ' Section, leave the fighters. Get at the bombers.' });
        if (st.esc.some(e => Battle.alive(e)) && sec.prefer !== 'escort')
          out.push({ id:'escort', arg:sec.id, label:sec.id + ' Section onto the escort',
            rt:sec.id + ' Section, hold the 109s off us.' });
      }
      const weak = live.slice().sort((a,b) => a.awareness - b.awareness)[0];
      if (weak) out.push({ id:'watch', arg:weak.id, label:'Watch ' + weak.id + ' Section',
        rt:weak.id + ' Section, check your tails.' });
      out.push({ id:'six', label:'Check your own tail' });
      if (st.esc.concat(st.bmb).some(x => Battle.alive(x)))
        out.push({ id:'press', label:'Press your attack home' });
      if (st.hurt && st.hurt.alive === false && !st.followed)
        out.push({ id:'follow', label:'Go down after ' + st.hurt.label,
          rt:'I am going down after him.' });
      out.push({ id:'breakoff', label:'Break off. Everybody home.',
        rt:'That is enough. Break off, break off. Steer three-one-zero.' });
    }
    return out;
  },

  // What this section may be told to do, right now.
  sectionOrders(st, sec){
    const out = [];
    // You have no authority over another squadron. You can ask.
    if (sec.isAlly){
      if (Battle.targets(st).length) out.push({ id:'attack', label:'Ask them to attack' });
      if (!sec.held) out.push({ id:'break_sec', label:'Ask them to break off' });
      return out;
    }
    if (sec.heightBand < 6) out.push({ id:'climb_sec', label:'Climb' });
    if (Battle.targets(st).length) out.push({ id:'attack', label:'Attack' });
    if (!sec.held) out.push({ id:'break_sec', label:'Break off' });
    return out;
  },

  // Height in thousands of feet. Bands are three thousand apart from angels 8.
  angels: band => 8 + band * 3,

  // What we make their height. You cannot read another aircraft's altimeter, so
  // it is an estimate, fixed per formation rather than jittering on every render.
  angelsGuess(sec){
    if (sec.altGuess === undefined) sec.altGuess = Rand.int(-1, 1);
    return Math.max(6, Battle.angels(sec.heightBand) + sec.altGuess * 2);
  },

  // Where a formation is, relative to us. Known for anything sighted before the
  // merge; a formation that turns up later may be anywhere, including the one
  // place you did not want it.
  bearing(st, secs){
    if (!secs.length) return '';
    if (secs.some(x => x.newcomer)) return 'above and behind';
    const ours = st.fr.length ? st.fr[0].heightBand : 3;
    const theirs = secs.reduce((t,x) => t + x.heightBand, 0) / secs.length;
    const d = theirs - ours;
    return d >= 1.6 ? 'ahead and well above' : d >= 0.6 ? 'ahead and above'
         : d <= -1.6 ? 'ahead and well below' : d <= -0.6 ? 'ahead and below' : 'dead ahead';
  },

  // Fresh fighters, arriving out of the sun while you are busy with the bombers.
  rollLateArrival(st){
    if (st.lateArrival || Battle.phase(st) !== 'melee') return null;
    if (!Rand.chance(BATTLE.lateArrivalOdds)) return null;
    st.lateArrival = true;
    const men = [];
    for (let i = 0; i < 3; i++){
      const e = Pilot.battleEnemy('bf109', 12.5, false);
      e.uid = 'late' + i; men.push(e);
    }
    const sec = Battle.makeSection('E' + (st.esc.length), men,
      { escort:true, topCover:true, band:6 });
    sec.newcomer = true; sec.energy = 88; sec.awareness = 88;
    st.esc.push(sec);
    // They have the height and we have not seen them.
    for (const f of st.fr)
      if (Battle.alive(f) && !f.held) f.awareness = Math.max(BATTLE.awareness.floor, f.awareness - 30);
    return sec;
  },

  // The enemy formations, as the squadron sees them.
  targets(st){
    const out = [];
    const bmb = st.bmb.filter(x => Battle.alive(x));
    const esc = st.esc.filter(x => Battle.alive(x));
    if (bmb.length) out.push({ id:'bombers', label:'the bombers',
      up: bmb.reduce((t,x) => t + Battle.alive(x), 0), secs: bmb });
    if (esc.length) out.push({ id:'escort', label:'the escort',
      up: esc.reduce((t,x) => t + Battle.alive(x), 0), secs: esc });
    return out;
  },

  applyIntervention(st, id, arg){
    const find = i => st.fr.find(x => x.id === i);
    // A request to another squadron may simply not be acted on.
    const asked = find(id === 'attack' ? (arg && arg.section) : arg);
    if (asked && asked.isAlly){
      asked.timesAsked = (asked.timesAsked || 0) + 1;
      const p = BATTLE.allyCompliance * (asked.timesAsked > 1 ? 0.65 : 1);
      if (!Rand.chance(clamp(p, 0.08, 0.92)))
        return { refused:true, rt: asked.unit.name + ': "Rather busy just now. You carry on."' };
    }
    const L = Battle.LOOK;
    st.pendingLooks = st.pendingLooks || [];
    if (id === 'climb'){ st.stanceKey = 'climb_high'; st.committed = true; st.delayed = (st.delayed||0) + 1; }
    else if (id === 'straight'){ st.stanceKey = 'dive_early'; st.committed = true; st.rushed = true; }
    else if (id === 'hold'){ const s2 = find(arg); if (s2){ s2.held = true; s2.engagedWith = null; } }
    else if (id === 'release'){ const s2 = find(arg); if (s2) s2.held = false; }
    else if (id === 'bombers'){ const s2 = find(arg); if (s2) s2.prefer = 'bombers'; }
    else if (id === 'escort'){ const s2 = find(arg); if (s2) s2.prefer = 'escort'; }
    else if (id === 'watch') st.pendingLooks.push({ type:L.WATCH, sectionId:arg }, { type:L.WATCH, sectionId:arg });
    else if (id === 'six') st.pendingLooks.push({ type:L.SIX }, { type:L.SIX });
    else if (id === 'press') st.pendingLooks.push({ type:L.PRESS, depth:3 }, { type:L.PRESS, depth:2 });
    else if (id === 'follow'){
      st.followed = true;
      st.pendingLooks.push({ type:L.PRESS, depth:2 });
      // Going down after a man means going down alone, low and slow.
      if (st.co) st.co.awareness = Math.max(0, st.co.awareness - 30);
    }
    else if (id === 'breakoff'){ st.breakOff = true; }
    // The simplified set: a section is told to climb, to attack something, or
    // to get out of it. The squadron as a whole gets two orders and no more.
    else if (id === 'climb_sec'){
      const s2 = find(arg); if (s2){ s2.climbing = 2; s2.held = false; }
    }
    else if (id === 'break_sec'){ const s2 = find(arg); if (s2){ s2.held = true; s2.climbing = 0; s2.engagedWith = null; } }
    else if (id === 'attack'){
      const s2 = find(arg && arg.section);
      if (s2){ s2.held = false; s2.climbing = 0; s2.prefer = arg.target; }
    }
    else if (id === 'sqn_attack'){
      for (const s2 of st.fr){ s2.held = false; s2.climbing = 0; }
      st.committed = true;
    }
    else if (id === 'sqn_break'){ st.breakOff = true; }
    return { refused:false };
  },

  // Drive the whole thing without a player. Same machine.
  autoResolve(st){
    while (!Battle.done(st)) Battle.step(st, null);
    return Battle.finish(st);
  }
};

/* --- the campaign's side of the seam ------------------------------------- */
// Replaces the contact branch of Season.fly when the battle layer is on.
// Everything it must populate is the same as before: report.sections,
// claims/shared/damagedClaims/damaged, met, strength/engaged/unengaged, and
// afterSortie for every man.
Season.beginEngagement = function(report, c, ph, sections, s){
  const escorted = Rand.chance(ph.escortOdds);
  const met = {};
  let remaining = c.strength;

  // Raid budget drawn exactly as before, so committing more still pulls more of
  // the raid down rather than thinning it. Summed into ONE engagement.
  const enemyPool = [];
  const frSections = [];
  let uid = 0;
  const allies = [];
  let allySquadron = null;

  for (const sec of sections){
    const men = sec.pilots.map(p => {
      const m = Pilot.toBattleSpec(p, CAMPAIGN.squadron.aircraft);
      m.uid = 'b' + (uid++); m.pilot = p; return m;
    });
    // Another squadron in the same fight flies as its own formation rather than
    // mixed into ours. They are not under your command; you can ask.
    let allyUnit = null;
    if (!allySquadron && Rand.chance(CAMPAIGN.alliedOdds)){
      const myRole = CAMPAIGN.roles[CAMPAIGN.squadron.aircraft] || CAMPAIGN.roles.spitfire;
      const pool = CAMPAIGN.alliedSquadrons.filter(a => a.type === myRole.partner);
      allyUnit = { ...Rand.pick(pool.length ? pool : CAMPAIGN.alliedSquadrons),
                   task: myRole.partnerTask };
      allySquadron = { unit: allyUnit, men: [] };
      for (let a = 0, an = Rand.int(3,5); a < an; a++){
        const m = Pilot.battleAlly(allyUnit.type, 11, allyUnit.name);
        m.uid = 'b' + (uid++); allySquadron.men.push(m);
      }
    }
    allies.push(allyUnit);

    const drawn = clamp(Math.round(men.length * Rand.gauss(CAMPAIGN.oddsAgainst, 0.3)),
                        2, Math.min(remaining, CAMPAIGN.maxPerEngagement));
    if (remaining <= 0 || drawn <= 0){ frSections.push({ name:sec.name, men, quiet:true, sec }); continue; }
    remaining -= drawn;

    const role = CAMPAIGN.roles[CAMPAIGN.squadron.aircraft] || CAMPAIGN.roles.spitfire;
    const fighters = escorted ? clamp(Math.round(drawn * role.fighterShare), 0, drawn) : drawn;
    for (let i=0;i<drawn;i++){
      const k = i < fighters ? Rand.pick(ph.fighters) : Rand.pick(ph.bombers);
      const e = Pilot.battleEnemy(k, Rand.gauss(i < fighters ? 11.5 : 8.5, i < fighters ? 3 : 2), i >= fighters);
      e.uid = 'r' + (uid++);
      enemyPool.push(e);
      met[BALANCE.types[k].short] = (met[BALANCE.types[k].short]||0) + 1;
    }
    frSections.push({ name:sec.name, men, quiet:false, sec });
  }

  const engaged = frSections.filter(f => !f.quiet);
  const ctx = { report, c, ph, s, frSections, allies, enemyPool, remaining, met, st:null };
  if (engaged.length && enemyPool.length){
    // Who is leading. The commander if he is up; otherwise the senior man, and
    // the fight is resolved by HIS judgement rather than yours.
    let leader = null;
    for (const f of engaged)
      for (const m of f.men)
        if (m.pilot && m.pilot.isCommander) leader = m;
    if (!leader){
      const cand = engaged.flatMap(f => f.men.filter(m => m.pilot));
      leader = cand.sort((a,b) => b.pilot.truth.leadership - a.pilot.truth.leadership)[0] || null;
