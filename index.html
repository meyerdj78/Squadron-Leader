    }
    if (leader) leader.leadership = leader.pilot.truth.leadership * 5;

    const st = Battle.create(engaged, enemyPool, {
      leader,
      stance: s.battleStance || 'climb_high',
      harmonisation: s.harmonisation || 'dowding_400',
      allySquadron
    });
    ctx.st = st;
    return ctx;
  }
  return ctx;
};

// Applies the finished battle to the campaign. Same code whether the player
// flew it or a flight commander did.
Season.finishEngagement = function(ctx){
  const { report, c, s, frSections, allies } = ctx;
  let remaining = ctx.remaining;
  const st = ctx.st;
  if (st){
    const res = Battle.result(st);
    report.rt = res.rt;

    const byRef = new Map(res.units.filter(u => u.side==='blue' && u.ref).map(u => [u.ref, u]));
    const friendsLost = res.units.filter(u => u.side==='blue' && !u.alive && u.out!=='disengaged').length;

    frSections.forEach((f, idx) => {
      const secRep = { name:f.name, pilots:f.sec.pilots.map(Pilot.name), lines:[],
                       quiet:f.quiet, enemyDown:0 };
      if (f.quiet){
        for (const p of f.sec.pilots) Season.afterSortie(p, null, 0, true);
      } else {
        Season.markMentoring(f.sec.pilots);
        for (const p of f.sec.pilots){
          const u = byRef.get(p.id);
          Season.afterSortie(p, u, friendsLost, false);
          if (!u) continue;
          report.claims += u.kills;
          report.shared += u.sharedList.length;
          report.damagedClaims += u.damagedList.length;
          if (u.damageTaken > 0 && u.alive) report.damaged++;
          // A man shot down is not the same as a man who failed to return, and
          // the aeroplane is gone either way. Counted separately because the
          // report was calling every one of them missing.
          if (!u.alive && u.out !== 'disengaged'){
            report.aircraftLost = (report.aircraftLost || 0) + 1;
            const st2 = p.status;
            if (st2 === 'killed' || st2 === 'missing') report.killed = (report.killed || 0) + 1;
            else if (st2 === 'wounded' || st2 === 'invalided') report.wounded = (report.wounded || 0) + 1;
            else report.walkedBack = (report.walkedBack || 0) + 1;
          }
          secRep.enemyDown += u.kills;
          const line = Season.pilotLine(p, u);
          if (line) secRep.lines.push(line);
        }
        const au = allies[idx];
        if (au){
          const mates = res.units.filter(u => u.side==='blue' && u.ally && u.unitName === au.name);
          secRep.ally = { name:au.name, type:BALANCE.types[au.type].short, task:au.task,
            up:mates.length, claims:mates.reduce((t,m)=>t+m.kills,0),
            lost:mates.filter(m => !m.alive && m.out !== 'disengaged').length };
        }
      }
      report.sections.push(secRep);
      s.tally.sorties += f.sec.pilots.length;
    });
  } else {
    for (const f of frSections){
      for (const p of f.sec.pilots) Season.afterSortie(p, null, 0, true);
      report.sections.push({ name:f.name, pilots:f.sec.pilots.map(Pilot.name),
                             lines:[], quiet:true, enemyDown:0 });
      s.tally.sorties += f.sec.pilots.length;
    }
  }

  report.unengaged = Math.max(0, remaining);
  if (report.unengaged)
    s.standing = clamp(s.standing -
      Math.min(report.unengaged, 4) * CAMPAIGN.command.standingPerLeaker, 0, 100);
  report.met = ctx.met;
  report.strength = c.strength;
  report.engaged = c.strength - report.unengaged;
  if (st){
    const bmb = st.bmb.flatMap(x => x.men);
    report.bomberStrength = bmb.length;
    report.bombersDown = bmb.filter(m => !m.alive).length;
    report.turnedAway = !!st.turnedAway;
    report.rt = (st.rt || []).slice(0, 4);
  }
};

// The auto path: set up, drive it, apply it.
Season.engageBattle = function(report, c, ph, sections, s){
  const ctx = Season.beginEngagement(report, c, ph, sections, s);
  if (ctx.st) Battle.autoResolve(ctx.st);
  Season.finishEngagement(ctx);
};

// Is the commanding officer among the men detailed for this one?
Season.commanderIsUp = function(chosen){
  return (chosen || []).some(p => p.isCommander && p.status === 'active');
};

// The player flew it. Apply the result and close the sortie out.
Season.concludeBattle = function(){
  const s = Season.s, b = s.battle;
  if (!b) return null;
  if (b.ctx.st) Battle.finish(b.ctx.st);
  Season.finishEngagement(b.ctx);
  s.battle = null; s.leadNext = false;
  return Season.completeSortie(b.report, b.kit, b.pilots, b.call);
};

/* ============================================================================
   INCIDENTS — the things that happen to a squadron between the fighting. Each
   one is a decision with a cost either way; none is free. Content lives here,
   which does mean small functions in the data block rather than pure values.
   ========================================================================== */
const INCIDENTS = [
  { id:'landing', weight:4, cooldown:9,
    ctx(s){ const men = Season.activePilots().filter(p => p.sorties > 0);
      const ac = Season.serviceable();
      return men.length && ac.length ? { pilot: Rand.pick(men), aircraft: Rand.pick(ac) } : null; },
    text(c){ return `<b>${Pilot.name(c.pilot)}</b> put ${c.aircraft.serial} down badly last evening — ` +
      `undercarriage collapsed on the far side of the field. The airframe is repairable.`; },
    options: [
      { label:'Repair it properly', apply(s,c){ c.aircraft.repairUntil = s.day + 4;
          return `${c.aircraft.serial} off the line for four days for a proper repair.`; } },
      { label:'Rush it back on the line', apply(s,c){
          if (Rand.chance(0.35)){ c.aircraft.repairUntil = s.day + 6;
            return `${c.aircraft.serial} was rushed and went unserviceable again. Six days now.`; }
          c.aircraft.repairUntil = s.day + 1;
          return `${c.aircraft.serial} patched up overnight, back on the line tomorrow.`; } }
    ] },

  { id:'stale', weight:4, cooldown:6,
    ctx(){ const tired = Season.activePilots().filter(p => p.fatigue > 62).sort((a,b) => b.fatigue - a.fatigue);
      return tired.length ? { pilot: tired[0] } : null; },
    text(c){ return `The adjutant has a word about <b>${Pilot.name(c.pilot)}</b>. ` +
      `He is not sleeping, and he was slow off the mark twice yesterday. He has flown ${c.pilot.sorties} sorties.`; },
    options: [
      { label:'Give him a 48-hour pass', apply(s,c){
          c.pilot.resting = true; c.pilot.restUntil = s.day + 2;
          c.pilot.fatigue = clamp(c.pilot.fatigue - 45, 0, 100);
          c.pilot.morale = clamp(c.pilot.morale + 14, 0, 100);
          return `<b>${Pilot.name(c.pilot)}</b> sent on a 48-hour pass.`; } },
      { label:'Keep him on the state', apply(s,c){
          c.pilot.morale = clamp(c.pilot.morale - 9, 0, 100);
          return `<b>${Pilot.name(c.pilot)}</b> stays on the state. He did not argue.`; } }
    ] },

  { id:'green', weight:3, cooldown:8,
    ctx(){ const green = Season.activePilots().filter(p => p.hours < 75 && p.sorties < 3);
      return green.length ? { pilot: Rand.pick(green) } : null; },
    text(c){ return `<b>${Pilot.name(c.pilot)}</b> has ${c.pilot.hours} hours on type and has not yet ` +
      `fired his guns in anger. The flight commander wants him worked up before he goes on a squadron show.`; },
    options: [
      { label:'Sector reconnaissance first', apply(s,c){
          c.pilot.resting = true; c.pilot.restUntil = s.day + 1;
          c.pilot.hours += 4;
          c.pilot.seen.airmanship += 3; c.pilot.seen.awareness += 2; c.pilot.seen.gunnery += 1;
          return `<b>${Pilot.name(c.pilot)}</b> flown on local reconnaissance and gunnery. Off the state today.`; } },
      { label:'Put him straight in the line', apply(s,c){
          c.pilot.morale = clamp(c.pilot.morale - 5, 0, 100);
          return `<b>${Pilot.name(c.pilot)}</b> goes on the state as he is.`; } }
    ] },

  { id:'engine', weight:3, cooldown:12,
    ctx(){ const ac = Season.serviceable(); return ac.length ? { aircraft: Rand.pick(ac) } : null; },
    text(c){ return `The flight sergeant is unhappy about ${c.aircraft.serial}. ` +
      `Oil pressure fluctuating on the ground run, and he cannot find why.`; },
    options: [
      { label:'Ground it and strip the engine', apply(s,c){ c.aircraft.repairUntil = s.day + 2;
          return `${c.aircraft.serial} grounded for two days while the engine is stripped.`; } },
      { label:'Fly it and see', apply(s,c){
          if (Rand.chance(0.30)){ c.aircraft.repairUntil = s.day + 7;
            return `${c.aircraft.serial} threw a con-rod on start-up. Seven days for a new engine.`; }
          return `${c.aircraft.serial} ran perfectly all day. The flight sergeant is unconvinced.`; } }
    ] },

  { id:'bombed', weight:5, cooldown:7,
    ctx(s){ const ph = Season.phase().name;
      if (!Season.group().front) return null;
      if (!/Adler|airfield|London/.test(ph)) return null;
      return { }; },
    text(){ return `Sector reports a large plot building over the Pas de Calais, and this station is ` +
      `thought to be the target. There is time to disperse the aircraft, or to hold them at readiness.`; },
    options: [
      { label:'Disperse to the satellite', apply(s){
          const ac = Season.serviceable();
          for (let i = 0; i < Math.floor(ac.length/2); i++) ac[i].repairUntil = s.day + 1;
          return `Aircraft dispersed. Half the squadron will not be at readiness today.`; } },
      { label:'Hold at readiness', apply(s){
          if (Rand.chance(0.35)){
            const ac = Season.serviceable(); let n = 0;
            for (let i = 0; i < Math.min(3, ac.length); i++){ ac[i].lost = true; n++; }
            let extra = '';
            const men = Season.activePilots().filter(x => !x.resting);
            if (men.length && Rand.chance(0.4)){
              const hero = Rand.pick(men);
              hero.groundGallantry = true;
              extra = ` <b>${Pilot.name(hero)}</b> went into the burning dispersal after the ` +
                      `telephone orderly and brought him out.`;
            }
            return `The station was bombed. <b>${n} aircraft destroyed on the ground</b> and the ` +
              `dispersal hut demolished.` + extra; }
          return `The raid went elsewhere. The squadron stayed at readiness and lost nothing.`; } }
    ] },

  // Dowding's harmonisation was 400 yards. A good many squadrons had their
  // armourers re-set the guns to 250, against orders, because a Spitfire's
  // eight rifle-calibre guns were only lethal when they all arrived together.
  // 74 Squadron did it under Malan. It is a real trade: the spread forgives
  // poor marksmanship, the close set is deadly and demands it.
  { id:'harmonise', weight:6, cooldown:400,
    ctx(s){
      if (s.harmonisation === 'close_250') return null;
      if (s.tally.sorties < 24) return null;
      const gunners = Season.activePilots().filter(p => p.truth.gunnery >= 13).length;
      return { gunners, total: Season.activePilots().length };
    },
    text(c){ return `The armourer sergeant has been talking to a friend at Biggin Hill. ` +
      `They are re-setting their guns to converge at 250 yards instead of the 400 in the ` +
      `book \u2014 against orders, but they say the eight guns only tell when they all ` +
      `arrive in the same place at once. He can do it tonight if you say so.`; },
    options: [
      { label:'Have him do it \u2014 250 yards', apply(s,c){
          s.harmonisation = 'close_250';
          return `The guns are re-harmonised to 250 yards overnight. It is not in the book, ` +
            `and the men who can shoot will feel the difference. The men who cannot will ` +
            `hit nothing at all.` + (c.gunners < c.total/3
              ? ' <i>You have rather a lot of pilots who cannot yet shoot.</i>' : ''); } },
      { label:'Leave them at 400 as laid down', apply(s){
          s.harmonisation = 'dowding_400';
          return `The guns stay at 400 yards. The sergeant does not argue, and does not ` +
            `look convinced either.`; } }
    ] },

  // The engineer officer, with something the squadron could have if you can
  // spare the aircraft. Saying yes costs you strength now for strength later.
  { id:'upgrade', weight:7, cooldown:16,
    ctx(s){
      const stamp = String(s.date.getUTCMonth()+1).padStart(2,'0') + '-' +
                    String(s.date.getUTCDate()).padStart(2,'0');
      s.upgrades = s.upgrades || {};
      const open = CAMPAIGN.upgrades.filter(u => !s.upgrades[u.id] && stamp >= u.from);
      if (!open.length) return null;
      if (Season.serviceable().length < 6) return null;
      return { up: Rand.pick(open) };
    },
    text(c){ return c.up.offer + ` <i>${c.up.note}</i>`; },
    options: [
      { label:'Have it done', apply(s,c){
          const u = c.up;
          s.upgrades = s.upgrades || {};
          s.upgrades[u.id] = true;
          const serv = Season.serviceable();
          // The offer was made this morning; by now the squadron may have fewer
          // aircraft than it had. Never ground more than are actually there.
          const n = Math.min(serv.length, Math.max(1, Math.round(serv.length * u.grounds)));
          for (let i = 0; i < n; i++) serv[i].repairUntil = s.day + u.takes;
          return `<b>${u.name}</b> — the fitters start tonight. ${n} aircraft off the ` +
            `line for ${u.takes} days. You will be flying short until they are back.`; } },
      { label:'Not now — we cannot spare the aircraft', apply(s,c){
          return `The ${c.up.name.toLowerCase()} will have to wait. The engineer officer ` +
            `notes it in his book and does not say anything.`; } }
    ] },

  { id:'sick', weight:1, cooldown:34,
    ctx(){ const men = Season.activePilots(); return men.length ? { pilot: Rand.pick(men) } : null; },
    text(c){ return `The MO has looked at <b>${Pilot.name(c.pilot)}</b> — a heavy cold and a temperature. ` +
      `At 20,000 feet that means a burst eardrum. He says he is perfectly fit.`; },
    options: [
      { label:'Ground him', apply(s,c){ c.pilot.resting = true; c.pilot.restUntil = s.day + 2;
          return `<b>${Pilot.name(c.pilot)}</b> grounded by the MO for two days.`; } },
      { label:'Take his word for it', apply(s,c){
          c.pilot.fatigue = clamp(c.pilot.fatigue + 22, 0, 100);
          return `<b>${Pilot.name(c.pilot)}</b> stays on the state, and looks worse for it.`; } }
    ] },

  // Off duty. Rare, and nothing to do with the Luftwaffe — Fighter Command lost
  // men to the blackout roads all through 1940.
  { id:'motor', weight:1, cooldown:400,
    ctx(s){ const men = Season.activePilots().filter(p => !p.isCommander);
      // Once in a campaign at the very most, and never in the first weeks.
      if (s.day < 30 || !Rand.chance(0.4)) return null;
      return men.length > 3 ? { pilot: Rand.pick(men), other: Rand.pick(men) } : null; },
    text(c){ return `<b>${Pilot.name(c.pilot)}</b> put the mess Humber into a ditch coming back from ` +
      `the Bell in the blackout last night. He is in the sick quarters and the adjutant wants to know ` +
      `what goes in the book.`; },
    options: [
      { label:'Report it as it happened', apply(s,c){
          c.pilot.status = 'wounded';
          c.pilot.injury = { id:'motor', name:'Injuries from a motor accident', since:s.day };
          c.pilot.backOn = s.day + Rand.int(6, 20);
          s.standing = clamp(s.standing - 5, 0, 100);
          return `<b>${Pilot.name(c.pilot)}</b> is off flying until about ${Season.dateFor(c.pilot.backOn)}. ` +
            `Group has taken a dim view.`; } },
      { label:'Enter it as a flying accident', apply(s,c){
          c.pilot.status = 'wounded';
          c.pilot.injury = { id:'motor', name:'Injuries from a crash landing', since:s.day };
          c.pilot.backOn = s.day + Rand.int(6, 20);
          if (Rand.chance(0.30)){
            s.standing = clamp(s.standing - 12, 0, 100);
            return `The story did not hold. Group knows exactly what happened, and thinks less of you for it.`;
          }
          return `It goes in the book as a heavy landing. <b>${Pilot.name(c.pilot)}</b> is off flying ` +
            `until about ${Season.dateFor(c.pilot.backOn)}.`; } }
    ] },

  { id:'oxygen', weight:2, cooldown:25,
    ctx(){ const men = Season.activePilots().filter(p => !p.resting);
      return men.length ? { pilot: Rand.pick(men) } : null; },
    text(c){ return `<b>${Pilot.name(c.pilot)}</b> came back grey and shaking yesterday — the oxygen ` +
      `economiser in his aircraft is suspect above 20,000 feet, and the equipment section cannot ` +
      `find the fault on the ground.`; },
    options: [
      { label:'Ground the aircraft until it is found', apply(s){
          const ac = Season.serviceable();
          if (ac.length) ac[0].repairUntil = s.day + Rand.int(2,4);
          return `The aircraft is off the line while the oxygen system is stripped.`; } },
      { label:'Restrict him to low patrols', apply(s,c){
          c.pilot.seen.airmanship = (c.pilot.seen.airmanship||0) + 1;
          c.pilot.morale = clamp(c.pilot.morale - 4, 0, 100);
          return `<b>${Pilot.name(c.pilot)}</b> flies below fifteen thousand until it is sorted.`; } }
    ] },

  { id:'met', weight:2, cooldown:11,
    ctx(){ return Season.activePilots().length >= 6 ? { } : null; },
    text(){ return `The met officer expects the front to clear by midday but will not commit himself. ` +
      `Holding the whole squadron at readiness all morning will cost the men something.`; },
    options: [
      { label:'Release half the squadron', apply(s){
          const men = Season.readyPilots(); let n = 0;
          for (let i = men.length - 1; i >= Math.ceil(men.length/2); i--){
            men[i].resting = true; men[i].restUntil = s.day + 1; n++; }
          return `${n} pilots released until this evening.`; } },
      { label:'Full readiness from dawn', apply(s){
          for (const p of Season.readyPilots()) p.fatigue = clamp(p.fatigue + 7, 0, 100);
          return `The squadron sat at readiness from first light.`; } }
    ] }
];
